/* ════════════════════════════════════════════
   TAX CALCULATOR PAGE
   ════════════════════════════════════════════ */
// KPI-style summary card used on the Tax page (6 instances: Reembolso Dupla
// Tributação, Imposto Líquido, Capital Gains Tax, Comissões, Dividend Tax, Juros
// Tax). Hoisted to top level — was previously defined inside TaxCalcPage's
// render body and used as a JSX component 6 times, forcing 6 full unmount/
// remounts on every re-render of the page.
function SummaryCard({label,value,sub,icon,accent,tooltip}){
  const col=accent==='red'?'var(--red)':accent==='green'?'var(--green)':accent==='blue'?'var(--blue)':'#e2e8f0';
  return h('div',{style:{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:10,padding:16,minWidth:0}},
    h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}},
      h('div',{style:{fontSize:13,color:'var(--muted)',letterSpacing:'.06em',textTransform:'uppercase',display:'flex',alignItems:'center',gap:5}},
        label,tooltip&&h(InfoTooltip,{text:tooltip})),
      h('span',{style:{fontSize:16,color:'var(--muted)'}},icon)
    ),
    h('div',{style:{fontSize:26,fontWeight:700,color:col,marginTop:8}},value),
    h('div',{style:{fontSize:12,color:'var(--muted)',marginTop:4}},sub)
  );
}
// ── Imposto Pago por Ano (dividendos + juros + mais-valias), shown on the Tax page ──
function TaxPaidByYear({pos,sold,income,wealth,cfg}){
    const pc=cfg?.posCountry||{};
    // M2 FIX: derive start year from actual data, not hardcoded >= 2023
    const dataStartYear=Math.min(
      ...[...(pos||[]),...(sold||[])].flatMap(p=>(p.transactions||[]).map(t=>parseInt(t.date?.slice(0,4)||'9999'))),
      ...Object.values(income||{}).flatMap(yr=>Object.keys(yr).map(Number)),
      CUR_YEAR
    );
    const TAX_YEARS=YEARS.filter(y=>y>=Math.max(2020,dataStartYear));
    const fxL=makeFxLookup(cfg);
    const TAX_RATE=cfg?.taxRate||0.28;
    const capitalGains=applyAnnualCapitalGainsTax(buildCapitalGainsEvents(pos,sold,fxL.on,TAX_RATE));

    const taxRows=TAX_YEARS.map(y=>{
      let whtPaid=0,irsDiv=0,totalDiv=0;
      let totalJuros=0,irsJuros=0;
      let totalGains=0,irsGains=0;

      // ── Dividendos: activas ──
      pos.forEach(p=>{
        const div=getIncomeYear(income,p.t,y);
        if(!div)return;
        const divEur=p.cat==='USD'?div/fxL.avg(String(y)):div;
        totalDiv+=divEur;
        const flag=p.country||pc[p.t]||'🌐';
        const whtRate=whtRateForCountry(cfg,flag);
        const whtAmt=divEur*whtRate;
        whtPaid+=whtAmt;
        irsDiv+=Math.max(0,divEur*TAX_RATE-whtAmt);
      });

      // ── Dividendos: vendidas ──
      (sold||[]).forEach(p=>{
        const div=getSoldDivByYear(p,y);
        if(!div)return;
        const divEur=p.cat==='USD'?div/fxL.avg(String(y)):div;
        totalDiv+=divEur;
        const flag=p.country||pc[p.t]||'🌐';
        const whtRate=whtRateForCountry(cfg,flag);
        const whtAmt=divEur*whtRate;
        whtPaid+=whtAmt;
        irsDiv+=Math.max(0,divEur*TAX_RATE-whtAmt);
      });

      // ── Juros (Certificados de Aforro + Depósitos) ──
      const ys=String(y);
      (wealth?.juros||[]).forEach(r=>{
        const j=r[ys]||0;
        if(!j)return;
        totalJuros+=j;
        irsJuros+=j*TAX_RATE; // sem WHT, tributa 28% directamente
      });
      (wealth?.aforro||[]).forEach(r=>{
        // aforro stores total juros not per-year — skip to avoid double-count
        // only use if r has per-year breakdown
        const j=r[ys]||0;
        if(!j)return;
        totalJuros+=j;
        irsJuros+=j*TAX_RATE;
      });

      const yearGains=capitalGains.events.filter(event=>event.date.startsWith(ys));
      totalGains=yearGains.reduce((sum,event)=>sum+Math.max(0,event.plEur),0);
      const totalLosses=yearGains.reduce((sum,event)=>sum+Math.max(0,-event.plEur),0); // menos-valias realizadas no ano
      irsGains=capitalGains.taxByYear[ys]||0;

      const totalIrs=irsDiv+irsJuros+irsGains;
      const totalTax=whtPaid+totalIrs;
      const totalIncome=totalDiv+totalJuros+totalGains;
      const taxDiv=whtPaid+irsDiv;   // dividendos: WHT retido + complemento IRS
      const taxJuros=irsJuros;       // juros: IRS directo (sem WHT)
      const taxGains=irsGains;       // mais-valias: IRS directo
      return{y,totalDiv,totalJuros,totalGains,totalLosses,whtPaid,irsDiv,irsJuros,irsGains,totalIrs,totalTax,totalIncome,taxDiv,taxJuros,taxGains};
    });

    const G=k=>taxRows.reduce((s,r)=>s+r[k],0);
    const grandDiv=G('totalDiv'),grandJuros=G('totalJuros'),grandGains=G('totalGains'),grandLosses=G('totalLosses');
    const grandWht=G('whtPaid'),grandIrs=G('totalIrs'),grandTax=G('totalTax');
    const grandIncome=G('totalIncome');

    // Only show years that actually had tax due (or income), so years like 2022 with
    // nothing to tax don't clutter the chart/table. Current year always stays visible.
    const visibleTaxRows=taxRows.filter(r=>r.totalTax>0||r.totalIncome>0||r.totalLosses>0||r.y===CUR_YEAR);

    /* ── Stacked bar chart: composição do IRS por ano ── */
    const COL_DIV='#ef4444',COL_JUROS='#7f1d1d',COL_GAINS='#fca5a5';
    const maxBar=Math.max(...visibleTaxRows.map(r=>r.taxDiv+r.taxJuros+r.taxGains),1);
    const niceMax=Math.ceil(maxBar/150)*150||150;
    const gridLines=[0,0.25,0.5,0.75,1].map(f=>Math.round(niceMax*f));
    const barChart=h('div',{className:'card mt-4'},
      h('div',{className:'flex items-center gap-2.5 mb-3.5'},
        h('h3',{className:'font-bold text-[13px] tracking-[.06em] uppercase whitespace-nowrap text-slate-200'},'Composição do IRS por Ano'),
        h(InfoTooltip,{text:'Cada barra representa o imposto pago no ano (WHT + IRS), dividido por origem: Dividendos, Juros e Mais-valias.',side:'right'}),
        h('div',{className:'flex-1 h-px bg-[var(--border)]'})
      ),
      h('div',{style:{position:'relative',height:200,display:'flex'}},
        // Y axis labels
        h('div',{style:{display:'flex',flexDirection:'column',justifyContent:'space-between',paddingRight:8,paddingBottom:24}},
          [...gridLines].reverse().map((v,i)=>h('div',{key:i,style:{fontSize:11,color:'var(--muted)',textAlign:'right',minWidth:36}},'€'+v))
        ),
        // Chart area
        h('div',{style:{flex:1,position:'relative',display:'flex',alignItems:'flex-end',gap:8,paddingBottom:24,borderLeft:'1px solid var(--border)'}},
          // horizontal grid lines
          gridLines.map((v,i)=>h('div',{key:i,style:{
            position:'absolute',left:0,right:0,bottom:(24+v/niceMax*176)+'px',
            borderTop:'1px dashed var(--border)',opacity:.4
          }})),
          visibleTaxRows.map(r=>{
            const total=r.taxDiv+r.taxJuros+r.taxGains;
            const hDiv=total>0?(r.taxDiv/niceMax*176):0;
            const hJuros=total>0?(r.taxJuros/niceMax*176):0;
            const hGains=total>0?(r.taxGains/niceMax*176):0;
            return h('div',{key:r.y,style:{flex:1,display:'flex',flexDirection:'column',alignItems:'center',position:'relative',height:'100%',justifyContent:'flex-end'}},
              h('div',{style:{width:'70%',display:'flex',flexDirection:'column-reverse',borderRadius:'3px 3px 0 0',overflow:'hidden',minHeight:total>0?2:0}},
                h('div',{style:{height:hDiv+'px',background:COL_DIV,transition:'height .3s'},title:'Imposto Dividendos: €'+fn(r.taxDiv)}),
                h('div',{style:{height:hJuros+'px',background:COL_JUROS,transition:'height .3s'},title:'Imposto Juros: €'+fn(r.taxJuros)}),
                h('div',{style:{height:hGains+'px',background:COL_GAINS,transition:'height .3s'},title:'Imposto Mais-valias: €'+fn(r.taxGains)}),
              ),
              h('div',{style:{position:'absolute',bottom:-22,fontSize:12,fontWeight:r.y===CUR_YEAR?700:400,color:r.y===CUR_YEAR?'var(--gold)':'var(--muted)'}},String(r.y))
            );
          })
        )
      ),
      h('div',{className:'flex gap-4 mt-2',style:{justifyContent:'center'}},
        [['Dividendos',COL_DIV],['Juros',COL_JUROS],['Mais-valias',COL_GAINS]].map(([label,col])=>
          h('div',{key:label,className:'flex items-center gap-1.5'},
            h('span',{style:{width:10,height:10,borderRadius:2,background:col,display:'inline-block'}}),
            h('span',{style:{fontSize:12,color:'var(--muted)'}},label)
          )
        )
      )
    );

    return h('div',null,
      h(Shdr,{title:'Imposto Pago por Ano',hint:'Dividendos + Juros + Mais-valias · estimativa indicativa'}),
      barChart,
      h('div',{className:'flex flex-wrap gap-6 mb-3 mt-4'},
        h('div',null,
          h('div',{className:'text-[9px] text-[var(--muted)] uppercase tracking-widest'},'WHT retido'),
          h('div',{style:{fontSize:18,fontWeight:700,color:'var(--red)'}},'-€'+fn(grandWht))
        ),
        h('div',null,
          h('div',{className:'text-[9px] text-[var(--muted)] uppercase tracking-widest'},'IRS estimado'),
          h('div',{style:{fontSize:18,fontWeight:700,color:'var(--tier-warn)'}},'-€'+fn(grandIrs))
        ),
        h('div',null,
          h('div',{className:'text-[9px] text-[var(--muted)] uppercase tracking-widest'},'Imposto total'),
          h('div',{style:{fontSize:18,fontWeight:700,color:'var(--red)'}},'-€'+fn(grandTax))
        ),
        h('div',null,
          h('div',{className:'text-[9px] text-[var(--muted)] uppercase tracking-widest'},'Rendimento total'),
          h('div',{style:{fontSize:18,fontWeight:700,color:'var(--green)'}},'+€'+fn(grandIncome))
        ),
      ),
      h('div',{className:'card-table overflow-x-auto'},
        h('table',{style:{width:'100%',borderCollapse:'collapse',fontSize:13}},
          h('thead',null,h('tr',null,
            h('th',{className:'text-left'},'Ano'),
            h('th',{className:'text-right'},'Dividendos'),
            h('th',{className:'text-right'},'Juros'),
            h('th',{className:'text-right'},'Mais-valias'),
            h('th',{className:'text-right'},'Menos-valias'),
            h('th',{className:'text-right'},'WHT retido'),
            h('th',{className:'text-right'},'IRS total (est.)'),
            h('th',{className:'text-right'},'Total Imposto'),
          )),
          h('tbody',null,
            ...visibleTaxRows.map(r=>h('tr',{key:r.y,style:{borderBottom:'1px solid var(--s2)',background:r.y===CUR_YEAR?'rgba(251,146,60,.06)':''}},
              h('td',{style:{padding:'8px 12px',fontWeight:600,color:r.y===CUR_YEAR?'var(--gold)':'var(--text)'}},String(r.y)),
              h('td',{style:{padding:'8px 10px',textAlign:'right',color:'var(--green)'}},r.totalDiv>0?'+€'+fn(r.totalDiv):'—'),
              h('td',{style:{padding:'8px 10px',textAlign:'right',color:'var(--green)'}},r.totalJuros>0?'+€'+fn(r.totalJuros):'—'),
              h('td',{style:{padding:'8px 10px',textAlign:'right',color:'var(--green)'}},r.totalGains>0?'+€'+fn(r.totalGains):r.totalGains<0?h('span',{style:{color:'var(--muted)'}},'perda'):'—'),
              h('td',{title:'Perdas realizadas nas vendas do ano (compensam as mais-valias do mesmo ano)',style:{padding:'8px 10px',textAlign:'right',color:'var(--red)'}},r.totalLosses>0?'-€'+fn(r.totalLosses):'—'),
              h('td',{style:{padding:'8px 10px',textAlign:'right',color:'var(--red)'}},r.whtPaid>0?'-€'+fn(r.whtPaid):'—'),
              h('td',{style:{padding:'8px 10px',textAlign:'right',color:'var(--tier-warn)'}},r.totalIrs>0?'-€'+fn(r.totalIrs):'—'),
              h('td',{style:{padding:'8px 10px',textAlign:'right',fontWeight:700,color:'var(--red)'}},r.totalTax>0?'-€'+fn(r.totalTax):'—')
            )),
            h('tr',{style:{background:'var(--s2)',fontWeight:700}},
              h('td',{style:{padding:'8px 12px',color:'var(--gold)'}},'TOTAL'),
              h('td',{style:{padding:'8px 10px',textAlign:'right',color:'var(--green)'}},'+€'+fn(grandDiv)),
              h('td',{style:{padding:'8px 10px',textAlign:'right',color:'var(--green)'}},grandJuros>0?'+€'+fn(grandJuros):'—'),
              h('td',{style:{padding:'8px 10px',textAlign:'right',color:'var(--green)'}},grandGains>0?'+€'+fn(grandGains):'—'),
              h('td',{style:{padding:'8px 10px',textAlign:'right',color:'var(--red)'}},grandLosses>0?'-€'+fn(grandLosses):'—'),
              h('td',{style:{padding:'8px 10px',textAlign:'right',color:'var(--red)'}},' -€'+fn(grandWht)),
              h('td',{style:{padding:'8px 10px',textAlign:'right',color:'var(--tier-warn)'}},' -€'+fn(grandIrs)),
              h('td',{style:{padding:'8px 10px',textAlign:'right',color:'var(--red)',fontWeight:800}},' -€'+fn(grandTax))
            )
          )
        )
      ),
      h('div',{style:{fontSize:11,color:'var(--muted)',marginTop:6}},
        ''
      )
    );
}

function TaxCalcPage({pos,income,qual,sold,cfg,wealth}){
  const wealthJuros=(wealth?.juros)||[];
  const YEARS=useMemo(()=>{
    const s=new Set();
    (sold||[]).forEach(p=>{
      if(p.exit)s.add(p.exit.slice(0,4));
      (p.transactions||[]).filter(tx=>tx.type==='sell'&&tx.date).forEach(tx=>s.add(tx.date.slice(0,4)));
      // Also add years where sold position had dividends
      Object.entries(p.divByYear||{}).forEach(([y,v])=>{ if(v>0)s.add(y); });
    });
    (pos||[]).forEach(p=>(p.transactions||[]).filter(tx=>tx.type==='sell'&&tx.date).forEach(tx=>s.add(tx.date.slice(0,4))));
    Object.values(income||{}).forEach(byTicker=>Object.keys(byTicker).forEach(y=>{ if(byTicker[y]>0)s.add(y); }));
    const arr=[...s].sort((a,b)=>b-a);
    return arr.length?arr:[String(new Date().getFullYear())];
  },[sold,pos,income]);

  const[year,setYear]=useState(String(CUR_YEAR));
  const[ctryFlt,setCtryFlt]=useState('ALL');

  /* ── Tax Rules ── */
  const divTaxRate=(cfg?.taxRate||0.28)*100;

  const TAX_RATE=divTaxRate/100;

  /* Compute CG rate based on holding period (tiered, Portuguese IRS) —
     wraps the shared top-level cgRateForHoldingBase (single source of truth). */

  // Use shared top-level calcHoldingYears; default to 0 if null (no dates available)

  /* Withholding tax rates by country flag — wraps the shared top-level
     whtRateForCountry, which reads cfg.whtByCountry (the same source of truth
     shown in the "Reembolso Dupla Tributação — por país" table and used by Analytics). */
  const whtRateFor=country=>whtRateForCountry(cfg,country);

  /* Build ticker -> country map: p.country takes priority, then cfg.posCountry */
  const tickerCountry=useMemo(()=>{
    const pc=cfg?.posCountry||{};
    const m={};
    // seed from cfg.posCountry (keyed by raw ticker), normalise keys
    Object.entries(pc).forEach(([t,c])=>{ m[normTicker(t)]=c; m[t]=c; });
    // override with per-position p.country, store both raw and normalised
    [...(pos||[]),...(sold||[])].forEach(p=>{
      if(p.country){ m[p.t]=p.country; m[normTicker(p.t)]=p.country; }
    });
    return m;
  },[pos,sold,cfg]);

  /* Capital Gains: FIFO per-transaction for selected year
     Sources:
     1. sold[] positions — use transactions if present, fallback to flat n/av/sv
     2. active pos[] with sell transactions in selected year                    */
  const fxL=useMemo(()=>makeFxLookup(cfg),[cfg]);
  const cgRows=useMemo(()=>{
    const events=buildCapitalGainsEvents(pos,sold,fxL.on,TAX_RATE);
    // Everything shown on this page is in EUR: tax = the event's share of the year's tax.
    return applyAnnualCapitalGainsTax(events).events
      .map(event=>({...event,tax:event.taxEur||0}))
      .filter(event=>year==='ALL'||event.date.startsWith(year))
      .sort((a,b)=>new Date(b.date)-new Date(a.date));
  },[sold,pos,year,TAX_RATE,fxL]);

  const cgTotals=useMemo(()=>cgRows.reduce((a,r)=>({
    proceeds:a.proceeds+(r.proceedsEur||0),
    cost:a.cost+(r.costEur||0),
    pl:a.pl+(r.plEur||0),
    tax:a.tax+(r.taxEur||0),
    fee:a.fee+(r.feeEur||0),
  }),{proceeds:0,cost:0,pl:0,tax:0,fee:0}),[cgRows]);
  // Dividends: USD converted at the average ECB rate of each year.
  const divToEur=(byYear,cat)=>{
    if(cat!=='USD')return yearVal(byYear,year);
    if(year!=='ALL')return(byYear?.[year]||0)/fxL.avg(String(year));
    return Object.entries(byYear||{}).filter(([k])=>YEARS.includes(k)||YEARS.includes(parseInt(k))).reduce((s,[k,v])=>s+(v||0)/fxL.avg(String(k)),0);
  };

  const yearVal=(byYear,y)=>{
    if(y==='ALL')return Object.entries(byYear||{}).filter(([k])=>YEARS.includes(k)||YEARS.includes(parseInt(k))).reduce((s,[,v])=>s+(v||0),0);
    return byYear?.[y]||0;
  };

  /* Dividend Tax: income entries + sold divByYear for selected year, WHT driven by country */
  const divRows=useMemo(()=>{
    if(!income&&!(sold||[]).length)return[];
    const posMap=buildPosMap(pos||[]);

    // Open positions from income object
    const openRows=Object.entries(income||{})
      .map(([ticker,byYear])=>{
        const gross=yearVal(byYear,year);
        if(gross<=0)return null;
        const country=tickerCountry[ticker]||'🌐';
        const p=posMap[ticker]||posMap[normTicker(ticker)];
        const cat=p?.cat||'EUR';
        const grossEUR=divToEur(byYear,cat); // tax is owed/paid in EUR
        const whtRate=whtRateFor(country);
        const netTaxRate=Math.max(0,TAX_RATE-whtRate);
        const withheld=grossEUR*whtRate;
        const taxLocal=grossEUR*netTaxRate;
        const sym=currencySymbol(cat);
        return{ticker,gross,grossEUR,withheld,whtRate,netTaxRate,taxLocal,country,source:'open',cat,sym};
      })
      .filter(Boolean);

    // Sold positions that had dividends in selected year (via divByYear)
    const soldRows=(sold||[])
      .map(p=>{
        const gross=yearVal(p.divByYear,year);
        if(gross<=0)return null;
        const country=tickerCountry[p.t]||p.country||'🌐';
        const cat=p.cat||'EUR';
        const grossEUR=divToEur(p.divByYear,cat);
        const whtRate=whtRateFor(country);
        const netTaxRate=Math.max(0,TAX_RATE-whtRate);
        const withheld=grossEUR*whtRate;
        const taxLocal=grossEUR*netTaxRate;
        const sym=currencySymbol(cat);
        return{ticker:p.t,name:p.name,gross,grossEUR,withheld,whtRate,netTaxRate,taxLocal,country,source:'sold',cat,sym};
      })
      .filter(Boolean);

    return [...openRows,...soldRows].sort((a,b)=>b.gross-a.gross);
  },[income,sold,pos,year,TAX_RATE,tickerCountry,cfg,fxL]);

  const divTotal=useMemo(()=>divRows.reduce((a,r)=>({
    gross:a.gross+r.gross,
    grossEUR:a.grossEUR+r.grossEUR,
    withheld:a.withheld+r.withheld,
    taxLocal:a.taxLocal+r.taxLocal,
  }),{gross:0,grossEUR:0,withheld:0,taxLocal:0}),[divRows]);

  const jurosTaxTotal=useMemo(()=>
    (wealthJuros||[]).reduce((s,r)=>{
      const bruto=yearVal(r,year);
      if(!bruto)return s;
      const flag=r.country||'🇵🇹';
      const whtRate=whtRateFor(flag);
      const whtAmt=bruto*whtRate;
      const irs=Math.max(0,bruto*TAX_RATE-whtAmt);
      return s+whtAmt+irs;
    },0)
  ,[wealthJuros,year,cfg,TAX_RATE]);


  const fe=v=>'\u20ac'+Math.abs(v).toFixed(2);
  const fp=v=>{ const s=v>=0?'+':'-'; return s+'\u20ac'+Math.abs(v).toFixed(2); };
  const fpc=v=>(v*100).toFixed(1)+'%';
  const plCol=v=>v>=0?'var(--green)':'var(--red)';

  // Groups divRows (already filtered by the selected Tax Year, same source as
  // the 'Reembolso Dupla Tributação' summary card) by country of origin, so
  // the explanation card below always matches whatever year is picked.
  const reembolsoByCountry=useMemo(()=>{
    const byC={};
    divRows.forEach(r=>{
      const c=byC[r.country]||(byC[r.country]={grossEUR:0,withheld:0,rate:r.whtRate,tickers:new Set()});
      c.grossEUR+=r.grossEUR;
      c.withheld+=r.withheld;
      c.tickers.add(r.ticker);
    });
    return Object.entries(byC)
      .map(([flag,v])=>({flag,name:(cfg?.whtByCountry||{})[flag]?.name||flag,domestic:domesticWhtRate(cfg,flag),...v,tickers:[...v.tickers].sort()}))
      .sort((a,b)=>b.withheld-a.withheld);
  },[divRows,cfg]);

  return h('div',{style:{padding:'0 0 40px'}},
    /* Header */
    h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:24}},
            h('div',{style:{display:'flex',alignItems:'center',gap:10}},
        h('span',{className:'text-xs text-[var(--muted)]'},'Tax Year:'),
        h('select',{value:year,onChange:e=>setYear(e.target.value),
          style:{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:6,
                 color:'var(--text)',fontSize:13,padding:'4px 10px',cursor:'pointer'}},
          [String(CUR_YEAR),...YEARS.filter(y=>y!==String(CUR_YEAR))].map(y=>h('option',{key:y,value:y},y)),
          h('option',{value:'ALL'},'Todos os Anos')
        )
      )
    ),

    /* Summary cards */
    h('div',{className:'summary-grid-6',style:{marginBottom:28}},
      h(SummaryCard,{label:'Reembolso Dupla Tributação',icon:null,accent:'green',
        value:'+\u20ac'+divTotal.withheld.toFixed(2),
        sub:'Imposto retido no estrangeiro'}),
      h(SummaryCard,{label:'Imposto Líquido a Pagar',icon:null,accent:'red',
        value:'-\u20ac'+Math.max(0,cgTotals.tax+divTotal.taxLocal).toFixed(2),
        sub:'already Tax withhold (\u20ac'+divTotal.withheld.toFixed(2)+')'}),
      h(SummaryCard,{label:'Capital Gains Tax',icon:null,accent:'red',
        tooltip:'Usa a escala de redução por tempo de detenção (Lei 31/2024): 28% até 2 anos, 25,2% dos 2-5, 22,4% dos 5-8, 19,6% acima de 8 anos. Diferente da taxa fixa 28% usada no card "Tax Harvesting" abaixo. Valores em USD convertidos à taxa de referência do BCE do dia de cada venda (receita) e de cada compra (custo), por isso o resultado inclui o ganho ou perda cambial. Actualiza o histórico com o botão BCE em Config.',
        value:'-\u20ac'+cgTotals.tax.toFixed(2),
        sub:cgRows.length+' sale event'+(cgRows.length!==1?'s':'')+' · total €'+cgTotals.pl.toFixed(2)}),
      h(SummaryCard,{label:'Comissões Pagas',icon:null,accent:'red',
        value:'-\u20ac'+cgTotals.fee.toFixed(2),
        sub:cgRows.filter(r=>r.fee>0).length+' venda'+(cgRows.filter(r=>r.fee>0).length!==1?'s':'')+' com comissão · já incluída no P&L'}),
      h(SummaryCard,{label:'Dividend Tax',icon:null,accent:'red',
        value:'-\u20ac'+divTotal.taxLocal.toFixed(2),
        sub:divRows.length+' dividend event'+(divRows.length!==1?'s':'')+' · total €'+divTotal.gross.toFixed(2)+' · retido: €'+divTotal.withheld.toFixed(2)}),
      h(SummaryCard,{label:'Juros Tax',icon:null,accent:'red',
        value:'-\u20ac'+jurosTaxTotal.toFixed(2),
        sub:(()=>{const jr=(wealthJuros||[]).filter(r=>yearVal(r,year)>0);const jg=jr.reduce((s,r)=>s+yearVal(r,year),0);const jw=jr.reduce((s,r)=>{const wht=whtRateFor(r.country||'\uD83C\uDF10');return s+yearVal(r,year)*wht;},0);return jr.length+' juros event'+(jr.length!==1?'s':'')+' · total €'+jg.toFixed(2)+' · retido: €'+jw.toFixed(2);})()})
    ),

    (()=>{
      const wins=cgRows.filter(r=>r.plEur>0);
      const losses=cgRows.filter(r=>r.plEur<0);

                // IRS 28% on gross, credit WHT already withheld
                const irs=Math.max(0,bruto*TAX_RATE-retido);
                const taxTotal=retido+irs;
                const liq=bruto-taxTotal;
                return{bruto,retido,irs,taxTotal,liq,flag};
              };
              const calcs=rows.map(calcRow);
              const tot=(k)=>calcs.reduce((s,r)=>s+r[k],0);
              return[

    /* ── Tax Harvesting ── */
    h('div',{className:'card'},
          h(Shdr,{title:'Tax Harvesting '+(year==='ALL'?'':year),hint:'Vendas realizadas no ano · ganho/perda por FIFO'}),
          (()=>{
            const fx=cfg?.fxEurUsd||1.08;
            const toE=(p,v)=>p.cat==='USD'?v/fx:v;

            // ── Fully closed positions (sold array) ──
            // Uses the same fifoEngine as partialRows below — single source of truth for
            // realized P&L. Previously this used a separate naive n×price calc that
            // silently ignored the fee field (undercounting cost basis and overstating
            // gains whenever a commission was recorded on a buy or sell) — caught when
            // SHELL.AS showed +€9.61 here instead of the correct +€5.36 once its 3€ buy
            // fee and 1.25€ sell fee were recorded.
            const closedRows=(sold||[]).filter(p=>{
              const exitY=p.exit?p.exit.slice(0,4):
                [...(p.transactions||[])].sort((a,b)=>b.date.localeCompare(a.date)).find(t=>t.type==='sell')?.date?.slice(0,4);
              return year==='ALL'||String(exitY)===year;
            }).map(p=>{
              let pl;
              if(p.transactions&&p.transactions.length){
                const{sells}=fifoEngine(p.transactions);
                pl=sells.reduce((s,s2)=>s+s2.realPL,0);
              }else{
                pl=p.n*(p.sv-getAv(p)); // legacy positions with no transaction log — no fee data available either way
              }
              return{ticker:p.t,name:p.name||p.t,pl:toE(p,pl),status:'closed'};
            });

            // ── Partial sells from still-open positions (pos array) ──
            const partialRows=(pos||[]).flatMap(p=>{
              const sells=(p.transactions||[]).filter(t=>t.type==='sell'&&(year==='ALL'||t.date?.slice(0,4)===String(year)));
              if(!sells.length)return[];
              // Use FIFO engine to get realized P&L for each sell
              const fi=fifoEngine(p.transactions||[]);
              const yearSells=fi.sells.filter(s=>year==='ALL'||s.date?.slice(0,4)===String(year));
              const pl=yearSells.reduce((s,s2)=>s+s2.realPL,0);
              if(Math.abs(pl)<0.001)return[];
              return[{ticker:p.t,name:p.name||p.t,pl:toE(p,pl),status:'partial'}];
            });

            const soldInYear=[...closedRows,...partialRows];
            const gains=soldInYear.filter(x=>x.pl>0).sort((a,b)=>b.pl-a.pl);
            const losses=soldInYear.filter(x=>x.pl<0).sort((a,b)=>a.pl-b.pl);
            const totalGains=gains.reduce((s,x)=>s+x.pl,0);
            const totalLosses=losses.reduce((s,x)=>s+x.pl,0);
            const net=totalGains+totalLosses;
            const balanced=Math.abs(net)<Math.abs(totalGains)*0.1;
            return h('div',null,
              h('div',{className:'grid grid-cols-1 sm:grid-cols-2',style:{marginBottom:14,gap:48}},
                h('div',null,
                  h('div',{className:'flex items-center gap-1.5 mb-2'},

                  h('div',{style:{fontSize:20,fontWeight:800,color:'var(--green)',marginBottom:8}},'+€'+fn(totalGains)),
                  h('div',{style:{display:'flex',flexDirection:'column',gap:4}},
                    gains.map(({ticker,pl,status})=>h('div',{key:ticker+status,style:{display:'flex',justifyContent:'space-between',fontSize:12}},

                      h('span',{style:{color:'var(--green)',fontWeight:600}},'+€'+fn(pl))
                    )),
                    gains.length===0&&h('div',{style:{fontSize:12,color:'var(--muted)',fontStyle:'italic'}},'Sem vendas com ganho')
                  )
                ),
                h('div',null,
                  h('div',{className:'flex items-center gap-1.5 mb-2'},
                    h('span',{style:{fontSize:12,fontWeight:700,color:'var(--red)',textTransform:'uppercase',letterSpacing:'.04em'}},'Menos-valias')
                  ),
                  h('div',{style:{fontSize:20,fontWeight:800,color:'var(--red)',marginBottom:8}},'-€'+fn(Math.abs(totalLosses))),
                  h('div',{style:{display:'flex',flexDirection:'column',gap:4}},
                    losses.map(({ticker,pl,status})=>h('div',{key:ticker+status,style:{display:'flex',justifyContent:'space-between',fontSize:12}},
                      h('span',{style:{color:'var(--muted)'}},ticker,status==='partial'&&h('span',{style:{fontSize:11,color:'var(--blue)',marginLeft:4}},'parcial')),
                      h('span',{style:{color:'var(--red)',fontWeight:600}},'-€'+fn(Math.abs(pl)))
                    )),
                    losses.length===0&&h('div',{style:{fontSize:12,color:'var(--muted)',fontStyle:'italic'}},'Sem vendas com perda')
                  )
                )
              ),
              soldInYear.length>0&&h('div',{style:{padding:'10px 14px',background:balanced?'rgba(16,185,129,.08)':'rgba(251,146,60,.08)',
                border:'1px solid '+(balanced?'var(--green)':'var(--tier-warn)'),borderRadius:8,
                display:'flex',justifyContent:'space-between',alignItems:'center'}},
                h('span',{style:{fontSize:12,color:'var(--muted)'}},balanced?'✅ Equilibrado':'⚠️ Desequilibrado'),
                h('span',{style:{fontSize:14,fontWeight:700,color:net>=0?'var(--green)':'var(--red)'}},
                  (net>=0?'+':'')+'€'+fn(net)+' líquido')
              ),
              soldInYear.length>0&&h('div',{style:{padding:'8px 14px',marginTop:8,background:'var(--s2)',
                border:'1px solid var(--border)',borderRadius:8,
                display:'flex',justifyContent:'space-between',alignItems:'center'}},
                h('span',{style:{fontSize:12,color:'var(--muted)',display:'flex',alignItems:'center',gap:5}},
                  'Imposto estimado (taxa autónoma 28% s/ saldo positivo)',
                  h(InfoTooltip,{text:'Estimativa simplificada a 28% fixo, para decidires rapidamente se compensa realizar mais perdas/ganhos. O valor real de imposto (que já usa a escala por tempo de detenção) está no card "Capital Gains Tax" no topo da página.',side:'left'})),
                h('span',{style:{fontSize:14,fontWeight:700,color:net>0?'var(--red)':'var(--muted)'}},
                  net>0?'-€'+fn(net*0.28):'€0,00')
              ),
              soldInYear.length===0&&h('div',{style:{padding:'16px',textAlign:'center',color:'var(--muted)',fontSize:13}},
                'Sem posições vendidas em '+(year==='ALL'?'nenhum ano':year))
            );
          })()
    ),
    ),
      ),
    ),
    /* ── Resumo Fiscal Anual por País — Anexo J ─────────────────────────────
       Portugal's Modelo 3 Anexo J (foreign-sourced income) is filed per
       country of origin — Quadro 9 for Mais-Valias, Quadro 8 for Dividendos.
       This groups both by country in one place so the numbers can be read
       straight off instead of re-deriving them from the per-ticker tables. */
    (()=>{
      const cgByCountry={};
      cgRows.forEach(r=>{
        const country=tickerCountry[r.ticker]||tickerCountry[normTicker(r.ticker)]||'🌐';
        if(!cgByCountry[country])cgByCountry[country]={gain:0,loss:0,tax:0,count:0};
        if(r.plEur>0)cgByCountry[country].gain+=r.plEur; else cgByCountry[country].loss+=r.plEur;
        cgByCountry[country].tax+=r.tax||0;
        cgByCountry[country].count++;
      });
      const cgCountries=Object.keys(cgByCountry).sort((a,b)=>
        (cgByCountry[b].gain+cgByCountry[b].loss)-(cgByCountry[a].gain+cgByCountry[a].loss));

      const divByCountry={};
      divRows.forEach(r=>{
        const country=r.country||'🌐';
        if(!divByCountry[country])divByCountry[country]={gross:0,withheld:0,taxLocal:0,count:0};
        divByCountry[country].gross+=r.grossEUR;
        divByCountry[country].withheld+=r.withheld;
        divByCountry[country].taxLocal+=r.taxLocal;
        divByCountry[country].count++;
      });
      const divCountries=Object.keys(divByCountry).sort((a,b)=>divByCountry[b].gross-divByCountry[a].gross);

      if(cgCountries.length===0&&divCountries.length===0) return null;

      const cgGrandGain=cgCountries.reduce((s,c)=>s+cgByCountry[c].gain,0);
      const cgGrandLoss=cgCountries.reduce((s,c)=>s+cgByCountry[c].loss,0);
      const cgGrandTax=cgCountries.reduce((s,c)=>s+cgByCountry[c].tax,0);
      const divGrandGross=divCountries.reduce((s,c)=>s+divByCountry[c].gross,0);
      const divGrandWithheld=divCountries.reduce((s,c)=>s+divByCountry[c].withheld,0);
      const divGrandTaxLocal=divCountries.reduce((s,c)=>s+divByCountry[c].taxLocal,0);

      return h('div',{className:'card',style:{marginBottom:20}},
        h('div',{className:'flex items-center gap-2.5 mb-3.5'},
          h('h3',{className:'font-bold text-[13px] tracking-[.06em] uppercase whitespace-nowrap text-slate-200'},'Resumo Fiscal Anual — Anexo J'),
          h(InfoTooltip,{text:'Agrupado por país de origem para preenchimento do Anexo J da Modelo 3 (rendimentos obtidos no estrangeiro). Mais-Valias → Quadro 9. Dividendos → Quadro 8. Valores em EUR, já convertidos quando aplicável.',side:'right'}),
          h('div',{className:'flex-1 h-px bg-[var(--border)]'})
        ),

        h('div',{className:'grid grid-cols-1 sm:grid-cols-2 gap-5'},

          cgCountries.length>0&&h('div',null,
            MicroLabel('Mais-Valias por País (Quadro 9)',{mb:8}),
            h('div',{style:{overflowX:'auto'}},

function SectionHead(label){

// Shared small uppercase stat label (e.g. "PADI", "Quality Score", "Avg Score")
// — was hand-styled ~24 times with slightly different fontSize/letterSpacing/
// marginBottom depending on who wrote that bit of code. tag defaults to 'div'
// since most callers were block-level; pass tag:'span' for inline contexts.
function MicroLabel(text,opts){
  const o=opts||{};
  return h(o.tag||'div',{style:{fontSize:o.size||10,fontWeight:o.weight!=null?o.weight:700,letterSpacing:o.spacing||'.06em',
    textTransform:'uppercase',color:'var(--muted)',marginBottom:o.mb!=null?o.mb:0}},text);
}
// A row counts as "sem info" when its value is empty or a dash placeholder (-, –, —).
const smNoInfo=v=>v==null||(typeof v==='string'&&/^\s*[-\u2013\u2014]?\s*$/.test(v));
// Drops whole blocks (SectionHead + its rows) where every row is "sem info" and there is no other content.
// Items before the first SectionHead (TER, nota, ...) are always kept.
function pruneEmptySections(items){
  const out=[];let head=null,body=[];
  const flush=()=>{
    if(head===null){out.push(...body);}
    else{
      const rows=body.filter(e=>e&&e.props&&e.props['data-kind']==='row');
      const other=body.filter(e=>e&&!(e.props&&e.props['data-kind']==='row'));
      if(rows.some(e=>!e.props['data-empty'])||other.length>0)out.push(head,...body);
    }
    head=null;body=[];
  };
  items.forEach(e=>{
    if(e&&e.props&&e.props['data-kind']==='sec'){flush();head=e;}
    else body.push(e);
  });
  flush();
  return out;
}
function SMRow(label,value,color){
  return h('div',{'data-kind':'row','data-empty':smNoInfo(value)?'1':undefined,style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'3px 0',fontSize:13}},

}
function pnlColor(v){return v==null?'var(--muted)':v>=0?'var(--green)':'var(--red)';}
// Tier colors for the visual "Factores" cards — green/amber/red bands, same
// spirit as scoreColor() but reused for metrics that aren't quality scores
// (yield, payout, growth, debt, streak). higherIsBetter flips the direction.
function factorTier(val,goodAt,okAt,higherIsBetter=true){
  if(val==null)return{bg:'#1c1c1f',fg:'#4b5563'};
  const pass=higherIsBetter?val>=goodAt:val<=goodAt;
  const mid=higherIsBetter?val>=okAt:val<=okAt;
  if(pass)return{bg:'#052e16',fg:'var(--green)'};
  if(mid)return{bg:'#3d3108',fg:'var(--tier-ok)'};
  return{bg:'#3b0a0a',fg:'var(--red)'};
}

// Bloco "Sinais": sinal de crescimento do dividendo (1Y vs 5Y) + barras. Usado na página Teses.
function StockSignals({q}){
  const g1=q.g1,g5=q.g5;
  let signal=null;
  if(g1!=null&&g1<=0)signal={icon:'⚠️',label:'Corte / Congelamento',color:'var(--red)'};
  else if(g1!=null&&g5!=null&&g1>0&&g5>0&&g1<g5*0.5)signal={icon:'📉',label:'Desaceleração',color:'var(--gold)'};
  else if(g1!=null)signal={icon:'✅',label:'Crescimento saudável',color:'var(--green)'};
  if(!signal)return null;
  const bars=(g1!=null&&g5!=null)&&(()=>{
    const maxG=Math.max(g1,g5,.01);
    const barW1=Math.min(Math.abs(g1)/maxG*100,100);
    const barW5=Math.min(Math.abs(g5)/maxG*100,100);
    return h('div',{style:{padding:'4px 0 8px'}},
      h('div',{style:{display:'flex',justifyContent:'space-between',fontSize:12,color:'var(--muted)',marginBottom:4}},
        h('span',null,'5Y'),h('span',{style:{color:'var(--muted)'}},fp(g5))
      ),
      h('div',{style:{position:'relative',height:7,background:'var(--s2)',borderRadius:4,overflow:'hidden',marginBottom:8}},
        h('div',{style:{position:'absolute',left:0,top:0,height:'100%',width:barW5+'%',background:'var(--muted)',opacity:.4,borderRadius:4}})
      ),
      h('div',{style:{display:'flex',justifyContent:'space-between',fontSize:12,color:'var(--gold)',marginBottom:4}},
        h('span',null,'1Y'),h('span',{style:{fontWeight:700}},fp(g1))
      ),
      h('div',{style:{position:'relative',height:7,background:'var(--s2)',borderRadius:4,overflow:'hidden'}},
        h('div',{style:{position:'absolute',left:0,top:0,height:'100%',width:barW1+'%',background:g1<0?'var(--red)':'var(--gold)',borderRadius:4}})
      )
    );
  })();
  return h('div',null,
    h('div',{style:{display:'flex',alignItems:'center',gap:8,padding:'6px 0'}},
      h('span',null,signal.icon),
      h('span',{style:{fontSize:13,fontWeight:600,color:signal.color}},signal.label)
    ),
    bars||null
  );
}

function StockModal({ticker,pos,sold,income,qual,cfg,onClose}){
  useEffect(()=>{
    const onKey=e=>{if(e.key==='Escape')onClose();};
    document.addEventListener('keydown',onKey);
    return()=>document.removeEventListener('keydown',onKey);
  },[onClose]);

  if(!ticker)return null;
  const activeP=(pos||[]).find(x=>x.t===ticker);
  const soldP=(sold||[]).find(x=>x.t===ticker);
  const p=activeP||soldP;
  if(!p){
    return h('div',{style:{position:'fixed',inset:0,background:'rgba(0,0,0,.75)',zIndex:200,
      display:'flex',alignItems:'center',justifyContent:'center'},onClick:onClose},
      h('div',{className:'card',style:{padding:24},onClick:e=>e.stopPropagation()},
        h('div',{style:{fontSize:14,color:'var(--muted)'}},'Posição não encontrada: '+ticker),
        h('button',{className:'btn-secondary mt-3',onClick:onClose},'Fechar')
      )
    );
  }
  const isSold=!activeP||p.n===0;
  const isEtf=p.cat==='ETF';
  const sym=currencySymbol(p.cat);

  const qm=buildQualMap(qual||[]);
  const q=getQual(qm,p.t)||{};
  const fifo=fifoEngine(p.transactions||[]);
  const country=p.country||(cfg?.posCountry||{})[p.t]||'🌐';
  const whtInfo=(cfg?.whtByCountry||{})[country]||{};
  const whtRate=whtInfo.treaty??whtInfo.domestic??0;
  const taxRate=cfg?.taxRate||0.28;

  // ── Section 2: Position & Cost Basis ──
  const shares=p.transactions?.length?fifo.n:(p.n||0);
  const avCost=getAv(p); // FIFO remaining-lot avg (active) or all-buys avg (fully closed)
  const curPrice=p.cv||0;
  const curValue=shares*curPrice;
  const costBasis=shares*avCost;
  const totalPortVal=(pos||[]).reduce((s,x)=>s+(x.n||0)*(x.cv||0),0);
  const weight=totalPortVal>0?curValue/totalPortVal:0;
  const entryDate=p.transactions?.[0]?.date||p.entry;
  const todayStr=new Date().toISOString().slice(0,10);
  const holdingYears=calcHoldingYears(entryDate,isSold?(p.exit||todayStr):todayStr);

  // ── Section 3: P&L ──
  const unrealizedPL=(curPrice-avCost)*shares;
  const unrealizedPLp=avCost>0?(curPrice-avCost)/avCost:0;
  const realizedPL=fifo.sells.reduce((s,sl)=>s+sl.realPL,0);
  const cumDiv=isSold?getSoldDivTotal(p):getIncome(income,p.t);
  const totalReturn=isSold?(realizedPL+cumDiv):(unrealizedPL+cumDiv);
   // for sold, p.n now 0, use original avg cost × original qty via transactions
  const soldQty=p.transactions?.filter(t=>t.type==='buy').reduce((s,t)=>s+t.n,0)||p.n||0;
  const soldCostBasis=soldQty*avCost;
  const totalReturnPct=isSold?(soldCostBasis>0?totalReturn/soldCostBasis:0):(costBasis>0?totalReturn/costBasis:0);

  // ── Section 4: Income & Dividends ──
  const dy=q.dy;
  const curYear=new Date().getFullYear();
  const annualIncomeEst=dy>0?dy*shares*curPrice:(getIncomeYear(income,p.t,curYear-1)||0);
  const yoc=avCost>0&&dy>0?dy*curPrice/avCost:0;
  const whtEst=annualIncomeEst*whtRate;
  const netAfterWht=annualIncomeEst*(1-whtRate);
  const costRecoveryPct=(isSold?soldCostBasis:costBasis)>0?cumDiv/(isSold?soldCostBasis:costBasis):0;
  const remainingToRecover=Math.max(0,(isSold?soldCostBasis:costBasis)-cumDiv);
  const yearsToRecovery=annualIncomeEst>0?remainingToRecover/annualIncomeEst:null;

// Error boundaries: a render error in one page (or the stock modal) shows a
// recoverable message instead of unmounting the whole app. The data in
// localStorage is untouched, so the user can still export it.
// Makes a non-button element (sortable <th>, clickable row) usable from the keyboard.
function pressable(onPress,extra){
  return{...extra,onClick:onPress,role:'button',tabIndex:0,
    onKeyDown:e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();onPress(e);}}};
}
function errorText(error){return String(error&&error.message||error||'Erro desconhecido');}
class PageErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={error:null};}
  static getDerivedStateFromError(error){return{error};}
  componentDidCatch(error,info){console.error('page render failed',error,info&&info.componentStack);}
  render(){
    if(!this.state.error)return this.props.children;
    const{onExport,onDismiss}=this.props;
    return h('div',{className:'card',role:'alert',style:{borderColor:'var(--red)'}},
      h('div',{style:{fontWeight:600,marginBottom:6}},'Esta secção encontrou um erro e não pôde ser mostrada.'),
      h('div',{style:{fontSize:13,color:'var(--muted)',marginBottom:10,wordBreak:'break-word'}},errorText(this.state.error)),
      h('div',{style:{fontSize:13,color:'var(--muted)',marginBottom:10}},'Os teus dados continuam guardados no browser. Podes tentar de novo, mudar de separador ou exportar os dados.'),
      h('div',{className:'flex gap-2 flex-wrap'},
        h('button',{className:'btn-primary',onClick:()=>this.setState({error:null})},'Tentar de novo'),
        onExport&&h('button',{className:'btn-secondary',onClick:onExport},'Exportar dados'),
        onDismiss&&h('button',{className:'btn-secondary',onClick:onDismiss},'Fechar')));
  }
}
class AppErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={error:null};}

  componentDidCatch(error,info){console.error('app render failed',error,info&&info.componentStack);}

      h('div',{style:{fontSize:13,color:'var(--muted)',marginBottom:12}},'Os teus dados continuam guardados no browser. Recarrega a página; se o erro continuar, exporta os dados em Config logo que a aplicação abrir.'),
      h('button',{className:'btn-primary',onClick:()=>location.reload()},'Recarregar'));
  }
}
// On import, a price already in the app that is newer than the one in the file wins:
// re-importing an older export must not roll prices (and their date/source) back.
function keepNewerPrices(imported,current){
  const byT=new Map((current||[]).map(p=>[p.t,p]));
  let kept=0;
  const positions=(imported||[]).map(p=>{
    const c=byT.get(p.t);
    if(!c||!(c.cv>0)||!c.cvAsOf||(p.cvAsOf&&p.cvAsOf>=c.cvAsOf))return p;
    kept++;
    return{...p,cv:c.cv,cvAsOf:c.cvAsOf,...(c.cvSource?{cvSource:c.cvSource}:{})};
  });
  return{positions,kept};
}
function keepNewerConfigPrices(imported,current){
  if(!imported||!current)return{config:imported,kept:0};
  let kept=0;const config={...imported};
  const refs={...(imported.refPrices||{})};
  Object.entries(current.refPrices||{}).forEach(([t,c])=>{
    const i=refs[t];
    if(c&&c.cv>0&&c.asOf&&(!i||!i.asOf||c.asOf>i.asOf)){refs[t]=c;kept++;}
  });
  if(Object.keys(refs).length)config.refPrices=refs;
  if(current.fxEurUsdAsOf&&(!imported.fxEurUsdAsOf||current.fxEurUsdAsOf>imported.fxEurUsdAsOf)){
    config.fxEurUsd=current.fxEurUsd;config.fxEurUsdAsOf=current.fxEurUsdAsOf;kept++;
  }
  if(current.quotesImportedAt&&(!imported.quotesImportedAt||current.quotesImportedAt>imported.quotesImportedAt)){
    config.quotesImportedAt=current.quotesImportedAt;config.quotesSource=current.quotesSource;
  }
  return{config,kept};
}
function App(){

      _autoSaveSuspended.current=false;

    }
  },[]);
  useEffect(()=>{
    (async()=>{
      try{
        const storedPos=await dbg('fp');

        const storedTeses=await dbg('ft');
        const storedQual=await dbg('fq');

        // If we have at least positions in storage, use stored data

              const byYear=incomeByYear(legacyIncome,p.t);
              if(!byYear)return p;
              const filtered=Object.fromEntries(Object.entries(byYear).filter(([,v])=>v));
              if(!Object.keys(filtered).length)return p;

            });

          } else setQual([]);

      }catch(err){

  const importData=useCallback(()=>{

        if(d.theses!==undefined)setTeses(d.theses);

      }catch(error){

  },[pos,sold,cfg]);
  const importBrokerQuotes=useCallback(()=>{

      try{

        if(!result.quotes.length&&result.fxRate===null)throw new Error('Não há cotações das posições activas para actualizar.');
        const quoteByTicker=new Map(result.quotes.map(quote=>[quote.ticker,quote]));

          const quote=quoteByTicker.get(position.t);
          return quote?{...position,cv:quote.price,cvAsOf:quote.date,cvSource:'csv'}:position;
        });

        if(result.fxRate!==null){nextConfig.fxEurUsd=result.fxRate;nextConfig.fxEurUsdAsOf=result.fxDate;}
        nextConfig.quotesImportedAt=new Date().toISOString();

        notify(`${result.quotes.length} cotações actualizadas${result.fxRate!==null?' e EUR/USD actualizado':''}${result.ignored?`; ${result.ignored} linhas sem posição ignoradas`:''}${ageDays>5?`; atenção: dados com ${ageDays} dias`:''}.`);

  const exportBrokerQuoteTemplate=useCallback(()=>{
    const rows=[
      ['Ticker','Price','Currency','Date','Last Known Price'],
      ...(pos||[]).filter(position=>position.n>0).map(position=>[
        position.t,'',position.cat==='USD'?'USD':'EUR','',
        position.cv==null?'':position.cv.toLocaleString('pt-PT',{useGrouping:false,maximumFractionDigits:8})
      ])
    ];

    notify('Template CSV criado. Preenche Price e Date com os dados do broker; Last Known Price é apenas referência.');
  },[pos]);
  const exportCSV=useCallback(()=>{
    const today=new Date().toISOString().slice(0,10);
    const qm=buildQualMap(qual||[]);
    const tv=(pos||[]).reduce((s,p)=>s+cx(p,getQual(qm,p.t)?.dy).val,0);
    const row=(...vals)=>vals.map(csvEscapeCell).join(',');
    const pct=v=>v!=null?((v||0)*100).toFixed(2):'';
    const sep=['','',''];
    const wData=wealth||{};

    // ── Sheet 1: Active Positions ──────────────────────────────────────────
    const posHeaders=row('Ticker','Company','Country','Sector','Category','Qty','Avg Price','Curr Price','Cost','Value','P&L','P&L%','Weight%','Yield%','YoC%','Est Annual Income');
    const posRows=(pos||[]).map(p=>{
      const c=cx(p,getQual(qm,p.t)?.dy);const q=getQual(qm,p.t)||{};
      const estInc=q.dy>0&&p.n>0&&p.cv>0?q.dy*p.n*p.cv:c.inc;
      return row(p.t,p.name||p.t,p.country||'',p.sec||'',p.cat,p.n,getAv(p),p.cv,
        c.cost.toFixed(2),c.val.toFixed(2),c.pl.toFixed(2),
        (c.plp*100).toFixed(2),(tv>0?c.val/tv*100:0).toFixed(2),
        pct(q.dy),pct(c.yoc>0?c.yoc:null),estInc.toFixed(2));
    });

    // ── Sheet 2: Sold Positions ────────────────────────────────────────────
    const soldYears=[...new Set((sold||[]).flatMap(p=>Object.keys(p.divByYear||{})))].sort();
    const soldHeaders=row('Ticker','Name','Country','Category','Qty','Avg Buy','Sell Price','Cost','Proceeds','Sell Fees','P&L','P&L%','Dividends Total',...soldYears.map(y=>'Div '+y),'Total Return','Entry','Exit','Duration(days)','Note');
    const soldRows=(sold||[]).map(p=>{
      const summary=getSoldSummary(p);
      const av=summary.quantity>0?summary.costBasis/summary.quantity:getAv(p);
      const cost=summary.costBasis,proceeds=summary.proceeds,pl=summary.pl,plp=cost>0?pl/cost:0;
      const divTotal=getSoldDivTotal(p);
      const totalRet=pl+divTotal;
      const days=summary.entryDate&&summary.exitDate?Math.round((new Date(summary.exitDate)-new Date(summary.entryDate))/86400000):'';
      const divByYearVals=soldYears.map(y=>((p.divByYear||{})[y]||0).toFixed(2));
      return row(p.t,p.name||p.t,p.country||'',p.cat,summary.quantity,av,summary.averageSellPrice,
        cost.toFixed(2),proceeds.toFixed(2),summary.fees.toFixed(2),pl.toFixed(2),(plp*100).toFixed(2),
        divTotal.toFixed(2),...divByYearVals,
        totalRet.toFixed(2),summary.entryDate,summary.exitDate,days,p.note||'');
    });

    // ── Sheet 3: Quality Metrics (full) ───────────────────────────────────
    const qualHeaders=row('Ticker','Yield%','YoC%','FCFPay%','Buyback%','ShrYield%','DivGr1Y%','DivGr3Y%','DivGr5Y%','DivGr10Y%','EPS Growth%','Debt/EBITDA','ROIC%','FCF%','RevGr%','OpMar%');
    const posMap=buildPosMap(pos||[]);
    const qualRows=(qual||[]).map(q=>{
      const p=posMap[q.t]||posMap[normTicker(q.t)];
      const yoc=p&&p.n>0&&p.cv>0&&q.dy>0&&getAv(p)>0?cx(p,q.dy).yoc:null;
      return row(
        q.t,pct(q.dy),pct(yoc),pct(q.py),pct(q.buyback),pct((q.dy||0)+(q.buyback||0)),
        pct(q.g1),pct(q.g3),pct(q.g5),pct(q.g10),
        pct(q.eps),q.debt??'',
        pct(q.roic),pct(q.fcf),pct(q.revgr),pct(q.opmar)
      );
    });

    // ── Sheet 4: Income History (open positions) ───────────────────────────
    const incYears=Object.keys(Object.values(income||{})[0]||{2026:0,2025:0,2024:0,2023:0}).sort((a,b)=>b-a);
    const incHeaders=row('Ticker',...incYears,'Total');
    const incRows=Object.entries(income||{}).map(([t,yrs])=>{
      const vals=incYears.map(y=>(yrs[y]||0).toFixed(2));
      const tot=incYears.reduce((s,y)=>s+(yrs[y]||0),0);
      return row(t,...vals,tot.toFixed(2));
    });

    // ── Sheet 5: Sold Dividends by Year ───────────────────────────────────
    const soldDivYears=[...new Set((sold||[]).flatMap(p=>Object.keys(p.divByYear||{})))].sort();
    const soldDivHeaders=row('Ticker','Name','Entry','Exit',...soldDivYears,'Total');
    const soldDivRows=(sold||[]).filter(p=>p.divByYear).map(p=>{
      const tot=Object.values(p.divByYear).reduce((s,v)=>s+(v||0),0);
      return row(p.t,p.name||p.t,p.entry||'',p.exit||'',
        ...soldDivYears.map(y=>((p.divByYear[y]??'')).toString()),
        tot.toFixed(2));
    });

    // ── Sheet 6: Config ────────────────────────────────────────────────────
    const cfgData=cfg||{};
    const cfgRows=[
      row('Parameter','Value'),
      row('Monthly Expenses (€) — total from expense items',monthlyExpensesTotal(cfgData)),
      row('Tax Rate (%)',(cfgData.taxRate||0.28)*100),
      row('Monthly Capital (€)',cfgData.monthlyCapital||1200),
      row('Target Yield (%)',(cfgData.targetYield||0.045)*100),
      row('Div Growth (%)',(cfgData.divGrowth||0.03)*100),
      row('Portfolio Goal (€)',cfgData.portfolioGoal||100000),
      row('FX EUR/USD',cfgData.fxEurUsd||1.08),
    ];
    // Withholding tax rates by country (source of truth for all tax calcs)
    const whtHeaders=row('Country Flag','Country','Domestic WHT%','Treaty WHT%','Note');
    const whtRows=Object.entries(cfgData.whtByCountry||{}).map(([flag,w])=>row(
      flag,w.name||'',pct(w.domestic),pct(w.treaty),w.note||''
    ));
    // Ticker → Country mapping used for Anexo J grouping
    const posCountryHeaders=row('Ticker','Country Flag');
    const posCountryRows=Object.entries(cfgData.posCountry||{}).map(([t,c])=>row(t,c));
    // ETF TER (annual expense ratio) used for the Custo TER card
    const etfTerHeaders=row('Ticker','TER%');
    const etfTerRows=Object.entries(cfgData.etfTer||{}).map(([t,ter])=>row(t,pct(ter)));

    // ── Sheet 13: All Transactions (raw trade log) ─────────────────────────
    const txHeaders=row('Date','Type','Ticker','Name','Qty','Price','Fee','Total','Currency','Status','Broker');
    const txRowsRaw=[];
    [...(pos||[]).map(p=>({...p,_source:'Activa'})),...(sold||[]).map(p=>({...p,_source:'Fechada'}))].forEach(p=>{
      const sym=currencySymbol(p.cat);
      (p.transactions||[]).forEach(tx=>{
        txRowsRaw.push({date:tx.date||'',type:(tx.type||'buy')==='buy'?'BUY':'SELL',
          ticker:p.t,name:p.name||p.t,n:tx.n||0,price:tx.price||0,fee:tx.fee||0,
          total:(tx.n||0)*(tx.price||0),sym,status:p._source,broker:(typeof tx.broker==='string'?tx.broker.trim():'')});
      });
    });
    txRowsRaw.sort((a,b)=>a.date.localeCompare(b.date));
    const txRows=txRowsRaw.map(r=>row(r.date,r.type,r.ticker,r.name,r.n,r.price.toFixed(2),
      r.fee.toFixed(2),r.total.toFixed(2),r.sym,r.status,r.broker));

    // ── Shared tax helpers (mirror TaxCalcPage's logic — single source of truth is cfg) ──
    const TAX_RATE_CFG=cfgData.taxRate||0.28;
    const whtRateForCsv=country=>whtRateForCountry(cfgData,country);
    const tickerCountryMap=(()=>{
      const pc=cfgData.posCountry||{};
      const m={};
      Object.entries(pc).forEach(([t,c])=>{ m[normTicker(t)]=c; m[t]=c; });
      [...(pos||[]),...(sold||[])].forEach(p=>{
        if(p.country){ m[p.t]=p.country; m[normTicker(p.t)]=p.country; }
      });
      return m;
    })();

    // All capital-gains sale events across every year (mirrors TaxCalcPage's cgRows, year filter removed).
    // pl/tax are converted to EUR immediately so every downstream sheet (Tax by Year, Anexo J)
    // consumes the same already-converted values — avoids a currency-mixing bug where USD gains
    // would get grouped alongside EUR gains without conversion.
    const capitalGains=applyAnnualCapitalGainsTax(
      buildCapitalGainsEvents(pos,sold,makeFxLookup(cfgData).on,TAX_RATE_CFG)
    );
    const allCgRows=capitalGains.events.map(event=>({
      ticker:event.ticker,date:event.date,pl:event.plEur,tax:event.taxEur
    }));

    // All dividend events by ticker+year across every year (open + sold)
    const allDivRows=[];
    const posMapCsv=buildPosMap(pos||[]);
    Object.entries(income||{}).forEach(([ticker,byYear])=>{
      const p=posMapCsv[ticker]||posMapCsv[normTicker(ticker)];
      const isUSD=p?.cat==='USD';
      Object.entries(byYear).forEach(([y,gross])=>{
        if(!(gross>0))return;
        const grossEUR=isUSD?gross/makeFxLookup(cfgData).avg(String(y)):gross;
        const country=tickerCountryMap[ticker]||tickerCountryMap[normTicker(ticker)]||'🌐';
        const whtRate=whtRateForCsv(country);
        const netTaxRate=Math.max(0,TAX_RATE_CFG-whtRate);
        allDivRows.push({ticker,country,year:y,grossEUR,withheld:grossEUR*whtRate,taxLocal:grossEUR*netTaxRate});
      });
    });
    (sold||[]).forEach(p=>{
      const isUSD=p.cat==='USD';
      Object.entries(p.divByYear||{}).forEach(([y,gross])=>{
        if(!(gross>0))return;
        const grossEUR=isUSD?gross/makeFxLookup(cfgData).avg(String(y)):gross;
        const country=tickerCountryMap[p.t]||p.country||'🌐';
        const whtRate=whtRateForCsv(country);
        const netTaxRate=Math.max(0,TAX_RATE_CFG-whtRate);
        allDivRows.push({ticker:p.t,country,year:y,grossEUR,withheld:grossEUR*whtRate,taxLocal:grossEUR*netTaxRate});
      });
    });

    // ── Sheet 14: Tax by Year (mirrors "Imposto Pago por Ano" chart, all years) ──
    const taxYearsSet=new Set();
    (sold||[]).forEach(p=>{
      if(p.exit)taxYearsSet.add(p.exit.slice(0,4));
      (p.transactions||[]).filter(tx=>tx.type==='sell'&&tx.date).forEach(tx=>taxYearsSet.add(tx.date.slice(0,4)));
      Object.entries(p.divByYear||{}).forEach(([y,v])=>{ if(v>0)taxYearsSet.add(y); });
    });
    (pos||[]).forEach(p=>(p.transactions||[]).filter(tx=>tx.type==='sell'&&tx.date).forEach(tx=>taxYearsSet.add(tx.date.slice(0,4))));
    Object.values(income||{}).forEach(byTicker=>Object.keys(byTicker).forEach(y=>{ if(byTicker[y]>0)taxYearsSet.add(y); }));
    let taxYearsArr=[...taxYearsSet].sort((a,b)=>b-a);
    if(!taxYearsArr.length) taxYearsArr=[String(CUR_YEAR)];
    const dataStartYear=Math.min(
      ...[...(pos||[]),...(sold||[])].flatMap(p=>(p.transactions||[]).map(t=>parseInt(t.date?.slice(0,4)||'9999'))),
      ...Object.values(income||{}).flatMap(yr=>Object.keys(yr).map(Number)),

    );
    const TAX_YEARS=taxYearsArr.filter(y=>y>=Math.max(2020,dataStartYear));

    const taxByYearHeaders=row('Year','Div Gross','Div WHT Paid','Div IRS','Juros Gross','Juros IRS',

      let whtPaid=0,irsDiv=0,totalDiv=0,totalJuros=0,irsJuros=0,totalGains=0;

      });
      (wData.juros||[]).forEach(r=>{ const j=r[ys]||0; if(j){ totalJuros+=j; irsJuros+=j*TAX_RATE_CFG; } });
      (wData.aforro||[]).forEach(r=>{ const j=r[ys]||0; if(j){ totalJuros+=j; irsJuros+=j*TAX_RATE_CFG; } });
      allCgRows.filter(r=>r.date.startsWith(ys)).forEach(r=>{
        totalGains+=r.pl>0?r.pl:0;

      const totalIrs=irsDiv+irsJuros+irsGains;

      const totalIncome=totalDiv+totalJuros+totalGains;
      return row(y,totalDiv.toFixed(2),whtPaid.toFixed(2),irsDiv.toFixed(2),
        totalJuros.toFixed(2),irsJuros.toFixed(2),
        totalGains.toFixed(2),irsGains.toFixed(2),
        totalIncome.toFixed(2),totalIrs.toFixed(2),totalTax.toFixed(2));
    });

    // ── Sheet 15: Tax by Country — Anexo J (Quadro 8 dividends + Quadro 9 capital gains, all years) ──
    const anexoMap={};
    const anexoKey=(y,c)=>y+'|'+c;
    allCgRows.forEach(r=>{
      const year=r.date.slice(0,4);
      const country=tickerCountryMap[r.ticker]||tickerCountryMap[normTicker(r.ticker)]||'🌐';
      const k=anexoKey(year,country);
      if(!anexoMap[k])anexoMap[k]={year,country,cgGain:0,cgLoss:0,cgTax:0,cgCount:0,divGross:0,divWithheld:0,divTaxLocal:0,divCount:0};

      anexoMap[k].cgTax+=r.tax;
      anexoMap[k].cgCount++;
    });
    allDivRows.forEach(r=>{
      const k=anexoKey(r.year,r.country);
      if(!anexoMap[k])anexoMap[k]={year:r.year,country:r.country,cgGain:0,cgLoss:0,cgTax:0,cgCount:0,divGross:0,divWithheld:0,divTaxLocal:0,divCount:0};

      anexoMap[k].divWithheld+=r.withheld;
      anexoMap[k].divTaxLocal+=r.taxLocal;
      anexoMap[k].divCount++;
    });
    const anexoHeaders=row('Year','Country Flag','CG Gain','CG Loss','CG Tax (Quadro 9)','CG Sale Events',
      'Div Gross','Div WHT Withheld','Div IRS Local (Quadro 8)','Div Events');
    const anexoRows=Object.values(anexoMap)
      .sort((a,b)=>b.year-a.year||a.country.localeCompare(b.country))
      .map(r=>row(r.year,r.country,r.cgGain.toFixed(2),r.cgLoss.toFixed(2),r.cgTax.toFixed(2),r.cgCount,
        r.divGross.toFixed(2),r.divWithheld.toFixed(2),r.divTaxLocal.toFixed(2),r.divCount));

    // ── Sheet 7: Wealth — PPR ─────────────────────────────────────────────
    const pprHeaders=row('Produto','Owner','Valor Investido','Ganhos Brutos','Valor Actual','Retorno%');
    const pprRows=(wData.ppr||[]).map(r=>row(
      r.produto,r.owner,r.valorInvestido??'',r.ganhosBrutos??'',
      r.ganhosBrutos!=null&&r.valorInvestido!=null?(r.valorInvestido+r.ganhosBrutos).toFixed(2):'',
      r.ganhosBrutos!=null&&r.valorInvestido?pct(r.ganhosBrutos/r.valorInvestido):''
    ));

    // ── Sheet 8: Wealth — Aforro ──────────────────────────────────────────
    const aforroHeaders=row('Owner','Série','Investimento','Juros','Valor Actual','Retorno%');
    const aforroRows=(wData.aforro||[]).map(r=>row(
      r.owner,r.serie,r.investimento??'',r.juros??'',
      r.investimento!=null&&r.juros!=null?(r.investimento+r.juros).toFixed(2):'',
      r.investimento&&r.juros!=null?pct(r.juros/r.investimento):''
    ));

    // ── Sheet 9: Wealth — Depósitos ───────────────────────────────────────
    const depHeaders=row('Investidor','Plataforma','Valor','Taxa%','Rend. Estimado','Status','Data Início','End Date');
    const depRows=(wData.depositos||[]).map(r=>{
      let interest=0;
      if(r.netProfit!=null){interest=r.netProfit;}
      else if(r.valor&&r.rate){
        if(r.dataInicio){const days=(Date.now()-new Date(r.dataInicio).getTime())/(1000*60*60*24);interest=r.valor*r.rate*(days/365);}
        else{interest=r.valor*r.rate;}
      }
      return row(r.investidor,r.plataforma,r.valor??'',
        r.rate!=null?(r.rate*100).toFixed(2):'',interest.toFixed(2),
        r.status||'',r.dataInicio||'',r.endDate||'');
    });

    // ── Sheet 10: Wealth — Juros ──────────────────────────────────────────
    const jYears=['2026','2025','2024','2023'];
    const jurosHeaders=row('Plataforma','Investidor','Valor','Taxa%',...jYears,'Total');
    const jurosRows=(wData.juros||[]).map(r=>{
      const tot=jYears.reduce((s,y)=>s+(r[y]||0),0);
      return row(r.plataforma,r.investidor,r.valor??'',
        r.rate!=null?(r.rate*100).toFixed(2):'',
        ...jYears.map(y=>(r[y]??'').toString()),tot.toFixed(2));
    });

    // ── Sheet 11: Wealth — investments outside the portfolio (one block per owner) ──
    const ciHeaders=row('Ticker','Valor Investido','Preço Compra','Data Compra','Curr Price','Valor Actual','P&L','P&L%');
    const ciBlocks=wealthInvestments(wData).flatMap(w=>['=== 14. WEALTH — '+w.label.toUpperCase()+' ===',ciHeaders,...((wData[w.key]||{}).investimentos||[]).map(r=>{
      const currPrice=referencePrice(r.ticker,pos,cfg)?.cv;
      const units=r.precoCompra&&r.valorInvestido?r.valorInvestido/r.precoCompra:null;
      const valorActual=units&&currPrice?units*currPrice:null;
      const pl=valorActual!=null?valorActual-r.valorInvestido:null;
      const plp=pl!=null&&r.valorInvestido?pl/r.valorInvestido:null;
      return row(r.ticker,r.valorInvestido??'',r.precoCompra??'',r.dataCompra||'',
        currPrice??'',valorActual!=null?valorActual.toFixed(2):'',
        pl!=null?pl.toFixed(2):'',plp!=null?pct(plp):'');
    }),'']);

    // ── Sheet 12: Net Worth Summary per Owner ─────────────────────────────
    const nwHeaders=row('Owner','Asset Type','Name','Investido','Valor Actual','Ganho','Retorno%');
    const nwRows=[];
    const owners=Object.keys(wData.owners||{});
    owners.forEach(owner=>{
      // Portfolio (Carlos)
      if(owner==='Carlos'){
        const v=(pos||[]).reduce((s,p)=>s+(p.n||0)*(p.cv||0),0);
        const c=(pos||[]).reduce((s,p)=>s+(p.n||0)*getAv(p),0);
        nwRows.push(row(owner,'Portfolio','Folio',c.toFixed(2),v.toFixed(2),(v-c).toFixed(2),pct((v-c)/c)));
      }
      // PPR
      (wData.ppr||[]).filter(r=>r.owner===owner).forEach(r=>{
        const v=(r.valorInvestido||0)+(r.ganhosBrutos||0);
        nwRows.push(row(owner,'PPR',r.produto,r.valorInvestido??'',v.toFixed(2),(r.ganhosBrutos??''),r.ganhosBrutos&&r.valorInvestido?pct(r.ganhosBrutos/r.valorInvestido):''));
      });
      // Aforro
      (wData.aforro||[]).filter(r=>r.owner===owner).forEach(r=>{
        const v=(r.investimento||0)+(r.juros||0);
        nwRows.push(row(owner,'Aforro','Série '+r.serie,r.investimento??'',v.toFixed(2),(r.juros??''),r.juros&&r.investimento?pct(r.juros/r.investimento):''));
      });
      // Depósitos
      (wData.depositos||[]).filter(r=>r.investidor===owner).forEach(r=>{
        let interest=r.netProfit!=null?r.netProfit:(r.valor&&r.rate?r.valor*r.rate:0);
        nwRows.push(row(owner,'Depósito',r.plataforma,r.valor??'',(r.valor+interest).toFixed(2),interest.toFixed(2),r.valor?pct(interest/r.valor):''));
      });
      // Juros
      (wData.juros||[]).filter(r=>r.investidor===owner).forEach(r=>{
        nwRows.push(row(owner,'Juros',r.plataforma,r.valor??'',r.valor??'','0','0.00'));
      });
      // Investments outside the portfolio
      wealthInvestments(wData).filter(w=>w.owner===owner).forEach(w=>{
        ((wData[w.key]||{}).investimentos||[]).forEach(r=>{
          const va=investmentLot(r,pos,cfg).value;
          const pl=va-(r.valorInvestido||0);
          nwRows.push(row(owner,'Investimentos',r.ticker,r.valorInvestido??'',va.toFixed(2),pl.toFixed(2),r.valorInvestido?pct(pl/r.valorInvestido):''));
        });
      });
    });

    // ── Combine all sheets ─────────────────────────────────────────────────
    const lines=[
      '=== 1. ACTIVE POSITIONS ===',posHeaders,...posRows,
      ...sep,'=== 2. SOLD POSITIONS ===',soldHeaders,...soldRows,
      ...sep,'=== 3. QUALITY METRICS ===',qualHeaders,...qualRows,
      ...sep,'=== 4. INCOME HISTORY (OPEN) ===',incHeaders,...incRows,
      ...sep,'=== 5. SOLD DIVIDENDS BY YEAR ===',soldDivHeaders,...soldDivRows,
      ...sep,'=== 6. ALL TRANSACTIONS ===',txHeaders,...txRows,
      ...sep,'=== 7. CONFIG ===',...cfgRows,
      ...sep,'=== 7b. CONFIG — WHT BY COUNTRY ===',whtHeaders,...whtRows,
      ...sep,'=== 7c. CONFIG — TICKER → COUNTRY ===',posCountryHeaders,...posCountryRows,
      ...sep,'=== 7d. CONFIG — ETF TER ===',etfTerHeaders,...etfTerRows,
      ...sep,'=== 8. TAX BY YEAR ===',taxByYearHeaders,...taxByYearRows,
      ...sep,'=== 9. TAX BY COUNTRY — ANEXO J ===',anexoHeaders,...anexoRows,
      ...sep,'=== 10. WEALTH — PPR ===',pprHeaders,...pprRows,
      ...sep,'=== 11. WEALTH — AFORRO ===',aforroHeaders,...aforroRows,
      ...sep,'=== 12. WEALTH — DEPOSITOS ===',depHeaders,...depRows,
      ...sep,'=== 13. WEALTH — JUROS ===',jurosHeaders,...jurosRows,
      ...sep,...ciBlocks,
      ...sep,'=== 15. NET WORTH SUMMARY ===',nwHeaders,...nwRows,
    ];
    const blob=new Blob(['\uFEFF'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='folio_full_'+today+'.csv';a.click();URL.revokeObjectURL(url);
    notify('CSV exportado — 18 secções: posições, vendidas, métricas, rendimento, dividendos, transacções, config, tax por ano, tax por país (Anexo J), wealth, net worth');
  },[pos,sold,qual,income,cfg,wealth]);

  const safePos=useMemo(()=>(pos||[]).map(p=>enrich({...p,id:p.id||p.t})),[pos]);
  const safeQual=qual||[];
  const safeInc=income||{};
  const safeSold=sold||[];

  if(!rdy)return h('div',{style:{textAlign:'center',padding:80,color:'var(--muted)'}},'A carregar...');

  // ── No data screen ───────────────────────────────────────────────────────
  if(noData)return h('div',{style:{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'var(--bg)',padding:24}},
    h('div',{style:{maxWidth:560,width:'100%'}},

          h('div',{style:{fontSize:12,color:'var(--muted)',marginBottom:12,lineHeight:1.5}},
            'Um só ficheiro com posições, métricas, configuração, património, teses e histórico. Também aceita os ficheiros antigos (portfolio, metrics, config, wealth, teses): selecciona-os todos de uma vez.'),

  const TABS=[['dashboard','Dashboard'],['portfolio','Holdings'],['dividendos','Dividends'],['transactions','Transactions'],['analytics','Analytics'],['teses','Teses'],['patrimonio','Net Worth'],['taxcalc','Tax'],['config','Config']];
