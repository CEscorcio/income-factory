const DonutChart=memo(function DonutChart({pos,cfg,compact=false,half=false}){
  const SIZE=340,CX=170,CY=170,RO=130,RI=82;
  const[hov,setHov]=useState(null);
  const slices=useMemo(()=>{
    const tv=pos.reduce((s,p)=>s+cx(p).val,0);
    const items=[...pos].map(p=>({...p,val:cx(p).val,pct:cx(p).val/(tv||1)})).sort((a,b)=>b.val-a.val);
    // colour palette cycling
    const PAL=CHART_PALETTE;
    let angle=0;
    return items.map((p,i)=>{
      const a=p.pct*360;
      const start=angle;
      angle+=a;
      return{...p,startAngle:start,sweepAngle:a,color:PAL[i%PAL.length]};
    });
  },[pos]);

  // Uses shared top-level svgArc utility

  function labelPos(startDeg,sweepDeg,r){
    const mid=(startDeg+sweepDeg/2)*Math.PI/180;
    return{x:CX_A+r*Math.cos(mid),y:CY_A+r*Math.sin(mid)};
  }

  const hovSlice=hov!=null?slices.find(s=>s.t===hov):null;

  const SIZE_ACTUAL=compact?220:(half?290:SIZE);
  const CX_A=compact?110:(half?145:CX);
  const CY_A=compact?110:(half?145:CY);
  const RO_A=compact?84:(half?109:RO);
  const RI_A=compact?52:(half?69:RI);

  return h('div',{style:half
    ?{display:'grid',gridTemplateColumns:'1fr 1fr',gap:24,alignItems:'center'}
    :compact
    ?{display:'flex',gap:24,alignItems:'flex-start',flexWrap:'wrap'}
    :{display:'flex',flexDirection:'column',alignItems:'center',gap:20}},
    h(half?'div':React.Fragment,half?{style:{display:'flex',justifyContent:'center'}}:null,
    h('svg',{
      viewBox:`0 0 ${SIZE_ACTUAL} ${SIZE_ACTUAL}`,
      overflow:'visible', // slice labels may sit past the edge of the box
      style:compact
        ?{flexShrink:0,filter:'drop-shadow(0 4px 24px rgba(0,0,0,.4))',width:SIZE_ACTUAL,height:SIZE_ACTUAL}
        :half
        ?{filter:'drop-shadow(0 4px 24px rgba(0,0,0,.4))',width:'100%',maxWidth:SIZE_ACTUAL,height:'auto'}
        :{filter:'drop-shadow(0 4px 24px rgba(0,0,0,.4))',width:'100%',maxWidth:SIZE_ACTUAL,height:'auto'},
    },
      // slices
      slices.map(s=>{
        const isHov=hov===s.t;
        const GAP=0.6;
        const sweep=Math.max(s.sweepAngle-GAP,0.1);
        const ro=(isHov?RO_A+8:RO_A);
        const ri=RI_A;
        // build donut path
        const sr=(s.startAngle+GAP/2)*Math.PI/180;
        const er=(s.startAngle+GAP/2+sweep)*Math.PI/180;
        const large=sweep>180?1:0;
        const x1=CX_A+ro*Math.cos(sr),y1=CY_A+ro*Math.sin(sr);
        const x2=CX_A+ro*Math.cos(er),y2=CY_A+ro*Math.sin(er);
        const x3=CX_A+ri*Math.cos(er),y3=CY_A+ri*Math.sin(er);
        const x4=CX_A+ri*Math.cos(sr),y4=CY_A+ri*Math.sin(sr);
        const path=`M${x1} ${y1} A${ro} ${ro} 0 ${large} 1 ${x2} ${y2} L${x3} ${y3} A${ri} ${ri} 0 ${large} 0 ${x4} ${y4} Z`;
        return h('path',{
          key:s.t,d:path,
          fill:s.color,
          opacity:hov&&hov!==s.t?0.45:1,
          style:{cursor:'pointer',transition:'opacity .15s, transform .15s'},
          onMouseEnter:()=>setHov(s.t),
          onMouseLeave:()=>setHov(null),
        });
      }),
      // outer labels for bigger slices
      !compact&&slices.filter(s=>s.sweepAngle>7).map(s=>{
        const lp=labelPos(s.startAngle,s.sweepAngle,RO_A+22);
        const anchor=lp.x>CX?'start':'end';
        return h('text',{key:'l'+s.t,x:lp.x,y:lp.y,
          textAnchor:anchor,dominantBaseline:'middle',
          fontSize:11,fill:'#cbd5e1',fontWeight:600,
        },s.t);
      }),
      // centre
      h('text',{x:CX_A,y:CY_A-14,textAnchor:'middle',fontSize:hovSlice?22:28,fontFamily:'var(--sans)',fontWeight:800,fill:hovSlice?hovSlice.color:'#e2e8f0'},
        hovSlice?(hovSlice.pct*100).toFixed(1)+'%':pos.length
      ),
      h('text',{x:CX_A,y:CY_A+12,textAnchor:'middle',fontSize:10,fill:'var(--muted)'},
        hovSlice?hovSlice.t:'posições'
      ),
      hovSlice&&h('text',{x:CX_A,y:CY_A+28,textAnchor:'middle',fontSize:9,fill:'var(--muted)'},
        (hovSlice.cat==='USD'?'$':'€')+fn(hovSlice.val)
      ),
    )),
    // legend — compact: 3 cols to the right; half: 3 cols to the right (wider column); normal: 4 cols below
    h('div',{style:compact
      ?{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(110px,1fr))',gap:'4px 16px',flex:'1 1 220px',minWidth:0,alignContent:'start'}
      :half
      ?{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:'6px 18px',alignContent:'start'}
      :{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'6px 24px',width:'100%',alignContent:'start'}},
      slices.map(s=>
        h('div',{key:s.t,
          style:{display:'flex',alignItems:'center',gap:6,cursor:'pointer',opacity:hov&&hov!==s.t?.4:1,transition:'opacity .15s'},
          onMouseEnter:()=>setHov(s.t),onMouseLeave:()=>setHov(null),
        },
          h('div',{style:{width:10,height:10,borderRadius:6,background:s.color,flexShrink:0}}),
          h('span',{style:{fontSize:13,color:'var(--muted)',whiteSpace:'nowrap'}},
            s.t,' ',h('span',{style:{color:s.color,fontWeight:700}},(s.pct*100).toFixed(1)+'%')
          )
        )
      )
    )
  );
});


function Dash({pos,qual,income,sold,cfg,setCfg,wealth}){
  /* ── Valuation snapshot history ──────────────────────────────────────────
     Blocker documented in the Performance Metrics tooltip: a true chain-linked
     TWR and historical-rate FX conversion both need a time series of portfolio
     valuations / FX rates that this app has never recorded — only today's
     price (cv) and today's FX rate (cfg.fxEurUsd) exist. That data can't be
     reconstructed after the fact. Starting now: once per day, record
     {date, totalValueEUR, fxEurUsd} to localStorage under 'if_vh'. After a
     few months this becomes real sub-period data a proper TWR calc can use,
     and a real per-date FX rate log, instead of today's single-point
     approximations. This has no effect on any currently displayed number. */
  useEffect(()=>{
    try{
      const today=new Date().toISOString().slice(0,10);
      const hist=JSON.parse(localStorage.getItem('if_vh')||'[]');
      if(hist.length&&hist[hist.length-1].date===today) return; // already recorded today
      const fx=cfg?.fxEurUsd||1.08;
      const totalValueEUR=(pos||[]).reduce((s,p)=>s+((p.n||0)*(p.cv||0))/(p.cat==='USD'?fx:1),0);
      hist.push({date:today,totalValueEUR:+totalValueEUR.toFixed(2),fxEurUsd:fx});
      localStorage.setItem('if_vh',JSON.stringify(hist.slice(-3650))); // cap ~10y of daily snapshots
    }catch(e){/* localStorage unavailable — snapshot skipped, no functional impact */}
  },[pos,cfg]);

  const m=useMemo(()=>{
    const qm=buildQualMap(qual||[]);
    const calcs=pos.map(p=>({p,c:cx(p,getQual(qm,p.t)?.dy)}));
    // Single pass over all positions for all aggregates
    const agg=calcs.reduce((a,{p,c})=>{
      a.tv+=c.val; a.tc+=c.cost;
      const dy=getQual(qm,p.t)?.dy||0;
      const fwd=dy>0?dy*p.n*p.cv:0;
      if(p.cat==='USD'){a.iu+=fwd;a.valUSD+=c.val;a.costUSD+=c.cost;a.plUSD+=c.pl;}
      else if(p.cat==='ETF'){
        a.ietf+=fwd;a.costETF+=c.cost;
        if(p.sec==='ETF - Equity'){a.valEtfEq+=c.val;a.plEtfEq+=c.pl;}
        else{a.valEtfBo+=c.val;a.plEtfBo+=c.pl;}
      } else {a.ie+=fwd;a.valEUR+=c.val;a.costEUR+=c.cost;a.plEUR+=c.pl;}
      a.sm[p.sec]=(a.sm[p.sec]||0)+c.val;
      a.smPL[p.sec]=(a.smPL[p.sec]||0)+c.pl;
      return a;
    },{tv:0,tc:0,iu:0,ie:0,ietf:0,valUSD:0,valEUR:0,valEtfEq:0,valEtfBo:0,costUSD:0,costEUR:0,costETF:0,plUSD:0,plEUR:0,plEtfEq:0,plEtfBo:0,sm:{},smPL:{}});
    const{tv,tc,iu,ie,ietf,valUSD,valEUR,valEtfEq,valEtfBo,costUSD,costEUR,costETF,plUSD,plEUR,plEtfEq,plEtfBo,sm,smPL}=agg;
    const pl=tv-tc,plp=tc>0?pl/tc:0;
    const sectors=Object.entries(sm).sort((a,b)=>b[1]-a[1]);
    const top10=calcs.map(({p,c})=>({...p,...c,histInc:getIncome(income,p.t),totalReturn:c.pl+getIncome(income,p.t),trp:c.cost>0?(c.pl+getIncome(income,p.t))/c.cost:0})).sort((a,b)=>b.val-a.val).slice(0,10);
    // Weighted yield uses cx() which already applies dy from qualMap
    // H1 FIX: compute avgYield from actual received/estimated income across ALL positions
    // Previously only positions with qualMap dy > 0 were included — understated yield
    // H2 FIX: the H1 fix overcorrected by putting ALL positions' value in the denominator,
    // including zero-income accumulating ETFs (VUAA, VWCE, FWRA, XEON, ...). Their large
    // value with zero income dragged the average yield down to ~half its real value.
    // Correct approach: only positions that actually generate income go in either the
    // numerator OR the denominator — non-paying holdings are excluded from both.
    const incomeGen=(pos||[]).filter(p=>p.n>0&&p.cv>0).map(p=>{
      const dy=getQual(qm,p.t)?.dy||0;
      // fallback: last year actual income
      const hist=getIncomeYear(income,p.t,CUR_YEAR-1)||getIncomeYear(income,p.t,CUR_YEAR-2)||0;
      return{p,inc:dy>0?dy*p.n*p.cv:hist};
    }).filter(x=>x.inc>0);
    const totalPortVal=incomeGen.reduce((s,{p})=>s+p.n*p.cv,0);
    const totalAnnualIncAll=incomeGen.reduce((s,{inc})=>s+inc,0);
    const avgYield=totalPortVal>0?totalAnnualIncAll/totalPortVal:0;
    const incomeGenCost=incomeGen.filter(({p})=>getAv(p)>0);
    const totalPortCost=incomeGenCost.reduce((s,{p})=>s+p.n*getAv(p),0);
    const totalAnnualIncForYoc=incomeGenCost.reduce((s,{inc})=>s+inc,0);
    const avgYoc=totalPortCost>0?totalAnnualIncForYoc/totalPortCost:0;
    const soldDivUSD=(sold||[]).filter(p=>p.cat==='USD').reduce((s,p)=>s+getSoldDivTotal(p),0);
    const soldDivEUR=(sold||[]).filter(p=>p.cat!=='USD').reduce((s,p)=>s+getSoldDivTotal(p),0);
    const totDivUSD=pos.filter(p=>hasDividend(p,qm,income)&&p.cat==='USD').reduce((s,p)=>s+getIncome(income,p.t),0);
    const totDivEUR=pos.filter(p=>hasDividend(p,qm,income)&&p.cat!=='USD').reduce((s,p)=>s+getIncome(income,p.t),0);
    return{tv,tc,pl,plp,iu,ie,ietf,sectors,top10,avgYoc,avgYield,valUSD,valEUR,valEtfEq,valEtfBo,costUSD,costEUR,costETF,plUSD,plEUR,plEtfEq,plEtfBo,sectorPL:smPL,grandDivUSD:totDivUSD+soldDivUSD,grandDivEUR:totDivEUR+soldDivEUR,totDivUSD,soldDivUSD,totDivEUR,soldDivEUR};
  },[pos,qual,income,sold]);

  /* ── Performance Metrics: trailing CAGR ─────────────────────────────────
     Fixes applied per audit (Critical #4, #8):
     - Dividends (income{} + sold[].divByYear) are included as positive
       cash flows in trailing CAGR calculations. income{} only
       stores annual totals per ticker (no exact payment dates), so each
       year's total is posted on June 30 of that year — a documented
       approximation. Fixing this properly requires recording exact
       dividend payment dates going forward.
     - Trailing CAGR uses cash-flow IRR with net cash flows before the
       selected cutoff as the synthetic opening balance. Historical portfolio
       valuations are not available, so this is an approximation.
     Not fixed (documented, not silently patched):
     - Historical USD→EUR conversion still uses today's static FX rate for
       all past transactions (High severity, needs a historical FX data
       source to fix properly).
  ── */
  const perfMetrics=useMemo(()=>{
    const FX=cfg?.fxEurUsd||1.08;
    const toEUR=(p,val)=>p.cat==='USD'?val/FX:val;
    const today=new Date();

    // Buy/sell transactions across active + sold positions
    const allTx=[...(pos||[]),...(sold||[])].flatMap(p=>(p.transactions||[]).map(tx=>({
      date:new Date(tx.date),
      cf:toEUR(p,tx.type==='buy'?-(tx.n*tx.price):(tx.n*tx.price)),
      type:tx.type,
      cat:p.cat,
    })));

    // Dividend cash flows (previously entirely missing — Critical #4)
    const catByNormTicker={};
    [...(pos||[]),...(sold||[])].forEach(p=>{catByNormTicker[normTicker(p.t)]=p.cat;});
    const divTx=[];
    Object.entries(income||{}).forEach(([t,years])=>{
      const cat=catByNormTicker[normTicker(t)]||'EUR';
      Object.entries(years||{}).forEach(([y,v])=>{
        if(v>0) divTx.push({date:new Date(parseInt(y),5,30),cf:toEUR({cat},v),type:'dividend',cat});
      });
    });
    (sold||[]).forEach(p=>{
      Object.entries(p.divByYear||{}).forEach(([y,v])=>{
        if(v>0) divTx.push({date:new Date(parseInt(y),5,30),cf:toEUR(p,v),type:'dividend',cat:p.cat});
      });
    });

    const allCF=[...allTx,...divTx].sort((a,b)=>a.date-b.date);
    if(!allCF.length) return null;

    const currentVal=(pos||[]).reduce((s,p)=>s+toEUR(p,(p.n||0)*(p.cv||0)),0);
    const firstDate=allCF[0].date;
    const totalDays=(today-firstDate)/(1000*60*60*24);
    const totalYears=totalDays/365.25;
    if(totalYears<=0) return null;

    // ── XIRR (Newton-Raphson) for trailing periods ────────────────────────
    function xirr(cfs){
      const t0=cfs[0].date;
      const years=cfs.map(c=>(c.date-t0)/(365.25*24*60*60*1000));
      let r=0.1;
      for(let i=0;i<200;i++){
        let f=0,df=0;
        for(let j=0;j<cfs.length;j++){
          const v=cfs[j].amount,t=years[j];
          if((1+r)<=0) continue; // guard against invalid base — replaces Math.abs which was corrupting sign
          const base=Math.pow(1+r,t);
          f+=v/base;
          df-=t*v/(base*(1+r));
        }
        if(Math.abs(df)<1e-14) break;
        const nr=r-f/df;
        if(Math.abs(nr-r)<1e-9){r=nr;break;}
        r=Math.max(nr,-0.9999);
      }
      return isFinite(r)?r:null;
    }

    // Without historic portfolio valuations, approximate each trailing CAGR
    // using net cash flows before the cutoff as the synthetic opening balance.
    const trailingCagr=years=>{
      const cutoff=new Date(today.getFullYear()-years,today.getMonth(),today.getDate());
      if(cutoff<firstDate)return null;
      const before=allCF.filter(t=>t.date<cutoff);
      const within=allCF.filter(t=>t.date>=cutoff);
      const cfs=[
        {date:cutoff,amount:before.reduce((s,t)=>s+t.cf,0)},
        ...within.map(t=>({date:t.date,amount:t.cf})),
        {date:today,amount:currentVal},
      ];
      try{
        const r=xirr(cfs);
        return r!=null&&r>-0.9999&&r<50?r:null;
      }catch(e){return null;}
    };
    const cagr1y=trailingCagr(1);
    const cagr3y=trailingCagr(3);
    const cagr5y=trailingCagr(5);

    return{cagr1y,cagr3y,cagr5y,firstDate,totalYears};
  },[pos,sold,income,cfg]);

  /* ── Benchmark returns (S&P 500 / MSCI World) since portfolio inception ──
     Originally attempted a live browser fetch from Stooq — confirmed blocked
     by CORS in practice, so this was dropped in favour of a manually-
     researched, year-by-year breakdown cached in cfg.benchmarkCache. Storing
     the actual per-year returns (rather than one opaque pre-computed %)
     means the annualised figure shown here is derived and checkable, not a
     black box — chain the years exactly like a real total-return index
     would: (1+r2023)×(1+r2024)×...−1, then annualise over the same
     years-elapsed as the portfolio's own IRR/CAGR, so all 5 tiles are
     directly comparable. To refresh: ask Claude to re-research current
     returns and add/update a year entry in cfg.benchmarkCache — no live
     network call, no CORS risk. */
  const chainReturn=byYear=>{
    const vals=Object.values(byYear||{});
    if(!vals.length) return null;
    return vals.reduce((acc,r)=>acc*(1+r),1)-1;
  };
  const bench=(()=>{
    const years=perfMetrics?.totalYears;
    const spxCum=chainReturn(cfg?.benchmarkCache?.sp500?.byYear);
    const worldCum=chainReturn(cfg?.benchmarkCache?.msciWorld?.byYear);
    return{
      spx:(spxCum!=null&&years>0)?Math.pow(1+spxCum,1/years)-1:null,
      world:(worldCum!=null&&years>0)?Math.pow(1+worldCum,1/years)-1:null,
      spxCum,worldCum,
      asOf:cfg?.benchmarkCache?.asOf??null,
    };
  })();

  return h('div',null,
    h('div',{className:'kpi-grid grid-r5 grid grid-cols-2 gap-3',style:{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:12,marginBottom:24}},
      h(Kpi,{label:'Portfolio Value',value:'$'+fn(m.valUSD)+' · €'+fn(m.valEUR+m.valEtfEq+m.valEtfBo),accent:'bl',sub:'Investido: $'+fn(m.costUSD)+'  ·  €'+fn(m.costEUR+m.costETF)}),
      h(Kpi,{label:'Total P&L',value:(m.pl>=0?'+€':'-€')+fn(Math.abs(m.pl)),accent:'bl',sub:(()=>{const eurTotal=m.plEUR+m.plEtfEq+m.plEtfBo;return 'P&L: '+(m.plUSD>=0?'+':'-')+'$'+fn(Math.abs(m.plUSD))+' · '+(eurTotal>=0?'+':'-')+'€'+fn(Math.abs(eurTotal));})()} ),
      h(Kpi,{label:'Average Yield',value:fp(m.avgYield),accent:'bl',sub:'Yield on Cost '+fp(m.avgYoc)}),
      h(Kpi,{label:'Dividendos Totais',value:'$'+fn(m.grandDivUSD)+' · €'+fn(m.grandDivEUR),accent:'bl',sub:(()=>{const fx=cfg?.fxEurUsd||1.08;const months=(perfMetrics?.totalYears||0)*12;const totalEUR=m.grandDivEUR+(m.grandDivUSD/fx);const mly=months>0?totalEUR/months:0;return 'Média: €'+fn(mly)+'/mês';})()}),
      /* Investments outside the portfolio (all owners) */
      (()=>{
        const invs=wealthInvestments(wealth);
        if(!invs.length)return null;
        const lots=invs.flatMap(w=>wealth[w.key].investimentos||[]);
        const sum=investmentsSummary(lots,pos,cfg);
        const clCost=lots.reduce((s,r)=>s+(r.valorInvestido||0),0);
        const clPL=sum.value-clCost;
        const clPlp=clCost>0?clPL/clCost:0;
        return h(Kpi,{label:invs.length===1?invs[0].label:'Outros investimentos',
          value:'€'+fn(sum.value),
          accent:'bl',
          sub:'P&L: '+(clPL>=0?'+':'-')+'€'+fn(Math.abs(clPL))+' ('+fp(clPlp)+')'});
      })(),
    ),
    h('div',{className:'grid gap-4 items-start mb-4 grid-cols-1 md:grid-cols-[2fr_1fr]'},
      h('div',{className:'flex flex-col gap-4'},

        /* ── Performance Metrics ── */
        (()=>{
          const pm=perfMetrics;
          const fmt=v=>v==null?'—':(v>=0?'+':'')+(v*100).toFixed(2)+'%';
          const col=v=>v==null?'var(--muted)':v>=0?'var(--green)':'var(--red)';
          return h('div',{className:'card'},
            h('div',{className:'flex items-center gap-2.5 mb-3.5'},
              h('h3',{className:'font-bold text-[13px] tracking-[.06em] uppercase whitespace-nowrap text-slate-200'},'Performance Metrics'),
              h(InfoTooltip,{text:'Dividendos incluídos a partir de totais anuais (data aproximada: 30 Jun de cada ano) · Câmbio USD→EUR usa taxa actual para todo o histórico',side:'right'}),
              h('div',{className:'flex-1 h-px bg-[var(--border)]'}),
              h('span',{className:'font-mono text-[10px] text-slate-500'},'Desde '+(pm?.firstDate?.toISOString().slice(0,10)||'—'))
            ),
            h('div',{className:'grid grid-cols-2 gap-3 sm:grid-cols-5 mb-3'},
              [
                {key:'CAGR1Y',label:'CAGR 1Y',full:'CAGR Anualizado — 1 Ano',val:pm?.cagr1y,
                  desc:'CAGR anualizado dos últimos 12 meses. Só é calculado quando existem cash flows desde há pelo menos 1 ano; sem dados suficientes aparece —. Como não há valorizações históricas do portfolio no início do período, o saldo inicial é aproximado pelo capital líquido investido antes do corte. Inclui dividendos e usa o câmbio actual para valores históricos em USD.'},
                {key:'CAGR3Y',label:'CAGR 3Y',full:'CAGR Anualizado — 3 Anos',val:pm?.cagr3y,
                  desc:'Taxa anualizada dos últimos 3 anos. Como não há histórico de valorizações do portfolio a essa data, usa-se o capital líquido já investido antes do corte de 3 anos como "saldo inicial" sintético, e calcula-se o IRR a partir daí. Aproximação: ganhos/perdas não realizados acumulados antes desse corte ficam implícitos no valor actual em vez de correctamente distribuídos no tempo — dado o portfolio ter só ~3.5 anos, a diferença face a um valor exacto deverá ser pequena.'},
                {key:'CAGR5Y',label:'CAGR 5Y',full:'CAGR Anualizado — 5 Anos',val:pm?.cagr5y,
                  desc:'CAGR anualizado dos últimos 5 anos. Só é calculado quando existem cash flows desde há pelo menos 5 anos; sem dados suficientes aparece —. Como não há valorizações históricas do portfolio no início do período, o saldo inicial é aproximado pelo capital líquido investido antes do corte. Inclui dividendos e usa o câmbio actual para valores históricos em USD.'},
                {key:'SPX',label:'S&P 500',full:'S&P 500 Total Return (anualizado)',val:bench.spx,
                  desc:'Retorno total anualizado do S&P 500 (preço + dividendos reinvestidos) desde '+(pm?.firstDate?.toISOString().slice(0,10)||'—')+', fonte slickcharts.com/sp500/returns. Calculado a partir do detalhe ano-a-ano em Config → Preferências (cumulativo: '+(bench.spxCum!=null?(bench.spxCum>=0?'+':'')+(bench.spxCum*100).toFixed(2)+'%':'—')+') — não é ao vivo. Actualizado em '+(bench.asOf||'—')+'.'},
                {key:'MSCI',label:'MSCI World',full:'MSCI World Net Total Return (anualizado)',val:bench.world,
                  desc:'Retorno total anualizado do MSCI World Net Total Return USD (inclui dividendos reinvestidos) desde '+(pm?.firstDate?.toISOString().slice(0,10)||'—')+', fonte MSCI factsheet oficial. Calculado a partir do detalhe ano-a-ano em Config → Preferências (cumulativo: '+(bench.worldCum!=null?(bench.worldCum>=0?'+':'')+(bench.worldCum*100).toFixed(2)+'%':'—')+') — não é ao vivo. Actualizado em '+(bench.asOf||'—')+'.'},
              ].map(m=>h('div',{key:m.key,style:{
                background:'var(--s2)',border:'1px solid var(--border)',
                borderRadius:10,padding:'16px 14px',textAlign:'center',
              }},
                h('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',gap:5,marginBottom:6}},
                  h(InfoTooltip,{text:m.desc,side:'right'}),

                ),
                h('div',{style:{fontSize:24,fontWeight:800,color:col(m.val),fontFamily:'var(--mono)',letterSpacing:'-1px'}},fmt(m.val)),
                m.sub!==undefined&&h('div',{style:{fontSize:12,color:'var(--muted)',marginTop:2}},'Total período: '+fmt(m.sub))
              ))
            ),
          );
        })(),

        h('div',{className:'card'},
          h(Shdr,{title:'Alocação por Posição'}),
          h(DonutChart,{pos,cfg,half:true})
        ),


      ),
      h('div',{className:'flex flex-col gap-3'},
h('div',{className:'card-sm'},
          (()=>{
            const FX_EUR_USD = cfg?.fxEurUsd||1.08;
            // The "goal" for projected annual income IS covering monthly expenses —
            // no separate arbitrary income target.
            const totalExpMensal = monthlyExpensesTotal(cfg);
            const GOAL = totalExpMensal*12;
            const MONTHLY_CAP = cfg?.monthlyCapital||1200;
            const YIELD = cfg?.targetYield||0.045;
            const DIV_GROWTH = cfg?.divGrowth||0.03;

            // Single source of truth for projected income — used for BOTH the annual
            // figure and the monthly coverage bar below, so the two numbers can never
            // silently disagree (previously each had its own slightly different formula:
            // one with a historical-income fallback, one without).
            const qm2=buildQualMap(qual||[]);
            const lastYearIncome=(ticker)=>{
              const t=normTicker(ticker);
              for(let y=CUR_YEAR;y>=CUR_YEAR-2;y--){
                const v=getIncomeYear(income,t,y);
                if(v>0)return v;
              }
              return 0;
            };
            const posIncome=(p)=>{
              const dy=getQual(qm2,p.t)?.dy||0;
              if(dy>0&&p.cv>0) return{annual:dy*p.n*(p.cv||0),source:'dy',dy};
              const hist=lastYearIncome(p.t);
              if(hist>0) return{annual:hist,source:'hist',dy:p.cv>0&&p.n>0?hist/(p.n*p.cv):0};
              return{annual:0,source:'none',dy:0};
            };
            const padiUSD=pos.filter(p=>p.cat==='USD').reduce((s,p)=>s+posIncome(p).annual,0);
            const padiEUR=pos.filter(p=>p.cat!=='USD').reduce((s,p)=>s+posIncome(p).annual,0);
            const cur=(padiUSD/FX_EUR_USD)+padiEUR;
            const monthlyEUR=cur/12;

            const pctAnnual=GOAL>0?Math.min(cur/GOAL,1)*100:0;
            const pctMonthly=totalExpMensal>0?Math.min(monthlyEUR/totalExpMensal,1)*100:0;
            const incomeAt=y=>{let v=cur;for(let i=0;i<y;i++)v=v*(1+DIV_GROWTH)+MONTHLY_CAP*YIELD;return v;};

            const color=pctAnnual>=100?'var(--green)':pctAnnual>=70?'var(--gold)':'var(--blue)';
            const colExp=pctMonthly>=100?'var(--green)':pctMonthly>=75?'var(--gold)':pctMonthly>=50?'var(--blue)':'var(--red)';

            return h('div',null,
              /* Header row */
              h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}},
                h('div',null,
                  h('div',{style:{display:'flex',alignItems:'center',gap:5,marginBottom:4}},
                    h(InfoTooltip,{text:'Fórmula: divAnterior × (1 + '+((DIV_GROWTH*100).toFixed(0))+'% DGR) + €'+MONTHLY_CAP+' × '+(YIELD*100).toFixed(1)+'% yield · DGR = dividend growth rate · '+((YIELD*100).toFixed(1))+'% = yield alvo sobre novos reforços',side:'right'}),

                  ),
                  h('div',{style:{fontSize:22,fontWeight:700,color:'var(--gold)'}},
                    '€'+fn(cur)+'/ano'),
                  h('div',{style:{fontSize:12,color:'var(--muted)',marginTop:3}},
                    '$'+fn(padiUSD)+' + €'+fn(padiEUR)+'  ·  ~€'+fn(monthlyEUR)+'/mês')
                ),
                h('div',{className:'text-right'},

                  h('div',{style:{fontSize:13,fontWeight:700,color}},'€'+GOAL+'/ano'),
                  h('div',{style:{fontSize:12,color,fontWeight:700}},pctAnnual.toFixed(1)+'% atingido')
                )
              ),

              /* Monthly coverage bar — same underlying number as above (cur/12), just at
                 the timeframe that actually matters for paying the bills */
              h('div',{style:{position:'relative',height:24,background:'var(--s2)',borderRadius:6,overflow:'hidden',marginBottom:12}},
                h('div',{style:{position:'absolute',left:0,top:0,bottom:0,width:pctMonthly.toFixed(1)+'%',
                  background:'linear-gradient(90deg,#2563eb,'+colExp+')',borderRadius:6,transition:'width .6s ease'}}),
                h('div',{style:{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 10px'}},

                    '€'+fn(monthlyEUR,2)+' / €'+totalExpMensal+' por mês'),

              ),

              /* Y+1 / Y+3 / Y+5 / Y+10 mini projections */
              h('div',{style:{display:'flex',gap:8,flexWrap:'wrap'}},
                [1,3,5,10].map(y=>{

                  return h('div',{key:y,style:{flex:1,minWidth:70,background:'var(--s2)',borderRadius:6,
                    padding:'8px 10px',border:'1px solid var(--border)',textAlign:'center'}},
                    h('div',{style:{fontSize:11,fontWeight:700,color:'var(--muted)',letterSpacing:'.06em',marginBottom:4}},
                      'Y+'+y),
                    h('div',{style:{fontSize:12,fontWeight:700,color:col}},
                      '€'+fn(fv,0)),
                    h('div',{style:{fontSize:10,color:'var(--muted)',marginTop:2}},
                      '~€'+fn(fv/12,0)+'/mês')
                  );
                })
              ),
            );
          })()
        ),

        /* ── Net Worth Overview ── */
        (()=>{
          // PPR: latest non-null valorInvestido per product
          const pprRows=wealth?.ppr||[];
          const pprLatest=pprRows.reduce((acc,r)=>{if(r.valorInvestido!=null)acc[r.produto]=r.valorInvestido;return acc;},{});
          const pprTotal=Object.values(pprLatest).reduce((s,v)=>s+v,0);
          // Aforro: sum of v2025 across all series
          const aferroTotal=(wealth?.aforro||[]).reduce((s,r)=>s+(Number(r.v2025)||Number(r.investimento)||0),0);
          // Depósitos a Prazo
          const depositosTotal=(wealth?.depositos||[]).reduce((s,r)=>s+(r.valor||0),0);
          // Investments outside the portfolio, one line per owner section
          const invItems=wealthInvestments(wealth).map(w=>({label:w.label,val:investmentsSummary(wealth[w.key].investimentos,pos,cfg).value,col:w.color}));
          const invTotal=invItems.reduce((s,x)=>s+x.val,0);
          // Portfolio: total market value (EUR)
          const portTotal=m.tv||0;
          const jurosCapital=(wealth?.juros||[]).reduce((s,r)=>s+(r.valor||0),0);
          const grandTotal=portTotal+pprTotal+aferroTotal+depositosTotal+invTotal+jurosCapital;

          const items=[
            {label:'Portfolio Value',val:portTotal,col:nwc.portfolio||'var(--green)'},
            {label:'PPR',val:pprTotal,col:nwc.ppr||'var(--gold)'},
            {label:'Certificados de Aforro',val:aferroTotal,col:nwc.aforro||'var(--blue)'},
            {label:'Depósitos a Prazo',val:depositosTotal,col:nwc.depositos||'#a78bfa'},
            ...invItems,
            {label:'Juros / Cash',val:jurosCapital,col:'var(--green)'},
          ].filter(x=>x.val>0).sort((a,b)=>b.val-a.val);
          return h('div',{className:'card'},
            h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:12,paddingBottom:12,borderBottom:'1px dashed var(--border)'}},
              h('span',{className:'font-bold text-[13px] tracking-[.06em] uppercase text-slate-200'},'Net Worth'),
              h('span',{style:{fontSize:22,fontWeight:700,color:'var(--green)'}},
                '€'+grandTotal.toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2}))
            ),
            h('div',{style:{display:'flex',flexDirection:'column',gap:14}},
              items.map(({label,val,col})=>{
                const pct=grandTotal>0?val/grandTotal:0;
                return h('div',{key:label},
                  h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}},
                    h('div',{style:{display:'flex',alignItems:'center',gap:7}},
                      h('span',{style:{width:7,height:7,borderRadius:'50%',background:col,flexShrink:0}}),
                      h('span',{style:{fontSize:13,color:'var(--muted)',fontWeight:400}},label)
                    ),
                    h('div',{style:{display:'flex',alignItems:'baseline',gap:8}},
                      h('span',{className:'mono-sm-muted'},(pct*100).toFixed(1)+'%'),
                      h('span',{className:'font-mono text-sm font-bold text-slate-50'},
                        '€'+val.toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2}))
                    )
                  ),
                  h('div',{className:'h-1 bg-[var(--s2)] rounded overflow-hidden'},
                    h('div',{style:{height:'100%',width:(pct*100)+'%',background:col,borderRadius:6,transition:'width .4s ease'}})
                  )
                );
              })
            )
          );
        })(),

      )
    ),

  );
}

function QualityScoreTable({qual,pos}){
  const qualSorted=useMemo(()=>[...qual].sort((a,b)=>(b.sc||0)-(a.sc||0)),[qual]);
  const posMap=useMemo(()=>buildPosMap(pos),[pos]);

  const sc2col=sc=>sc>=83?'var(--green)':sc>=62?'var(--blue)':sc>=42?'var(--tier-ok)':sc>=21?'var(--tier-warn)':'var(--red)';
  const pct=v=>v!=null?(v>=0?'+':'')+(v*100).toFixed(1)+'%':'—';

  // Avg FCF Payout — only positions with active holdings and py data
  const activeTickers=new Set((pos||[]).filter(p=>p.n>0).map(p=>normTicker(p.t)));
  const pyVals=qualSorted.filter(q=>activeTickers.has(normTicker(q.t))&&q.py!=null).map(q=>q.py);
  const avgPy=pyVals.length>0?pyVals.reduce((s,v)=>s+v,0)/pyVals.length:null;
  const pyCol=avgPy==null?'var(--muted)':avgPy>1.0?'var(--red)':avgPy>0.75?'var(--tier-warn)':avgPy>0.5?'var(--gold)':'var(--green)';

  // Avg Score
  const scVals=qualSorted.filter(q=>activeTickers.has(normTicker(q.t))&&q.sc!=null).map(q=>q.sc);
  const avgSc=scVals.length>0?scVals.reduce((s,v)=>s+v,0)/scVals.length:null;
  const scCol=avgSc==null?'var(--muted)':avgSc>=66?'var(--green)':avgSc>=44?'var(--gold)':avgSc>=22?'var(--tier-warn)':'var(--red)';
  // Avg DivGr 1Y
  const g1Vals=qualSorted.filter(q=>activeTickers.has(normTicker(q.t))&&q.g1!=null).map(q=>q.g1);
  const avgG1=g1Vals.length>0?g1Vals.reduce((s,v)=>s+v,0)/g1Vals.length:null;
  const g1Col=avgG1==null?'var(--muted)':avgG1>=0.08?'var(--green)':avgG1>=0.04?'var(--gold)':avgG1>=0?'var(--tier-warn)':'var(--red)';
  // Avg DivGr 3Y
  const g3Vals=qualSorted.filter(q=>activeTickers.has(normTicker(q.t))&&q.g3!=null).map(q=>q.g3);
  const avgG3=g3Vals.length>0?g3Vals.reduce((s,v)=>s+v,0)/g3Vals.length:null;
  const g3Col=avgG3==null?'var(--muted)':avgG3>=0.08?'var(--green)':avgG3>=0.04?'var(--gold)':avgG3>=0?'var(--tier-warn)':'var(--red)';
  // Avg DivGr 5Y
  const g5Vals=qualSorted.filter(q=>activeTickers.has(normTicker(q.t))&&q.g5!=null).map(q=>q.g5);
  const avgG5=g5Vals.length>0?g5Vals.reduce((s,v)=>s+v,0)/g5Vals.length:null;
  const g5Col=avgG5==null?'var(--muted)':avgG5>=0.08?'var(--green)':avgG5>=0.04?'var(--gold)':avgG5>=0?'var(--tier-warn)':'var(--red)';

  // ── Table rows + per-column metrics (shared by body rows and the Média row) ──
  const tableRows=qualSorted.filter(q=>activeTickers.has(normTicker(q.t)));
  const yocOf=q=>{
    const p=posMap[q.t]||posMap[normTicker(q.t)];
    const av=p?getAv(p):0;
    return p?.n>0&&q.dy>0&&p.cv>0&&av>0?cx(p,q.dy).yoc:null;
  };
  const shYieldOf=q=>q.dy!=null||q.buyback!=null?(q.dy||0)+(q.buyback||0):null;
  // Chowder Rule = dividend yield + 5Y dividend growth (same definition used in the stock modal / Analytics)
  const chowderOf=q=>q.dy!=null&&q.g5!=null?q.dy+q.g5:null;
  const METRIC_KEYS=['g1','g3','g5','g10','py','dy','chowder','yoc','buyback','sy','eps','debt','roic','fcf','revgr','opmar'];
  const rowMetrics=q=>({g1:q.g1,g3:q.g3,g5:q.g5,g10:q.g10,py:q.py,dy:q.dy,chowder:chowderOf(q),yoc:yocOf(q),buyback:q.buyback,sy:shYieldOf(q),eps:q.eps,debt:q.debt,roic:q.roic,fcf:q.fcf,revgr:q.revgr,opmar:q.opmar});
  const metricRows=tableRows.map(q=>({q,m:rowMetrics(q)}));
  const meanOf=vals=>{const v=vals.filter(x=>x!=null&&!isNaN(x));return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;};
  const avgM=Object.fromEntries(METRIC_KEYS.map(k=>[k,meanOf(metricRows.map(r=>r.m[k]))]));
  const avgScore=meanOf(tableRows.map(q=>q.sc));

  // Chowder tiers mirror the score bands in calcScore: ≤8 / 8-10 / 10-12 / 12-15 / >15
  const chowderTier=v=>{
    if(v==null)return{bg:'',fg:'var(--muted)'};
    if(v<=0.08)return{bg:'#3b0a0a',fg:'var(--red)'};
    if(v<=0.10)return{bg:'#431407',fg:'var(--tier-warn)'};
    if(v<=0.12)return{bg:'#3d3108',fg:'var(--tier-ok)'};
    if(v<=0.15)return{bg:'#14532d',fg:'#86efac'};
    return{bg:'#052e16',fg:'var(--green)'};
  };
  const badgeCell=(key,tier,text,title)=>h('td',{key,title},
    h('span',{style:{display:'inline-block',width:64,textAlign:'right',fontSize:13,fontFamily:'var(--mono)',fontWeight:700,padding:'2px 4px',borderRadius:6,background:tier.bg||undefined,color:tier.fg}},text));
  const chowderCell=v=>badgeCell('chowder',chowderTier(v),v!=null?(v*100).toFixed(1)+'%':'—',
    v==null?'Dados insuficientes':v>0.12?'Acima de 12% — cumpre a Chowder Rule':'12% ou abaixo — não cumpre a Chowder Rule');
  // Yield tiers mirror the Shareholder Yield score bands in calcScore (<0.5 / 0.5-1.5 / 1.5-2.5 / 2.5-3.5 / 3.5-4.5 / 4.5-8 / >8)
  const yieldTier=v=>{
    if(v==null)return{bg:'',fg:'var(--muted)'};
    if(v>0.08)return{bg:'#2a1010',fg:'var(--red)'};
    if(v>=0.045)return{bg:'#052e16',fg:'var(--green)'};
    if(v>=0.035)return{bg:'#14532d',fg:'#86efac'};
    if(v>=0.025)return{bg:'#3d3108',fg:'var(--tier-ok)'};
    if(v>=0.015)return{bg:'#431407',fg:'var(--tier-warn)'};
    if(v>=0.005)return{bg:'#2a1010',fg:'var(--red)'};
    return{bg:'#3b0a0a',fg:'var(--red)'};
  };
  const yieldCell=v=>badgeCell('dy',yieldTier(v),v!=null?(v*100).toFixed(2)+'%':'—',
    v==null?'Dados insuficientes':v>0.08?'Acima de 8% — atenção a possível yield trap':'Escala do Shareholder Yield (score)');
  const numCell=(key,color,text,extra)=>h('td',{key,style:{textAlign:'right',color,...(extra||{})}},text);
  // Cells after the Score column, in header order. `m` is one row's metrics (or the averages).
  const metricCells=m=>{
    const yocCol=m.yoc==null?'var(--muted)':m.yoc<0.02?'var(--red)':m.yoc<0.03?'var(--tier-warn)':m.yoc<0.06?'var(--gold)':'var(--green)';
    return [
      h(DgCell,{key:'g1',q:m,field:'g1'}),
      h(DgCell,{key:'g3',q:m,field:'g3'}),
      h(DgCell,{key:'g5',q:m,field:'g5'}),
      h(DgCell,{key:'g10',q:m,field:'g10'}),
      numCell('py',m.py!=null?(m.py>=0.5&&m.py<=0.8?'var(--green)':m.py>0.8?'var(--red)':'var(--tier-ok)'):'var(--muted)',m.py!=null?(m.py*100).toFixed(1)+'%':'—'),
      yieldCell(m.dy),
      chowderCell(m.chowder),
      numCell('yoc',yocCol,m.yoc!=null?(m.yoc*100).toFixed(2)+'%':'—'),
      badgeCell('buyback',yieldTier(m.buyback),m.buyback!=null?(m.buyback*100).toFixed(1)+'%':'—',m.buyback==null?'Dados insuficientes':m.buyback>0.08?'Acima de 8% — valor invulgarmente alto':'Escala do Shareholder Yield (score)'),
      badgeCell('sy',yieldTier(m.sy),m.sy!=null?(m.sy*100).toFixed(1)+'%':'—',m.sy==null?'Dados insuficientes':m.sy>0.08?'Acima de 8% — atenção a possível yield trap':'Escala do Shareholder Yield (score)'),
      numCell('eps',m.eps!=null?(m.eps>=0.07?'var(--green)':m.eps>=0.05?'#86efac':m.eps>=0.02?'var(--tier-ok)':m.eps>=0?'var(--tier-warn)':'var(--red)'):'var(--muted)',m.eps!=null?pct(m.eps):'—'),
      numCell('debt',m.debt!=null?(m.debt<=1?'var(--green)':m.debt<=2?'#86efac':m.debt<=3?'var(--tier-ok)':m.debt<=5?'var(--tier-warn)':'var(--red)'):'var(--muted)',m.debt!=null?m.debt.toFixed(1)+'x':'—'),
      numCell('roic',m.roic!=null?(m.roic>=0.20?'var(--green)':m.roic>=0.09?'var(--gold)':m.roic>=0.02?'var(--tier-warn)':'var(--red)'):'var(--muted)',m.roic!=null?(m.roic*100).toFixed(1)+'%':'—',{fontWeight:600}),
      numCell('fcf',m.fcf!=null?(m.fcf>=0.08?'var(--green)':m.fcf>=0.05?'var(--tier-ok)':m.fcf>=0.03?'var(--tier-warn)':'var(--red)'):'var(--muted)',m.fcf!=null?(m.fcf*100).toFixed(1)+'%':'—',{fontWeight:600}),
      numCell('revgr',m.revgr!=null?(m.revgr>=0.12?'var(--green)':m.revgr>=0.05?'var(--tier-ok)':m.revgr>=0.02?'var(--tier-warn)':'var(--red)'):'var(--muted)',m.revgr!=null?(m.revgr*100).toFixed(1)+'%':'—',{fontWeight:600}),
      numCell('opmar',m.opmar!=null?(m.opmar>=0.30?'var(--green)':m.opmar>=0.15?'var(--tier-ok)':m.opmar>=0.05?'var(--tier-warn)':'var(--red)'):'var(--muted)',m.opmar!=null?(m.opmar*100).toFixed(1)+'%':'—',{fontWeight:600})
    ];
  };

  return h('div',{style:{padding:'16px 0'}},
    /* ── 4 summary cards ── */
    h('div',{className:'grid grid-cols-2 gap-3 sm:grid-cols-5 mb-4'},
      h('div',{className:'card'},
        MicroLabel('Avg FCF Payout Ratio',{mb:6}),
        h('div',{style:{fontSize:22,fontWeight:800,color:pyCol}},avgPy!=null?(avgPy*100).toFixed(1)+'%':'—'),
        h('div',{className:'text-[10px] text-[var(--muted)] mt-1'},'<75% saudável · >100% insustentável')
      ),
      h('div',{className:'card'},
        MicroLabel('Avg Score',{mb:6}),
        h('div',{style:{fontSize:22,fontWeight:800,color:scCol}},avgSc!=null?avgSc.toFixed(1):'—'),
        h('div',{className:'text-[10px] text-[var(--muted)] mt-1'},scVals.length+' posições · max 103 · ≥62 forte')
      ),
      h('div',{className:'card'},
        MicroLabel('Avg Div CAGR 1A',{mb:6}),
        h('div',{style:{fontSize:22,fontWeight:800,color:g1Col}},avgG1!=null?(avgG1>=0?'+':'')+(avgG1*100).toFixed(1)+'%':'—'),
        h('div',{className:'text-[10px] text-[var(--muted)] mt-1'},g1Vals.length+' posições · ≥8% excelente · ≥4% bom')
      ),
      h('div',{className:'card'},
        MicroLabel('Avg Div CAGR 3A',{mb:6}),
        h('div',{style:{fontSize:22,fontWeight:800,color:g3Col}},avgG3!=null?(avgG3>=0?'+':'')+(avgG3*100).toFixed(1)+'%':'—'),
        h('div',{className:'text-[10px] text-[var(--muted)] mt-1'},g3Vals.length+' posições · ≥8% excelente · ≥4% bom')
      ),
      h('div',{className:'card'},
        MicroLabel('Avg Div CAGR 5A',{mb:6}),
        h('div',{style:{fontSize:22,fontWeight:800,color:g5Col}},avgG5!=null?(avgG5>=0?'+':'')+(avgG5*100).toFixed(1)+'%':'—'),
        h('div',{className:'text-[10px] text-[var(--muted)] mt-1'},g5Vals.length+' posições · ≥8% excelente · ≥4% bom')
      )
    ),
    h('div',{className:'card-table overflow-x-auto'},
      h('table',null,
        h('thead',null,
          h('tr',null,
            ['Ticker','Score','DivGr 1A','DivGr 3A','DivGr 5A','DivGr 10A','Payout %','Yield%','Chowder','YoC%','Buyback %','Sh.Yield%','EPS Gr%','Debt x','ROIC %','FCF %','Rev Gr%','Op Mar%'].map(x=>h('th',{key:x,title:x==='Sh.Yield%'?'Shareholder Yield':x==='Chowder'?'Chowder Rule: Yield + DivGr 5A (>12% cumpre)':undefined},x))
          )
        ),
        h('tbody',null,metricRows.map(({q,m})=>{
          const sc=q.sc||0;
          return h('tr',{key:q.t},
            h('td',{className:'font-semibold'},h(TickerLink,{t:q.t,className:'font-mono'})),
            h('td',null,h('span',{className:'badge',style:{background:'var(--s2)',color:sc2col(sc)}},sc)),
            ...metricCells(m)
          );
        })),
        metricRows.length>0&&h('tfoot',null,
          h('tr',{className:'tfoot-total'},
            h('td',{className:'font-semibold',title:'Média das posições ativas com dados em cada coluna'},'Média'),
            h('td',null,avgScore!=null?h('span',{className:'badge',style:{background:'var(--s2)',color:sc2col(avgScore)}},avgScore.toFixed(1)):'—'),
            ...metricCells(avgM)
          )
        )
      )
    )
  );
}

function IncomeRecovery({pos,income,qual,cfg}){
  const THIS_YEAR=new Date().getFullYear();
  const qualMap=useMemo(()=>buildQualMap(qual||[]),[qual]);

  const rows=useMemo(()=>{
    return(pos||[])
      .filter(p=>p.cat!=='ETF'&&(getQual(qualMap,p.t)?.dy||0)>0&&p.n>0&&p.cv>0&&getAv(p)>0)
      .map(p=>{
        const cost=p.n*getAv(p);
        const received=getIncome(income,p.t);          // total historical dividends
        const annual=(getQual(qualMap,p.t)?.dy||0)*p.n*p.cv;  // dy × n × cv
        const pct=cost>0?received/cost:0;
        const remaining=Math.max(cost-received,0);
        const yrs=annual>0?remaining/annual:Infinity;
        const year=isFinite(yrs)?Math.round(THIS_YEAR+yrs):null;
        const s=p.cat==='USD'?'$':'€';
        return{t:p.t,name:p.name||p.t,cat:p.cat,s,cost,received,annual,pct,yrs,year,country:p.country||''};
      })
      .sort((a,b)=>b.pct-a.pct);
  },[pos,income,qualMap]);

  // C9 FIX: convert all USD amounts to EUR before summing — previously mixed currencies directly
  const fx=cfg?.fxEurUsd||1.08;
  const toE=(cat,v)=>cat==='USD'?v/fx:v;
  const totCostAll=rows.reduce((s,r)=>s+toE(r.cat,r.cost),0);
  const totRecAll=rows.reduce((s,r)=>s+toE(r.cat,r.received),0);
  const totAnnAll=rows.reduce((s,r)=>s+toE(r.cat,r.annual),0);
  // Keep separate buckets for display only
  const totCostUSD=rows.reduce((s,r)=>s+(r.cat==='USD'?r.cost:0),0);
  const totCostEUR=rows.reduce((s,r)=>s+(r.cat!=='USD'?r.cost:0),0);
  const totRecUSD=rows.reduce((s,r)=>s+(r.cat==='USD'?r.received:0),0);
  const totRecEUR=rows.reduce((s,r)=>s+(r.cat!=='USD'?r.received:0),0);
  const totAnnUSD=rows.reduce((s,r)=>s+(r.cat==='USD'?r.annual:0),0);
  const totAnnEUR=rows.reduce((s,r)=>s+(r.cat!=='USD'?r.annual:0),0);
  const totPct=totCostAll>0?totRecAll/totCostAll:0;
  const totYrs=totAnnAll>0?Math.max(totCostAll-totRecAll,0)/totAnnAll:Infinity;

  return h('div',{className:'card-sm',style:{display:'flex',flexDirection:'column',gap:12}},
    /* Header */
    h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}},
      h('div',null,
        h(Shdr,{title:'⏳ Income Recovery',noRule:true}),
        h('div',{style:{fontSize:12,color:'var(--muted)',maxWidth:180,lineHeight:1.5,marginTop:-8}},
          h('span',{style:{whiteSpace:'nowrap'}},'Quanto do investimento já foi recuperado via dividendos?'))
      ),
      h('div',{className:'text-right'},
        h('div',{style:{fontSize:26,fontWeight:800,color:'var(--gold)'}},
          isFinite(totYrs)?totYrs.toFixed(1):'—'),
        h('div',{style:{fontSize:11,color:'var(--muted)'}},'anos a ritmo actual')
      )
    ),

    /* Progress bar */
    h('div',null,
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}},
        MicroLabel('Capital recuperado',{size:9,tag:'span',weight:400}),
        h('span',{style:{fontSize:13,fontWeight:700,color:'var(--blue)'}},(totPct*100).toFixed(1)+'%')
      ),
      h('div',{style:{height:8,background:'var(--s2)',borderRadius:6,overflow:'hidden'}},
        h('div',{style:{height:'100%',width:(Math.min(totPct,1)*100)+'%',
          background:'linear-gradient(90deg,#2563eb,var(--blue))',borderRadius:6,transition:'width .6s'}})
      )
    ),

    /* Stats row — USD and EUR shown separately */
    h('div',{className:'grid grid-cols-1 sm:grid-cols-2 gap-2'},
      totCostUSD>0&&h('div',{style:{background:'var(--s2)',borderRadius:6,padding:'8px 10px'}},
        MicroLabel('USD — Investido / Recebido / Ritmo',{size:9,weight:400,mb:2}),
        h('div',{style:{fontSize:12,fontWeight:700,color:'var(--blue)'}},'$'+fn(totCostUSD)+' · $'+fn(totRecUSD)+' · $'+fn(totAnnUSD)+'/ano')
      ),
      totCostEUR>0&&h('div',{style:{background:'var(--s2)',borderRadius:6,padding:'8px 10px'}},
        MicroLabel('EUR — Investido / Recebido / Ritmo',{size:9,weight:400,mb:2}),
        h('div',{style:{fontSize:12,fontWeight:700,color:'var(--green)'}},'€'+fn(totCostEUR)+' · €'+fn(totRecEUR)+' · €'+fn(totAnnEUR)+'/ano')
      )
    ),


    /* Per-stock table */
    h('div',{style:{paddingTop:8,overflowX:'auto'}},
      h('table',{style:{width:'100%',borderCollapse:'collapse',fontSize:12}},
        h('thead',null,h('tr',{className:'border-b border-[var(--border)]'},
          ['Ticker','Investido','Recebido','/ano','','Rec%','~Ano'].map(x=>
            h('th',{key:x,style:{padding:'3px 4px',textAlign:x==='Ticker'||x===''?'left':'right',
              color:'var(--muted)',fontSize:11,fontWeight:600,
              letterSpacing:'.05em',textTransform:'uppercase'}},x)
          )
        )),
        h('tbody',null,rows.map(r=>
          h('tr',{key:r.t,className:'border-b border-[var(--border)]'},
            h('td',{style:{padding:'5px 4px',color:'var(--text)',whiteSpace:'nowrap'}},
              h('span',{style:{fontSize:11,color:'var(--muted)',marginRight:4}},r.country),
              r.t),
            h('td',{style:{padding:'5px 4px',textAlign:'right',color:'var(--muted)'}},
              r.s+fn(r.cost,0)),
            h('td',{style:{padding:'5px 4px',textAlign:'right',color:'var(--green)'}},
              r.received>0?r.s+fn(r.received):'—'),
            h('td',{style:{padding:'5px 4px',textAlign:'right',color:'var(--blue)'}},
              r.s+fn(r.annual,0)),
            /* Progress bar column */
            h('td',{style:{padding:'5px 8px',width:80}},
              h('div',{style:{height:5,background:'var(--s2)',borderRadius:6,overflow:'hidden',minWidth:60}},
                h('div',{style:{
                  height:'100%',
                  width:(Math.min(r.pct,1)*100)+'%',
                  background:r.pct>=0.5?'var(--green)':r.pct>=0.2?'var(--gold)':'var(--blue)',
                  borderRadius:6
                }})
              )
            ),
            h('td',{style:{padding:'5px 4px',textAlign:'right',fontWeight:700,
              color:r.pct>=0.5?'var(--green)':r.pct>=0.2?'var(--gold)':'var(--muted)'}},
              (r.pct*100).toFixed(1)+'%'),
            h('td',{style:{padding:'5px 4px',textAlign:'right',color:'var(--muted)'}},
              r.year?'~'+r.year:'—')
          )
        ))
      )
    )
  );
}


function Port({pos,setPos,income,qual,setQual,cfg,sold,setSold}){
  const qualMap=useMemo(()=>buildQualMap(qual||[]),[qual]);
  // Total histórico recebido por ticker (soma de todos os anos no income tracker)
  const histIncome=useMemo(()=>
    Object.fromEntries(pos.map(p=>[p.t,getIncome(income,p.t)]))
  ,[pos,income]);
  const[flt,setFlt]=useState('TODAS');
  const[sf,setSf]=useState('sc');
  const[sd,setSd]=useState('desc');
  const[portTab,setPortTab]=useState('posicoes');

  const tots=useMemo(()=>{
    const r=pos.reduce((a,p)=>{const x=cx(p);a[p.cat].v+=x.val;a[p.cat].c+=x.cost;a.all+=x.val;return a;},{USD:{v:0,c:0},EUR:{v:0,c:0},ETF:{v:0,c:0},all:0});
    return r;
  },[pos]);

  const filtered=useMemo(()=>{
    let arr;
    if(flt==='TODAS')arr=pos;
    else arr=pos.filter(p=>p.cat===flt);
    // attach computed fields for sorting
    const withCalc=arr.map(p=>{
      const q=getQual(qualMap,p.t);
      const c=cx(p,q?.dy);
      const hi=histIncome[normTicker(p.t)]||histIncome[p.t]||0;
      const qsc=q?.sc??0;
      const av=getAv(p);
      const autoYoc=q?.dy>0&&p.cv>0&&av>0?c.yoc:null;
      return{...p,av,sc:qsc,_val:c.val,_cost:c.cost,_pl:c.pl,_plp:c.plp,_peso:c.val/tots.all,_inc:hi||c.inc,_yoc:autoYoc,_yld:q?.dy||c.yld,_totalret:c.pl+hi};
    });
    const keyMap={ticker:'t',sector:'sec',qtd:'n',pmed:'av',patu:'cv',custo:'_cost',valor:'_val',pl:'_pl',plp:'_plp',sc:'sc',peso:'_peso',income:'_inc',yoc:'_yoc',yield:'_yld',yoc_sort:'_yoc',total_return:'_totalret'};
    const k=keyMap[sf]||'_peso';
    return withCalc.sort((a,b)=>{
      let va=a[k]??-Infinity,vb=b[k]??-Infinity;
      if(typeof va==='string')return sd==='asc'?va.localeCompare(vb):vb.localeCompare(va);
      return sd==='asc'?va-vb:vb-va;
    });
  },[pos,flt,sf,sd,tots,qualMap,histIncome]);

  /* -- Totals / averages row for the table below (follows the active filter) --
     Money columns are summed; with 'Todas'/'EUR'/'ETF' the USD positions are converted to EUR
     (cfg.fxEurUsd), with the 'USD' filter everything stays in $. Score, Yield and YoC are
     simple averages over the positions that have a value. */
  const holdTotals=useMemo(()=>{
    const fx=cfg?.fxEurUsd||1.08;
    const inUsd=flt==='USD';
    const conv=(p,v)=>(!inUsd&&p.cat==='USD')?v/fx:v;
    let cost=0,val=0,pl=0,totRet=0,peso=0;
    const scs=[],ylds=[],yocs=[];
    filtered.forEach(p=>{
      const q=getQual(qualMap,p.t);
      const c=cx(p,q?.dy);
      const dy=q?.dy||0;
      const yld=dy>0&&p.cv>0?dy:c.yld;
      const yoc=dy>0&&p.cv>0&&p.av>0?c.yoc:null;
      cost+=conv(p,c.cost);val+=conv(p,c.val);pl+=conv(p,c.pl);totRet+=conv(p,p._totalret);peso+=c.val/tots.all;
      if(q&&q.sc!=null)scs.push(q.sc);
      if(yld>0)ylds.push(yld);
      if(yoc>0)yocs.push(yoc);
    });
    const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
    return{n:filtered.length,sym:inUsd?'$':'€',cost,val,pl,plp:cost>0?pl/cost:null,peso,totRet,
      sc:avg(scs),yld:avg(ylds),yoc:avg(yocs),mixed:flt==='TODAS'&&filtered.some(p=>p.cat==='USD')};
  },[filtered,flt,qualMap,tots,cfg]);

  /* ── P/L summary cards ── */
  const plSummary=useMemo(()=>{
    const fx=cfg?.fxEurUsd||1.08;
    const toE=(p,v)=>p.cat==='USD'?v/fx:v;
    // H2 FIX: convert USD P&L to EUR before summing — previously summed raw mixed currencies
    const unrealized=
      (tots.USD.v-tots.USD.c)/fx +
      (tots.EUR.v-tots.EUR.c) +
      (tots.ETF.v-tots.ETF.c);
    // H3 FIX: use fifoEngine realPL per sell — raw buy/sell totals bypassed FIFO and overstated cost for partial exits
    const realizedTrades=(sold||[]).reduce((s,p)=>s+toE(p,getSoldSummary(p).pl),0);
    // Dividend income: closed positions (divByYear) + open positions (income tracker) — all cash already received
    const incomeClosed=(sold||[]).reduce((s,p)=>s+toE(p,getSoldDivTotal(p)),0);
    const incomeOpen=(pos||[]).reduce((s,p)=>s+toE(p,getIncome(income,p.t)),0);
    const realizedIncome=incomeClosed+incomeOpen;
    const realized=realizedTrades+realizedIncome;
    return{unrealized,realized,total:unrealized+realized};
  },[tots,sold,pos,income,cfg]);

  const ts=f=>{if(sf===f)setSd(d=>d==='desc'?'asc':'desc');else{setSf(f);setSd('desc');}};
  const SA=f=>sf===f?(sd==='desc'?' ↓':' ↑'):'';
  const TH=({f,label,align})=>h('th',{className:'srt cursor-pointer hover:text-slate-200',style:align?{textAlign:align}:{},onClick:()=>ts(f)},label+SA(f));

  return h('div',null,
    /* ── P/L summary row — first thing on the Holdings page ── */
    h('div',{className:'grid grid-cols-1 sm:grid-cols-4 gap-3 mb-4'},
      [
        {label:'Total P/L',value:plSummary.total,sub:'Since inception',icon:null},
        {label:'Unrealized P/L',value:plSummary.unrealized,sub:'Open positions',icon:null},
        {label:'Realized Gains',value:plSummary.realized,sub:'Closed trades + all dividends received',icon:null},
      ].map(({label,value,sub,icon})=>{
        const pos2=value>=0;
        const col=pos2?'var(--green)':'var(--red)';
        const sign=pos2?'+':'-';
        return h('div',{key:label,style:{background:'var(--surface)',border:'1px solid var(--border)',
          borderLeft:'3px solid '+col,borderRadius:6,padding:'14px 18px'}},
          h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}},
            h('span',{style:{fontSize:12,fontWeight:700,letterSpacing:'.07em',textTransform:'uppercase',
              color:'var(--muted)'}},label),
            h('span',{style:{fontSize:13}},icon)
          ),
          h('div',{style:{fontSize:22,fontWeight:700,color:col}},
            sign+'€'+Math.abs(value).toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2})
          ),
          h('div',{className:'text-[10px] text-[var(--muted)] mt-1'},sub)
        );
      }).concat([
        /* 4th card — position counter */
        (()=>{
          const activeCount=(pos||[]).filter(p=>p.n>0).length;
          return h('div',{key:'positions',style:{background:'var(--surface)',border:'1px solid var(--border)',
            borderLeft:'3px solid var(--blue)',borderRadius:6,padding:'14px 18px'}},
            h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}},
              h('span',{style:{fontSize:12,fontWeight:700,letterSpacing:'.07em',textTransform:'uppercase',
                color:'var(--muted)'}},'Posições'),
              h('span',{style:{fontSize:13}},'')
            ),
            h('div',{style:{fontSize:22,fontWeight:700,color:'var(--blue)'}},activeCount),
            h('div',{className:'text-[10px] text-[var(--muted)] mt-1'},
              (pos||[]).filter(p=>p.n>0&&p.cat!=='ETF'&&!(p.sec||'').startsWith('ETF')).length+' Stocks · '+
              (pos||[]).filter(p=>p.n>0&&(p.cat==='ETF'||(p.sec||'').startsWith('ETF'))).length+' ETFs')
          );
        })()
      ])
    ),

    /* ── Inner tab bar ── */
    h('div',{className:'flex gap-2 mb-4 border-b border-[var(--border)] pb-3'},
      [['posicoes','Active'],['vendidas','Vendidas'],['qualidade','Quality Score']].map(([id,label])=>
        h('button',{key:id,className:'fb'+(portTab===id?' on':''),onClick:()=>setPortTab(id)},label)
      )
    ),



    /* ── Posições tab ── */
    portTab==='posicoes'&&h('div',null,
      h('div',{className:'grid grid-cols-1 sm:grid-cols-4 gap-3 mb-4'},
        ['USD','EUR','ETF'].map(cat=>{
          const t=tots[cat];const pl=t.v-t.c;const plp=t.c>0?pl/t.c:0;const s=sy(cat);
          const col=pl>=0?'var(--green)':'var(--red)';
          return h('div',{key:cat,style:{background:'var(--surface)',border:'1px solid var(--border)',
            borderLeft:'3px solid '+col,borderRadius:6,padding:'14px 18px'}},
            h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}},
              h('span',{style:{fontSize:12,fontWeight:700,letterSpacing:'.07em',textTransform:'uppercase',
                color:'var(--muted)'}},cat==='ETF'?'€ ETFs':`${s} ${cat} Stocks`),
              h('span',{title:'Peso na carteira (mesma base da coluna Exposure)',style:{fontSize:13,fontWeight:700,color:'var(--muted)'}},
                tots.all>0?(t.v/tots.all*100).toFixed(1)+'%':'—')
            ),
            h('div',{style:{fontSize:22,fontWeight:700}},s+fn(t.v)),
            h('div',{style:{display:'flex',alignItems:'baseline',gap:8,marginTop:4}},
              h('span',{style:{fontSize:14,fontWeight:700,color:col}},fp(plp)),
              h('span',{className:'text-[10px] text-[var(--muted)]'},(pl>=0?'+':'-')+s+fn(Math.abs(pl)))
            )
          );
        }),
        (()=>{
          const etfTer=cfg?.etfTer||{};
          const etfPos=(pos||[]).filter(p=>p.cat==='ETF'&&p.n>0&&p.cv>0);
          const totalCost=etfPos.reduce((s,p)=>s+p.n*p.cv*(etfTer[p.t]||0),0);
          const totalVal=etfPos.reduce((s,p)=>s+p.n*p.cv,0);
          const avgTer=totalVal>0?totalCost/totalVal:0;
          return h('div',{key:'ter',style:{background:'var(--surface)',border:'1px solid var(--border)',
            borderLeft:'3px solid var(--red)',borderRadius:6,padding:'14px 18px'}},
            h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}},
              h('span',{style:{fontSize:12,fontWeight:700,letterSpacing:'.07em',textTransform:'uppercase',
                color:'var(--muted)'}},'€ Custo TER — ETFs / ano')
            ),
            h('div',{style:{fontSize:22,fontWeight:700,color:'var(--red)'}},totalCost>0?'-€'+fn(totalCost):'—'),
            h('div',{className:'text-[10px] text-[var(--muted)] mt-1'},
              'TER médio '+(avgTer*100).toFixed(3)+'%'+'  ·  -€'+fn(totalCost/12)+'/mês')
          );
        })()
      ),
      h('div',{className:'flex gap-2 mb-3.5 flex-wrap items-center'},
        ['TODAS','USD','EUR','ETF'].map(f=>h('button',{key:f,className:'fb'+(flt===f?' on':''),onClick:()=>setFlt(f)},f==='TODAS'?'Todas':f)),
      ),
      h('div',{className:'card-table overflow-x-auto'},
        h('table',null,
          h('thead',null,h('tr',null,
            h(TH,{f:'ticker',label:'Ticker',align:'left'}),
            h(TH,{f:'sc',label:'Score'}),
            h(TH,{f:'pmed',label:'P.Médio'}),
            h(TH,{f:'patu',label:'Preço Actual'}),
            h(TH,{f:'custo',label:'Custo'}),
            h(TH,{f:'valor',label:'Valor'}),
            h(TH,{f:'pl',label:'P&L'}),
            h(TH,{f:'plp',label:'P&L%'}),
            h(TH,{f:'total_return',label:'P&L+Div'}),
            h(TH,{f:'yield',label:'Yield'}),
            h(TH,{f:'yoc',label:'YoC'}),
            h(TH,{f:'peso',label:'Exposure'}),
          )),
          h('tbody',null,filtered.map(p=>{
            const _q=getQual(qualMap,p.t);
            const c=cx(p,_q?.dy);const s=sy(p.cat);
            const _sc=_q?_q.sc:null;const _band=_sc!=null?(_sc>=68?'⭐':_sc>=51?'🟩':_sc>=34?'🟨':_sc>=17?'🟧':'🟥'):'';
            // Auto-compute YoC and Yield from position data
            const _dy=_q?.dy||0;
            const _yld=_dy>0&&p.cv>0?_dy:c.yld;
            const _yoc=_dy>0&&p.cv>0&&p.av>0?c.yoc:null;
            return h('tr',{key:p.id||p.t},
              h('td',{className:'font-mono'},h(TickerLink,{t:p.t})),
              h('td',{style:{whiteSpace:'nowrap'}},_sc!=null?_band+' '+_sc:'—'),
              h('td',{className:'mono-sm-muted'},fn(p.av)),
              h('td',{className:'mono-sm',title:priceFreshness(p).title},fn(p.cv),h(StaleDot,{p})),
              h('td',{className:'text-muted'},s+fn(c.cost)),
              h('td',null,s+fn(c.val)),
              h('td',{style:{color:c.pl>=0?'var(--green)':'var(--red)'}},( c.pl>=0?'+':'-')+s+fn(Math.abs(c.pl))),
              h('td',{style:{color:c.plp>=0?'var(--green)':'var(--red)'}},fp(c.plp)),
              h('td',{style:{color:(c.pl+(histIncome[normTicker(p.t)]||histIncome[p.t]||0))>=0?'var(--green)':'var(--red)'}},
                (()=>{const total=c.pl+(histIncome[normTicker(p.t)]||histIncome[p.t]||0);return(total>=0?'+':'-')+s+fn(Math.abs(total));})()
              ),
              h('td',{className:'text-muted'},_yld>0?fp(_yld):'—'),
              h('td',{className:'text-muted'},_yoc>0?fp(_yoc):'—'),
              h('td',{className:'text-[var(--muted)]'},fp(c.val/tots.all)),
            );
          })),
          filtered.length>0&&h('tfoot',null,h('tr',{className:'tfoot-total'},
            h('td',{className:'font-mono',title:'Total / média das '+holdTotals.n+' posições mostradas'+(holdTotals.mixed?' (USD convertido a EUR)':'')},
              'Total ',h('span',{className:'text-[var(--muted)]',style:{fontWeight:500}},'('+holdTotals.n+')')),
            h('td',{style:{whiteSpace:'nowrap'},title:'Média do score'},holdTotals.sc!=null?'Ø '+holdTotals.sc.toFixed(0):'—'),
            h('td'),

            h('td',{className:'text-muted'},holdTotals.sym+fn(holdTotals.cost)),

            h('td',{style:{color:holdTotals.pl>=0?'var(--green)':'var(--red)'}},(holdTotals.pl>=0?'+':'-')+holdTotals.sym+fn(Math.abs(holdTotals.pl))),
            h('td',{style:{color:(holdTotals.plp||0)>=0?'var(--green)':'var(--red)'},title:'P&L total / custo total'},holdTotals.plp!=null?fp(holdTotals.plp):'—'),
            h('td',{style:{color:holdTotals.totRet>=0?'var(--green)':'var(--red)'}},(holdTotals.totRet>=0?'+':'-')+holdTotals.sym+fn(Math.abs(holdTotals.totRet))),
            h('td',{className:'text-muted',title:'Média simples das posições com yield'},holdTotals.yld!=null?'Ø '+fp(holdTotals.yld):'—'),
            h('td',{className:'text-muted',title:'Média simples das posições com YoC'},holdTotals.yoc!=null?'Ø '+fp(holdTotals.yoc):'—'),
            h('td',{className:'text-[var(--muted)]'},fp(holdTotals.peso))
          ))
        )
      ),

      h('div',{className:'grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4'},
        /* Holdings Performance */
        h('div',{className:'card-sm'},

        ),

        h(IncomeRecovery,{pos,income,qual,cfg})
      )
    ),

    /* ── Vendidas tab ── */
    portTab==='vendidas'&&h(SoldPage,{sold,setSold,cfg}),

  );
}

  },'Limpar todos os dados');
  return h('div',{className:'flex gap-1.5'},

    },'Confirmar — apagar tudo'),
    h('button',{
      onClick:()=>setConfirm(false),

}

// ── Cotações online: test every ticker against a provider (plus an optional fallback
// for the tickers it can't price), then apply the ones you confirm ──
function PricePanel({cfg,setCfg,pos,setPos,wealth}){
  const[provider,setProvider]=useState(cfg?.priceProvider&&PRICE_PROVIDERS[cfg.priceProvider]?cfg.priceProvider:'twelvedata');
  const[fallback,setFallback]=useState(cfg?.priceFallback===''?'':(cfg?.priceFallback&&PRICE_PROVIDERS[cfg.priceFallback]?cfg.priceFallback:'alphavantage'));
  const[fallback2,setFallback2]=useState(cfg?.priceFallback2===''?'':(cfg?.priceFallback2&&PRICE_PROVIDERS[cfg.priceFallback2]?cfg.priceFallback2:'finnhub'));
  const[keys,setKeys]=useState(()=>Object.fromEntries(Object.keys(PRICE_PROVIDERS).map(id=>[id,readPriceKey(id)])));
  const[rows,setRows]=useState([]);
  const[running,setRunning]=useState(false);
  const[message,setMessage]=useState('');
  const cancel=useRef(false);
  const readAllKeys=()=>Object.fromEntries(Object.keys(PRICE_PROVIDERS).map(id=>[id,readPriceKey(id)]));
  // 1. Leaving Config stops a running test (it would keep spending the daily quota).
  useEffect(()=>()=>{cancel.current=true;},[]);
  // 3. Keys restored by an import while Config is open.
  useEffect(()=>{
    const refresh=()=>setKeys(readAllKeys());
    window.addEventListener('price-keys-changed',refresh);
    return()=>window.removeEventListener('price-keys-changed',refresh);
  },[]);
  const fb=fallback&&fallback!==provider?fallback:'';
  const fb2=fallback2&&fallback2!==provider&&fallback2!==fb?fallback2:'';
  const fallbacks=[fb,fb2].filter(Boolean);
  // Active positions plus reference tickers (e.g. an ETF held in a wealth <owner>Investimentos section),
  // whose price is stored in cfg.refPrices instead of a position. They are in EUR.
  const active=[...(pos||[]).filter(p=>(p.n==null||p.n>0)&&p.t),
    ...referenceTickers(wealth,pos,cfg).map(t=>({t,cat:'EUR',cv:cfg?.refPrices?.[t]?.cv||null,ref:true}))];
  const symbolFor=p=>(cfg?.priceSymbols&&cfg.priceSymbols[p.t])||defaultPriceSymbol(p);
  const setKey=(id,value)=>{const v=value.trim();setKeys(k=>({...k,[id]:v}));writePriceKey(id,v);};
  const changeProvider=id=>{setProvider(id);setRows([]);setMessage('');setCfg(c=>({...c,priceProvider:id}));};
  const changeFallback=id=>{setFallback(id);setRows([]);setMessage('');setCfg(c=>({...c,priceFallback:id}));};
  const changeFallback2=id=>{setFallback2(id);setRows([]);setMessage('');setCfg(c=>({...c,priceFallback2:id}));};
  const changeSymbol=(p,value)=>{
    const symbol=value.trim().toUpperCase();
    setCfg(c=>{
      const symbols={...(c?.priceSymbols||{})};
      if(!symbol||symbol===defaultPriceSymbol(p))delete symbols[p.t];else symbols[p.t]=symbol;
      return{...c,priceSymbols:symbols};
    });
  };
  const run=async()=>{
    if(!keys[provider]){setMessage('Falta a chave da API de '+PRICE_PROVIDERS[provider].name+'.');return;}
    cancel.current=false;setRunning(true);setMessage('A obter taxas de câmbio do BCE…');
    const next=active.map(p=>({t:p.t,ref:!!p.ref,symbol:symbolFor(p),target:positionCurrency(p),current:p.cv,status:'pending'}));
    setRows([...next]);
    let rates=null;
    try{rates=(await fetchEcbRates()).rates;}
    catch(e){setMessage(e.message+' Só as cotações já na moeda da posição podem ser aplicadas.');}
    const ask=async(i,id)=>{
      const q=await fetchQuote(id,next[i].symbol,keys[id]);
      const price=convertPrice(q.price,q.currency,next[i].target,rates);
      const diff=next[i].current>0?price/next[i].current-1:null;
      const warn=diff!==null&&Math.abs(diff)>0.25;
      return{status:'ok',via:id,raw:q.price,rawCurrency:q.currency,price,date:q.date,diff,warn,apply:!warn,error:null};
    };
    // Pass 1: main provider for every ticker. Pass 2: fallback for the ones that failed and it covers.
    const passes=[{id:provider,pick:()=>next.map((_,i)=>i)}];
    fallbacks.filter(id=>keys[id]).forEach(id=>passes.push({id,pick:()=>next.map((r,i)=>i).filter(i=>next[i].status==='error'&&providerCovers(id,next[i].symbol))}));
    for(const pass of passes){
      const info=PRICE_PROVIDERS[pass.id];
      const idx=pass.pick();
      let limited=false;
      for(let k=0;k<idx.length;k++){
        if(cancel.current)break;
        const i=idx[k];
        if(limited){next[i]={...next[i],status:'error',error:info.name+': '+RATE_LIMIT_MESSAGE+' Tenta amanhã.',apply:false};continue;}
        if(k>0)await new Promise(r=>setTimeout(r,info.delayMs));
        if(cancel.current)break;
        setMessage(`${info.name}: ${next[i].symbol} (${k+1}/${idx.length})…`);
        const prevError=next[i].error;
        next[i]={...next[i],status:'loading'};setRows([...next]);
        if(!providerCovers(pass.id,next[i].symbol)){
          next[i]={...next[i],status:'error',error:info.name+' não cobre esta bolsa.',apply:false};
        }else{
          try{next[i]={...next[i],...(await ask(i,pass.id))};}
          catch(error){
            next[i]={...next[i],status:'error',error:(prevError&&pass.id!==provider?prevError+' / ':'')+info.name+': '+error.message,apply:false};
            if(error.message===RATE_LIMIT_MESSAGE)limited=true;
          }
        }
        setRows([...next]);
      }
    }
    if(!cancel.current)fallbacks.filter(id=>keys[id]).forEach(id=>{
      next.forEach((r,i)=>{if(r.status==='error'&&!providerCovers(id,r.symbol))next[i]={...r,error:r.error+' '+PRICE_PROVIDERS[id].name+' não cobre esta bolsa.'};});
      setRows([...next]);
    });
    const ok=next.filter(r=>r.status==='ok').length;
    const note=fallbacks.filter(id=>!keys[id]).map(id=>' Sem chave para '+PRICE_PROVIDERS[id].name+': não usado.').join('');
    setMessage(cancel.current?'Cancelado.':`${ok} de ${next.length} tickers com cotação. Revê e aplica.`+note);
    setRunning(false);
  };
  const toApply=rows.filter(r=>r.status==='ok'&&r.apply);
  const apply=()=>{
    const byTicker=new Map(toApply.filter(r=>!r.ref).map(r=>[r.t,r]));
    const today=new Date().toISOString().slice(0,10);
    setPos(prev=>prev.map(p=>{
      const r=byTicker.get(p.t);
      return r?{...p,cv:Math.round(r.price*10000)/10000,cvAsOf:r.date||today,cvSource:PRICE_PROVIDERS[r.via].name}:p;
    }));
    const sources=[...new Set(toApply.map(r=>PRICE_PROVIDERS[r.via].name))].join(' + ');
    setCfg(c=>{
      const refPrices={...(c?.refPrices||{})};
      toApply.filter(r=>r.ref).forEach(r=>{refPrices[r.t]={cv:Math.round(r.price*10000)/10000,asOf:r.date||today,source:PRICE_PROVIDERS[r.via].name};});
      return{...c,refPrices,priceProvider:provider,priceFallback:fallback,priceFallback2:fallback2,quotesImportedAt:new Date().toISOString(),quotesSource:sources};
    });
    setMessage(`${toApply.length} cotações aplicadas.`);
    setRows(rows.map(r=>r.status==='ok'&&r.apply?{...r,status:'applied',apply:false}:r));
  };
  const fmt=(v,d=2)=>Number.isFinite(v)?v.toFixed(d):'—';
  const cell={padding:'4px 6px',fontSize:12,borderBottom:'1px solid var(--border)',whiteSpace:'nowrap'};
  const short={twelvedata:'TD',alphavantage:'AV',finnhub:'FH'};
  const providerRow=(label,id,onChange,options)=>h('div',{style:{marginBottom:6}},
    h('div',{style:{fontSize:11,color:'var(--muted)',marginBottom:3}},label),
    h('div',{className:'flex gap-1.5'},
      h('select',{className:'ed',style:{flex:1,fontSize:12},value:id,disabled:running,onChange:e=>onChange(e.target.value)},options),
      id&&h('input',{className:'ed',type:'password',autoComplete:'off',placeholder:'Chave API '+PRICE_PROVIDERS[id].name,style:{flex:2,fontSize:12},value:keys[id]||'',disabled:running,
        onChange:e=>setKey(id,e.target.value)})
    ),
    id&&h('div',{style:{fontSize:11,color:'var(--muted)',marginTop:3,lineHeight:1.5}},PRICE_PROVIDERS[id].note+' Chave gratuita em '+PRICE_PROVIDERS[id].site+'.')
  );
  const opts=exclude=>Object.entries(PRICE_PROVIDERS).filter(([id])=>id!==exclude).map(([id,p])=>h('option',{key:id,value:id},p.name));
  return h('div',{className:'input-row'},
    MicroLabel('Cotações online — API',{size:9,mb:8}),
    h('div',{style:{fontSize:12,color:'var(--muted)',marginBottom:8,lineHeight:1.5}},
      'Pede as cotações das posições activas, converte para a moeda de cada posição com as taxas do BCE e mostra tudo antes de aplicar. As chaves ficam guardadas neste browser.'),
    h('label',{style:{display:'flex',gap:6,alignItems:'flex-start',fontSize:12,color:'var(--muted)',marginBottom:8,lineHeight:1.5,cursor:'pointer'}},
      h('input',{type:'checkbox',checked:!!cfg?.exportPriceKeys,onChange:e=>{const checked=e.target.checked;setCfg(c=>({...c,exportPriceKeys:checked}));},style:{marginTop:2}}),
      h('span',null,'Incluir as chaves no income-factory.json ao exportar, para as levar para outro dispositivo. ',
        h('span',{style:{color:cfg?.exportPriceKeys?'var(--gold)':'var(--muted)'}},'Quem tiver o ficheiro fica com as chaves: nunca o ponhas no GitHub nem o partilhes.'))),
    providerRow('Fornecedor principal',provider,changeProvider,opts()),
    providerRow('Se falhar, tentar',fb,changeFallback,[h('option',{key:'',value:''},'Nenhum'),...opts(provider)]),
    providerRow('Por último, tentar',fb2,changeFallback2,[h('option',{key:'',value:''},'Nenhum'),...Object.entries(PRICE_PROVIDERS).filter(([id])=>id!==provider&&id!==fb).map(([id,p])=>h('option',{key:id,value:id},p.name))]),
    h('div',{className:'flex gap-1.5',style:{marginTop:4}},
      running
        ?h('button',{className:'btn-secondary ml-0 flex-1',onClick:()=>{cancel.current=true;}},'Cancelar')
        :h('button',{className:'btn-primary ml-0 flex-1',onClick:run,disabled:!active.length},'Testar cotações ('+active.length+')'),
      h('button',{className:'btn-secondary ml-0 flex-1',onClick:apply,disabled:running||!toApply.length},'Aplicar ('+toApply.length+')')
    ),
    message&&h('div',{style:{fontSize:12,color:'var(--muted)',marginTop:6}},message),
    rows.length>0&&h('div',{style:{overflowX:'auto',marginTop:8}},
      h('table',{style:{width:'100%',borderCollapse:'collapse'}},
        h('thead',null,h('tr',null,['','Ticker','Símbolo','Fornecedor','Novo','Actual','Δ','Estado'].map(x=>h('th',{key:x,style:{...cell,color:'var(--muted)',textAlign:'left',fontWeight:700}},x)))),
        h('tbody',null,rows.map((r,i)=>{
          const p=active.find(x=>x.t===r.t);
          return h('tr',{key:r.t},
            h('td',{style:cell},h('input',{type:'checkbox',checked:!!r.apply,disabled:r.status!=='ok'||running,
              onChange:e=>setRows(rows.map((x,j)=>j===i?{...x,apply:e.target.checked}:x))})),
            h('td',{style:{...cell,fontWeight:700},title:r.ref?'Fora da carteira (secção Investimentos do Património): o preço é guardado em refPrices':''},r.t,r.ref&&h('span',{style:{fontWeight:400,color:'var(--muted)',marginLeft:4}},'(ref.)')),
            h('td',{style:cell},h('input',{className:'ed',style:{width:84,fontSize:12},defaultValue:r.symbol,disabled:running,key:r.t+r.symbol,
              title:'Formato: TICKER ou TICKER.BOLSA ('+Object.keys(PRICE_EXCHANGES).filter(k=>k!=='US').join(', ')+')',
              onBlur:e=>{if(p&&e.target.value.trim().toUpperCase()!==r.symbol){changeSymbol(p,e.target.value);setRows(rows.map((x,j)=>j===i?{...x,symbol:e.target.value.trim().toUpperCase()||defaultPriceSymbol(p),status:'pending',apply:false}:x));}}})),
            h('td',{style:cell},r.raw!=null?fmt(r.raw,r.raw<10?4:2)+' '+r.rawCurrency+' · '+short[r.via]:''),
            h('td',{style:{...cell,color:'var(--gold)'}},r.price!=null?fmt(r.price,r.price<10?4:2)+' '+r.target:''),
            h('td',{style:cell},fmt(r.current,r.current<10?4:2)),
            h('td',{style:{...cell,color:r.warn?'var(--red)':'var(--muted)'}},r.diff!=null?(r.diff*100).toFixed(1)+'%':''),
            h('td',{title:r.status==='error'?r.error:r.date?'Cotação de '+r.date+' ('+PRICE_PROVIDERS[r.via].name+')':'',style:{...cell,whiteSpace:'normal',minWidth:70,color:r.status==='error'||r.warn?'var(--red)':r.status==='ok'||r.status==='applied'?'var(--green)':'var(--muted)'}},
              r.status==='pending'?'—':r.status==='loading'?'…':r.status==='applied'?'Aplicada':
              r.status==='error'?r.error:(r.warn?'⚠ Verifica':'OK')+(r.date?' '+r.date.slice(5):''))
          );
        }))
      ),
      rows.some(r=>r.warn)&&h('div',{style:{fontSize:11,color:'var(--muted)',marginTop:6,lineHeight:1.5}},
        '⚠ Verifica = mais de 25% de diferença para o preço actual. Confirma o símbolo e a moeda antes de marcar. Edita o símbolo (ex.: LGEN.L, NOV.CO) e testa de novo.')
    )
  );
}

function Conf({wealth,cfg,setCfg,pos,setPos,sold,setSold,income,qual,setQual,onReset,exportCSV,importData,exportData,importBrokerQuotes,exportBrokerQuoteTemplate}){
  const[confTab,setConfTab]=useState('config');
  const[fxStatus,setFxStatus]=useState(null);
  const updateFxFromEcb=async()=>{
    setFxStatus({loading:true,text:'A obter taxa do BCE…'});
    try{
      const{date,rates}=await fetchEcbRates();
      const usd=Math.round(rates.USD*10000)/10000;
      const next={fxEurUsd:usd,fxEurUsdAsOf:date};
      // Daily history used by the Tax page: fill everything from the first
      // transaction (or the last stored day) up to today with ECB reference rates.
      const old=cfg?.fxHistory&&typeof cfg.fxHistory.rates==='object'?cfg.fxHistory:null;
      const need=earliestDataDate(pos,sold);
      const known=Object.keys(old?.rates||{}).sort();
      const start=known.length&&known[0]<=need?known[known.length-1]:need;
      setFxStatus({loading:true,text:'A obter histórico do BCE desde '+start+'…'});
      const hist=await fetchEcbHistory(start);
      const merged={...(old?.rates||{}),...hist,[date]:usd};
      const days=Object.keys(merged).sort();
      next.fxHistory={...(old||{}),unit:'USD por 1 EUR',
        source:'BCE · taxas de referência diárias do euro (via Frankfurter)'+(old?.source&&!/BCE/.test(old.source)?' · antes: '+old.source:''),
        asOf:days[days.length-1],rates:merged};
      setCfg(c=>({...c,...next}));
      setFxStatus({text:`Actualizado: ${usd.toFixed(4)} (BCE, ${date}) · histórico ${days[0]} → ${days[days.length-1]} (${Object.keys(hist).length} dias novos)`});
    }catch(error){setFxStatus({error:true,text:error.message});}
  };
  const[benchStatus,setBenchStatus]=useState(null);
  const updateBenchmarks=async()=>{
    const key=readPriceKey('alphavantage');
    if(!key){setBenchStatus({error:true,text:'Falta a chave do Alpha Vantage (Config → Cotações online).'});return;}
    try{
      const startYear=Math.min(2023,...Object.keys(cfg?.benchmarkCache?.sp500?.byYear||{}).map(k=>parseInt(k)).filter(Number.isFinite));
      const next={...(cfg?.benchmarkCache||{})};
      let asOf=null;
      for(let i=0;i<BENCHMARKS.length;i++){
        const b=BENCHMARKS[i];
        if(i>0)await new Promise(r=>setTimeout(r,13000));
        setBenchStatus({loading:true,text:`A obter ${b.label} (${b.symbol})…`});
        const r=yearlyReturns(await fetchMonthlyAdjusted(b.symbol,key),startYear);
        next[b.key]={byYear:r.byYear,source:b.symbol+' · Alpha Vantage, fecho mensal ajustado (dividendos reinvestidos)'};
        asOf=asOf&&asOf<r.asOf?asOf:r.asOf;
      }
      next.asOf=asOf;
      // The loop takes ~13 s per benchmark: apply to the latest config, not the one captured at click time.
      setCfg(c=>({...c,benchmarkCache:next}));
      setBenchStatus({text:'Actualizado com dados até '+asOf+'.'});
    }catch(error){setBenchStatus({error:true,text:error.message});}
