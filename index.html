function AllTransactions({pos,sold,cfg}){
  const fx=cfg?.fxEurUsd||1.08;
  const[sf,setSf]=useState('date');
  const[sd,setSd]=useState('desc');
  const[filter,setFilter]=useState('all');
  const[search,setSearch]=useState('');
  const[yearFlt,setYearFlt]=useState('all');
  const[statusFlt,setStatusFlt]=useState('all');
  const[brokerFlt,setBrokerFlt]=useState('all');
  const[page,setPage]=useState(1);
  const[pageSize,setPageSize]=useState(20);

  const rows=useMemo(()=>{
    const allWithSource=[
      ...(pos||[]).map(p=>({...p,_source:'active'})),
      ...(sold||[]).map(p=>({...p,_source:'closed'})),
    ];
    return allWithSource.flatMap(p=>{
      const txs=p.transactions||[];
      const isUSD=p.cat==='USD';
      const sym=currencySymbol(isUSD);
      // Per-lot status via FIFO, not per-position: a buy lot fully consumed by
      // a later sell is "closed" even if the ticker still has OTHER shares
      // held from a different (more recent) lot. Sells are always "closed" —
      // they're a realized/completed event by definition.
      const fifo=fifoEngine(txs);
      return txs.map(tx=>{
        let status;
        if(tx.type==='sell')status='closed';
        else{
          const lot=fifo.lots.find(l=>l.date===tx.date&&Math.abs(l.n-tx.n)<0.0001);
          const remaining=lot?.remaining??0;
          status=remaining<=0.0001?'closed':(remaining<tx.n-0.0001?'partial':'active');
        }
        return{
          date:tx.date||'',
          type:tx.type||'buy',
          ticker:p.t,
          name:p.name||p.t,
          broker:(typeof tx.broker==='string'&&tx.broker.trim())||'',
          n:tx.n||0,
          price:tx.price||0,
          fee:tx.fee||0,
          total:(tx.n||0)*(tx.price||0),
          sym,isUSD,
          status,
        };
      });
    });
  },[pos,sold]);

  const brokersInRows=useMemo(()=>[...new Set(rows.map(r=>r.broker).filter(Boolean))].sort((a,b)=>a.localeCompare(b)),[rows]);
  const hasNoBroker=useMemo(()=>rows.some(r=>!r.broker),[rows]);
  const years=useMemo(()=>[...new Set(rows.map(r=>r.date?.slice(0,4)).filter(Boolean))].sort((a,b)=>b-a),[rows]);

  const filtered=useMemo(()=>{
    let r=rows;
    if(filter!=='all') r=r.filter(x=>x.type===filter);
    if(yearFlt!=='all') r=r.filter(x=>x.date?.startsWith(yearFlt));
    if(statusFlt!=='all') r=r.filter(x=>x.status===statusFlt);
    if(brokerFlt==='__none') r=r.filter(x=>!x.broker);
    else if(brokerFlt!=='all') r=r.filter(x=>x.broker===brokerFlt);
    if(search.trim()) r=r.filter(x=>x.ticker.toLowerCase().includes(search.toLowerCase())||x.name.toLowerCase().includes(search.toLowerCase())||x.broker.toLowerCase().includes(search.toLowerCase()));
    return [...r].sort((a,b)=>{
      let v=0;
      if(sf==='date') v=a.date.localeCompare(b.date);
      else if(sf==='ticker') v=a.ticker.localeCompare(b.ticker);
      else if(sf==='broker') v=(a.broker||'\uffff').localeCompare(b.broker||'\uffff');
      else if(sf==='n') v=a.n-b.n;
      else if(sf==='price') v=a.price-b.price;
      else if(sf==='total') v=a.total-b.total;
      else if(sf==='fee') v=a.fee-b.fee;
      return sd==='asc'?v:-v;
    });
  },[rows,filter,search,sf,sd,yearFlt,statusFlt,brokerFlt]);

  // Reset to page 1 whenever the result set or page size changes, so we
  // never land on an out-of-range page after filtering/sorting/resizing.
  useEffect(()=>{setPage(1);},[filter,search,sf,sd,yearFlt,statusFlt,brokerFlt,pageSize]);

  const totalPages=Math.max(1,Math.ceil(filtered.length/pageSize));
  const pageSafe=Math.min(page,totalPages);
  const paged=useMemo(()=>filtered.slice((pageSafe-1)*pageSize,pageSafe*pageSize),[filtered,pageSafe,pageSize]);

  const totalBuys=filtered.filter(r=>r.type==='buy').reduce((s,r)=>s+(r.isUSD?r.total/fx:r.total),0);
  const totalSells=filtered.filter(r=>r.type==='sell').reduce((s,r)=>s+(r.isUSD?r.total/fx:r.total),0);

  const thS={padding:'8px 10px',textAlign:'left',fontSize:12,fontWeight:700,letterSpacing:'.06em',textTransform:'uppercase',color:'var(--muted)',borderBottom:'1px solid var(--border)',cursor:'pointer',userSelect:'none',whiteSpace:'nowrap'};
  const thR={...thS,textAlign:'right'};
  const col=(f)=>sf===f?(sd==='asc'?'▲':'▼'):'';
  const sort=(f)=>()=>{if(sf===f)setSd(d=>d==='asc'?'desc':'asc');else{setSf(f);setSd('desc');}};

  return h('div',null,
    h(Shdr,{title:'All Transactions',hint:filtered.length+' registos'}),
    h('div',{style:{display:'flex',gap:10,marginBottom:14,flexWrap:'wrap',alignItems:'center'}},
      h('input',{placeholder:'Pesquisar ticker, nome ou corretora…',value:search,onChange:e=>setSearch(e.target.value),
        style:{flex:1,minWidth:160,background:'var(--s2)',border:'1px solid var(--border)',borderRadius:8,color:'var(--text)',padding:'6px 10px',fontSize:13}}),
      h('select',{value:yearFlt,onChange:e=>setYearFlt(e.target.value),
        style:{background:'var(--s2)',border:'1px solid var(--border)',borderRadius:8,color:'var(--text)',padding:'6px 10px',fontSize:13,cursor:'pointer'}},
        h('option',{value:'all'},'Todos os anos'),
        years.map(y=>h('option',{key:y,value:y},y))
      ),
      h('select',{value:statusFlt,onChange:e=>setStatusFlt(e.target.value),
        style:{background:'var(--s2)',border:'1px solid var(--border)',borderRadius:8,color:'var(--text)',padding:'6px 10px',fontSize:13,cursor:'pointer'}},
        h('option',{value:'all'},'Todos os estados'),
        h('option',{value:'active'},'Activa'),
        h('option',{value:'partial'},'Parcial'),
        h('option',{value:'closed'},'Fechada')
      ),
      h('select',{value:brokerFlt,onChange:e=>setBrokerFlt(e.target.value),
        style:{background:'var(--s2)',border:'1px solid var(--border)',borderRadius:8,color:'var(--text)',padding:'6px 10px',fontSize:13,cursor:'pointer'}},
        h('option',{value:'all'},'Todas as corretoras'),
        brokersInRows.map(b=>h('option',{key:b,value:b},b)),
        hasNoBroker&&h('option',{value:'__none'},'Sem corretora')
      ),
      h('select',{value:pageSize,onChange:e=>setPageSize(Number(e.target.value)),
        style:{background:'var(--s2)',border:'1px solid var(--border)',borderRadius:8,color:'var(--text)',padding:'6px 10px',fontSize:13,cursor:'pointer'}},
        [10,20,50,100].map(n=>h('option',{key:n,value:n},n+' / página'))
      ),
      ['all','buy','sell'].map(f=>h('button',{key:f,onClick:()=>setFilter(f),
        style:{padding:'5px 14px',borderRadius:20,border:'1px solid',fontSize:12,fontWeight:600,cursor:'pointer',
          background:filter===f?'var(--surface)':'transparent',
          borderColor:filter===f?'var(--border)':'transparent',
          color:filter===f?'var(--text)':'var(--muted)'}},
        f==='all'?'Todos':f==='buy'?'🟢 Compras':'🔴 Vendas'))
    ),
    h('div',{className:'card-table overflow-x-auto'},
      h('table',{style:{width:'100%',borderCollapse:'collapse',fontSize:13}},
        h('thead',null,h('tr',null,
          h('th',pressable(sort('date'),{style:thS}),'Data '+col('date')),
          h('th',{style:thS},'Tipo'),
          h('th',pressable(sort('ticker'),{style:thS}),'Ticker '+col('ticker')),
          h('th',pressable(sort('broker'),{style:thS}),'Corretora '+col('broker')),
          h('th',pressable(sort('n'),{style:thR}),'Qtd '+col('n')),
          h('th',pressable(sort('price'),{style:thR}),'Preço '+col('price')),
          h('th',pressable(sort('total'),{style:thR}),'Total '+col('total')),
          h('th',pressable(sort('fee'),{style:thR}),'Fee '+col('fee')),
          h('th',{style:{...thS,textAlign:'center'}},'Estado'),
        )),
        h('tbody',null,
          paged.map((r,i)=>{
            const isBuy=r.type==='buy';
            return h('tr',{key:i,style:{background:i%2===0?'transparent':'rgba(255,255,255,.02)',borderBottom:'1px solid var(--border)'}},
              h('td',{style:{padding:'7px 10px',fontFamily:'var(--mono)',color:'var(--muted)',fontSize:12}},r.date),
              h('td',{style:{padding:'7px 10px'}},
                h('span',{style:{padding:'2px 8px',borderRadius:10,fontSize:12,fontWeight:700,
                  background:isBuy?'rgba(16,185,129,.15)':'rgba(239,68,68,.15)',
                  color:isBuy?'var(--green)':'var(--red)'}},isBuy?'COMPRA':'VENDA')
              ),
              h('td',{style:{padding:'7px 10px',fontWeight:700,color:'var(--text)'}},h(TickerLink,{t:r.ticker})),
              h('td',{style:{padding:'7px 10px',whiteSpace:'nowrap'}},
                r.broker
                  ?h('span',{style:{display:'inline-flex',alignItems:'center',gap:6,fontSize:12,color:'var(--text)'}},
                      h('span',{style:{width:8,height:8,borderRadius:'50%',flexShrink:0,background:BROKER_COL[r.broker.toLowerCase()]||'var(--muted)'}}),r.broker)
                  :h('span',{style:{color:'var(--muted)'},title:'Sem corretora atribuída'},'—')),
              h('td',{style:{padding:'7px 10px',textAlign:'right',fontFamily:'var(--mono)',color:'var(--text)'}},r.n.toFixed(r.n%1===0?0:4)),
              h('td',{style:{padding:'7px 10px',textAlign:'right',fontFamily:'var(--mono)',color:'var(--muted)'}},r.sym+r.price.toFixed(2)),
              h('td',{style:{padding:'7px 10px',textAlign:'right',fontFamily:'var(--mono)',fontWeight:700,color:isBuy?'var(--red)':'var(--green)'}},
                (isBuy?'-':'+')+r.sym+r.total.toFixed(2)),
              h('td',{style:{padding:'7px 10px',textAlign:'right',fontFamily:'var(--mono)',color:'var(--muted)',fontSize:12}},
                r.fee>0?r.sym+r.fee.toFixed(2):'—'),
              h('td',{style:{padding:'7px 10px',textAlign:'center',fontSize:12,
                color:r.status==='active'?'var(--green)':r.status==='partial'?'var(--tier-warn)':'var(--muted)',
                fontWeight:r.status==='closed'?400:600}},
                r.status==='active'?'Activa':r.status==='partial'?'Parcial':'Fechada'),
            );
          })
        )
      )
    ),
    h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,marginTop:12,flexWrap:'wrap'}},
      h('div',{style:{fontSize:12,color:'var(--muted)'}},
        filtered.length>0
          ?`A mostrar ${(pageSafe-1)*pageSize+1}–${Math.min(pageSafe*pageSize,filtered.length)} de ${filtered.length}`
          :'Sem registos'
      ),
      h('div',{style:{display:'flex',alignItems:'center',gap:8}},
        h('button',{onClick:()=>setPage(p=>Math.max(1,p-1)),disabled:pageSafe<=1,
          style:{padding:'5px 12px',borderRadius:8,border:'1px solid var(--border)',fontSize:12,fontWeight:600,
            background:'var(--s2)',color:pageSafe<=1?'var(--muted)':'var(--text)',
            cursor:pageSafe<=1?'default':'pointer',opacity:pageSafe<=1?.5:1}},'‹ Anterior'),
        h('span',{style:{fontSize:12,color:'var(--muted)',minWidth:80,textAlign:'center'}},

          style:{padding:'5px 12px',borderRadius:8,border:'1px solid var(--border)',fontSize:12,fontWeight:600,
            background:'var(--s2)',color:pageSafe>=totalPages?'var(--muted)':'var(--text)',
            cursor:pageSafe>=totalPages?'default':'pointer',opacity:pageSafe>=totalPages?.5:1}},'Seguinte ›'),
      )
    ),
    h('div',{style:{display:'flex',gap:20,marginTop:12,paddingTop:10,borderTop:'1px solid var(--border)',flexWrap:'wrap'}},
      h('div',{style:{fontSize:12,color:'var(--muted)'}},
        '🟢 Total comprado: ',h('span',{style:{color:'var(--text)',fontFamily:'var(--mono)',fontWeight:700}},'€'+totalBuys.toFixed(2))),
      h('div',{style:{fontSize:12,color:'var(--muted)'}},

    )
  );
}
function TransactionsPage({cfg,pos,setPos,sold,setSold,income,qual,setQual}){

    txTab==='alltx'&&h(AllTransactions,{pos,sold,cfg}),

}
function SoldTxEdit({sold,setSold,cfg}){
  const[flt,setFlt]=useState('TODAS');
  const[yrFlt,setYrFlt]=useState('TODOS');
  const[sf,setSf]=useState('exit');
  const[sd,setSd]=useState('desc');
  const sts=f=>{if(sf===f)setSd(d=>d==='asc'?'desc':'asc');else{setSf(f);setSd('asc');}};
  const arr=sd==='asc'?'↑':'↓';

  // setSold adapter — TxAccordion calls setPos(prev=>...) updating by id/t
  // We need to bridge that to setSold
  const setSoldPos=useCallback(updater=>{
    setSold(prev=>updater(prev));
  },[setSold]);

  const SOLD=sold||[];
  const getExitYear=p=>{
    const d=p.exit||(p.transactions||[]).filter(t=>t.type==='sell').map(t=>t.date).sort().reverse()[0]||'';
    return d?d.slice(0,4):null;
  };
  const exitYears=useMemo(()=>{
    const ys=new Set();
    SOLD.forEach(p=>{const y=getExitYear(p);if(y)ys.add(y);});
    return[...ys].sort((a,b)=>b.localeCompare(a));
  },[SOLD]);

  const filtered=useMemo(()=>SOLD.filter(p=>{
    if(flt==='Acções'&&p.cat==='ETF')return false;
    if(flt==='USD'&&p.cat!=='USD')return false;
    if(flt==='EUR'&&p.cat!=='EUR')return false;
    if(flt==='ETFs'&&p.cat!=='ETF')return false;
    if(yrFlt!=='TODOS'&&getExitYear(p)!==yrFlt)return false;
    return true;
  }),[SOLD,flt,yrFlt]);
  const sorted=useMemo(()=>[...filtered].sort((a,b)=>{
    if(sf==='name'){const va=a.name||a.t,vb=b.name||b.t;return sd==='asc'?va.localeCompare(vb):vb.localeCompare(va);}
    if(sf==='exit'){
      const getExit=p=>p.exit||(p.transactions||[]).filter(t=>t.type==='sell').map(t=>t.date).sort().reverse()[0]||'';
      const va=getExit(a),vb=getExit(b);
      return sd==='asc'?va.localeCompare(vb):vb.localeCompare(va);
    }
    return 0;
  }),[filtered,sf,sd]);

  return h('div',null,
    h(Shdr,{title:'Vendidas — Transacções'}),
    h('div',{style:{display:'flex',gap:6,marginBottom:12,flexWrap:'wrap',alignItems:'center'}},
      ['TODAS','USD','EUR','ETFs'].map(f=>h('button',{key:f,
        className:'fb'+(flt===f?' on':''),
        onClick:()=>setFlt(f),
      },flt===f?f+' ('+sorted.length+')':f)),
      h('div',{style:{width:1,height:20,background:'var(--border)',margin:'0 4px'}}),
      h('button',{
        className:'fb'+(yrFlt==='TODOS'?' on':''),
        onClick:()=>setYrFlt('TODOS'),
      },'TODOS OS ANOS'),
      exitYears.map(y=>h('button',{key:y,
        className:'fb'+(yrFlt===y?' on':''),
        onClick:()=>setYrFlt(y),
      },y))
    ),
    h('div',{className:'card-table overflow-x-auto'},
      h('table',{style:{width:'100%',borderCollapse:'collapse'}},
        h('thead',null,h('tr',null,
          h('th',{style:{width:28}}),
          h('th',{style:{width:36,textAlign:'center'}},'País'),
          h('th',{style:{textAlign:'left',cursor:'pointer',userSelect:'none'},onClick:()=>sts('name')},'Empresa'+(sf==='name'?' '+arr:'')),
          h('th',{className:'text-right'},'Qtd'),
          h('th',{className:'text-right'},'P.Médio'),
          h('th',{style:{textAlign:'right',cursor:'pointer',userSelect:'none'},onClick:()=>sts('exit')},'Data Saída'+(sf==='exit'?' '+arr:'')),
          h('th',{className:'text-center'},'Tx'),
        )),
        h('tbody',null,sorted.map(p=>h(TxAccordion,{key:p.id||p.t,p,setPos:setSoldPos,cfg,isSold:true})))
      )
    ),
    h('div',{style:{marginTop:8,fontSize:12,color:'var(--muted)',textAlign:'right'}},
      sorted.length+' posições vendidas'
    )
  );
}

function TxAccordion({p,setPos,cfg,isSold}){
  const[open,setOpen]=useState(false);
  const[draftTx,setDraftTx]=useState(null);
  const[txError,setTxError]=useState('');
  const sym=currencySymbol(p.cat);
  const pid=p.id||p.t;
  const transactions=p.transactions||[];
  const brokerList=brokerListOf(cfg);
  const hasTx=transactions.length>0;
  const{sells,n,av}=useMemo(()=>fifoEngine(transactions),[p.transactions]);
  const txsSorted=useMemo(()=>transactions.map((tx,index)=>({tx,index}))
    .sort((a,b)=>a.tx.date.localeCompare(b.tx.date)||a.index-b.index)
    .map(({tx,index})=>({...tx,origIdx:index})),[p.transactions]);
  const{totalBought,avgBuy,lastSellDate}=useMemo(()=>{
    const txs=p.transactions||[];
    let tb=0,tc=0,lastSell='';
    txs.forEach(tx=>{
      if(tx.type==='buy'){tb+=tx.n;tc+=tx.n*tx.price+(tx.fee||0);}
      else if(tx.type==='sell'&&tx.date>lastSell)lastSell=tx.date;
    });
    return{totalBought:tb,avgBuy:tb>0?tc/tb:0,lastSellDate:lastSell};
  },[p.transactions]);
  const displayRows=useMemo(()=>{
    if(!hasTx)return[];
    let runShares=0,runCost=0;
    const sellQueue=[...sells];let si=0;
    return txsSorted.map(tx=>{
      if(tx.type==='buy'){
        runCost+=tx.n*tx.price+(tx.fee||0);runShares+=tx.n;
        const runAv=runShares>0?runCost/runShares:0;
        return{...tx,runAv,runShares,fifo:null};
      } else {
        const fifo=sellQueue[si++]||null;
        if(fifo){runCost-=fifo.costBasis;runShares=Math.max(0,runShares-tx.n);}
        const runAv=runShares>0?runCost/runShares:0;
        return{...tx,runAv,runShares,fifo};
      }
    }).slice().reverse();
  },[txsSorted,sells,hasTx]);
  const setAllBrokers=broker=>{
    if(!broker||!transactions.length)return;
    const changing=transactions.filter(tx=>tx.broker&&tx.broker!==broker).length;
    if(changing>0&&!window.confirm(changing+' transacç'+(changing===1?'ão já tem':'ões já têm')+' outra corretora. Substituir tudo por '+broker+'?'))return;
    const txs=transactions.map(tx=>({...tx,broker}));
    const error=validateTransactionHistory(txs);
    if(error){setTxError(error);return;}
    setTxError('');
    setPos(prev=>prev.map(x=>(x.id||x.t)===pid?{...x,transactions:txs}:x));
  };
  const addTx=()=>{setTxError('');setDraftTx({date:new Date().toISOString().slice(0,10),type:'buy',n:'',price:'',fee:'0',broker:''});};
  const commitTxEdit=(idx,field,value,input)=>{
    let parsed=value;
    if(['n','price','fee'].includes(field)){
      try{parsed=parseMarketNumber(value,field);}
      catch(error){setTxError(error.message);input.value=String(transactions[idx]?.[field]??0);return;}
    }
    const txs=[...transactions];txs[idx]={...txs[idx],[field]:parsed};
    if(field==='broker'&&!parsed)delete txs[idx].broker;
    const error=validateTransactionHistory(txs);
    if(error){setTxError(error);input.value=String(transactions[idx]?.[field]??'');return;}
    setTxError('');
    setPos(prev=>prev.map(x=>(x.id||x.t)===pid?{...x,transactions:txs}:x));
  };
  const saveDraftTx=()=>{
    try{
      const candidate={date:draftTx.date,type:draftTx.type,n:parseMarketNumber(draftTx.n,'Quantidade'),
        price:parseMarketNumber(draftTx.price,'Preço'),fee:parseMarketNumber(draftTx.fee||'0','Comissão'),
        ...(draftTx.broker?{broker:draftTx.broker}:{})};
      const error=validateTransactionHistory([...transactions,candidate]);
      if(error){setTxError(error);return;}
      setPos(prev=>prev.map(x=>(x.id||x.t)===pid?{...x,transactions:[...(x.transactions||[]),candidate]}:x));
      setDraftTx(null);setTxError('');
    }catch(error){setTxError(error.message);}
  };
  const delTx=idx=>{
    if(!window.confirm('Apagar esta transacção?'))return;
    const txs=[...transactions];txs.splice(idx,1);
    const error=validateTransactionHistory(txs);
    if(error){setTxError(error);return;}
    setPos(prev=>prev.map(x=>(x.id||x.t)===pid?{...x,transactions:txs}:x));setTxError('');
  };
  const countryOpts=Object.entries(cfg?.whtByCountry||{}).map(([flag,info])=>({flag,name:info?.name||flag}));
  const countrySelect=h('select',{
    value:p.country||(cfg?.posCountry||{})[p.t]||'',
    style:{background:'var(--s2)',color:'var(--text)',border:'1px solid var(--border)',borderRadius:4,fontSize:12,padding:'2px 4px',cursor:'pointer',maxWidth:80},
    onClick:e=>e.stopPropagation(),
    onChange:e=>{const v=e.target.value;setPos(prev=>prev.map(x=>(x.id||x.t)===pid?{...x,country:v||undefined}:x));},
  },
    h('option',{value:''},'🌐'),
    countryOpts.map(o=>h('option',{key:o.flag,value:o.flag},o.flag+' '+o.name))
  );
  // The ONE cell that differs between the Activas and Vendidas tabs — sold
  // positions show a read-only exit date here, active ones an editable
  // P.Actual (cv) input. Defined once and called from both rows below,
  // instead of writing the same isSold ternary out twice (which is exactly
  // what caused the earlier regression: one copy got fixed, the other didn't).
  const priceOrExitCell=(exitDateFallback)=>h('td',{
    style:isSold?{textAlign:'right',fontFamily:'var(--mono)',fontSize:12,color:'var(--muted)'}:{padding:'10px 8px',textAlign:'right'},
    onClick:isSold?undefined:e=>e.stopPropagation(),
  },
    isSold?(p.exit||exitDateFallback||'—'):
    h('input',{className:'ed',style:{width:76,textAlign:'right'},defaultValue:p.cv,key:'cv_'+pid,
      title:priceFreshness(p).title,
      onBlur:e=>{const v=parseFloat(e.target.value);if(!isNaN(v)&&v!==p.cv)setPos(prev=>prev.map(x=>(x.id||x.t)===pid?{...x,cv:v,cvAsOf:new Date().toISOString().slice(0,10),cvSource:'manual'}:x));},
      onKeyDown:e=>e.key==='Enter'&&e.target.blur()}),
    !isSold&&h(StaleDot,{p})
  );
  const noTxRow=h('tr',null,
    h('td',{style:{padding:'10px 10px',color:'var(--muted)',width:28}},'—'),
    h('td',{style:{textAlign:'center',padding:'4px 4px'}},countrySelect),
    h('td',null,
      h(TickerLink,{t:p.t,style:{fontWeight:600,fontSize:13,textUnderlineOffset:2}},p.name||p.t),
      h('div',{style:{fontSize:11,color:'var(--muted)',marginTop:1}},p.cat)
    ),
    h('td',{style:{textAlign:'right',fontFamily:'var(--mono)'}},fn(p.n,4)),
    h('td',{style:{textAlign:'right',fontFamily:'var(--mono)',color:'var(--muted)'}},sym+fn(getAv(p))),
    priceOrExitCell(),
    h('td',{style:{textAlign:'center',fontSize:12,color:'var(--muted)',fontStyle:'italic'}},'sem tx'),
  );
  if(!hasTx)return h(React.Fragment,null,noTxRow,
    h('tr',null,h('td',{colSpan:7,style:{padding:'4px 8px 10px'}},
      txError&&h('div',{role:'alert',style:{color:'var(--red)',fontSize:12,marginBottom:6}},txError),
      draftTx&&h('div',{style:{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap',marginBottom:6}},
        h('input',{className:'ed',type:'date',value:draftTx.date,onChange:e=>setDraftTx({...draftTx,date:e.target.value}),style:{width:130}}),
        h('select',{value:draftTx.type,onChange:e=>setDraftTx({...draftTx,type:e.target.value}),style:{background:'var(--s2)',color:'var(--text)',padding:4}},
          h('option',{value:'buy'},'BUY'),h('option',{value:'sell'},'SELL')),
        h('input',{className:'ed',type:'number',min:'0.000001',step:'any',placeholder:'Qtd',value:draftTx.n,onChange:e=>setDraftTx({...draftTx,n:e.target.value}),style:{width:76}}),
        h('input',{className:'ed',type:'number',min:'0',step:'any',placeholder:'Preço',value:draftTx.price,onChange:e=>setDraftTx({...draftTx,price:e.target.value}),style:{width:88}}),
        h('input',{className:'ed',type:'number',min:'0',step:'any',placeholder:'Fee',value:draftTx.fee,onChange:e=>setDraftTx({...draftTx,fee:e.target.value}),style:{width:76}}),
        h(BrokerSelect,{value:draftTx.broker||'',list:brokerList,onChange:v=>setDraftTx({...draftTx,broker:v})}),
        h('button',{className:'btn-primary',onClick:saveDraftTx},'Adicionar'),
        h('button',{className:'btn-secondary',onClick:()=>setDraftTx(null)},'Cancelar')
      ),
      h('button',{className:'btn-quaternary',onClick:addTx},'＋ Adicionar Transacção')
    ))
  );
  return h(React.Fragment,null,
    h('tr',{style:{borderBottom:open?'none':'1px solid var(--s2)',cursor:'pointer'},onClick:()=>setOpen(o=>!o)},
      h('td',{style:{padding:'10px 10px',userSelect:'none',color:'var(--muted)',width:28}},open?'▼':'▶'),
      h('td',{style:{textAlign:'center',padding:'4px 4px'}},countrySelect),
      h('td',null,
        h(TickerLink,{t:p.t,style:{fontWeight:600,fontSize:13,textUnderlineOffset:2}},p.name||p.t),
        h('div',{style:{fontSize:11,color:'var(--muted)',marginTop:1}},p.cat)
      ),
      h('td',{style:{textAlign:'right',fontFamily:'var(--mono)'}},fn(n===0&&totalBought>0?totalBought:n,4)),
      h('td',{style:{textAlign:'right',fontFamily:'var(--mono)',color:'var(--muted)'}},sym+fn(n===0&&avgBuy>0?avgBuy:av)),
      priceOrExitCell(lastSellDate),
      h('td',{style:{textAlign:'center',fontSize:12,color:'var(--muted)'}},
        h('span',{style:{padding:'2px 8px',borderRadius:10,background:'var(--s2)',border:'1px solid var(--border)'}},(p.transactions||[]).length+' tx')
      ),
    ),
    open&&h('tr',{className:'border-b border-[var(--border)]'},
      h('td',{colSpan:7,style:{padding:0}},
        h('div',{style:{background:'#0c1524',padding:16,overflowX:'auto'}},
          h('table',{style:{width:'100%',borderCollapse:'collapse',fontSize:13,marginBottom:12}},
            h('thead',null,h('tr',null,
              ['Data','Tipo','Corretora','Qtd','Preço','Fee','Valor','Cost Basis (FIFO)','P&L Realizado','Qtd Rest.','P.Médio Após','Apagar'].map(c=>
                h('th',{key:c,style:{padding:'6px 8px',textAlign:['Data','Tipo','Corretora','Apagar'].includes(c)?'left':'right',
                  fontSize:11,color:'var(--muted)',fontWeight:700,textTransform:'uppercase',borderBottom:'1px solid var(--border)'}},c)
              )
            )),
            h('tbody',null,displayRows.map((tx,i)=>{
              const isBuy=tx.type==='buy';
              return               h('tr',{key:tx.origIdx,style:{background:isBuy?'#0d1f0d':'#1f0d0d',borderBottom:'1px solid var(--s2)'}},
                h('td',{style:{padding:'6px 8px'}},h('input',{className:'ed',style:{width:100,color:'var(--text)'},
                type:'date',defaultValue:tx.date,onBlur:e=>commitTxEdit(tx.origIdx,'date',e.target.value,e.target),onKeyDown:e=>e.key==='Enter'&&e.target.blur()})),
                h('td',{style:{padding:'6px 8px'}},h('select',{
                  style:{background:'var(--s2)',color:isBuy?'var(--green)':'var(--red)',border:'1px solid var(--border)',
                    borderRadius:6,fontSize:13,padding:'2px 6px',fontWeight:700,fontFamily:'var(--mono)'},
                value:tx.type,onChange:e=>commitTxEdit(tx.origIdx,'type',e.target.value,e.target)},
                  h('option',{value:'buy'},'BUY'),h('option',{value:'sell'},'SELL'))),
                h('td',{style:{padding:'6px 8px'}},h(BrokerSelect,{value:tx.broker||'',list:brokerList,onChange:v=>commitTxEdit(tx.origIdx,'broker',v,{value:v})})),
                h('td',{style:{padding:'6px 8px',textAlign:'right'}},h('input',{className:'ed',style:{width:60,textAlign:'right'},
                type:'number',min:'0.000001',step:'any',defaultValue:tx.n,onBlur:e=>commitTxEdit(tx.origIdx,'n',e.target.value,e.target),
                  onKeyDown:e=>e.key==='Enter'&&e.target.blur()})),
                h('td',{style:{padding:'6px 8px',textAlign:'right'}},h('input',{className:'ed',style:{width:72,textAlign:'right'},
                type:'number',min:'0',step:'any',defaultValue:tx.price,onBlur:e=>commitTxEdit(tx.origIdx,'price',e.target.value,e.target),
                  onKeyDown:e=>e.key==='Enter'&&e.target.blur()})),
                h('td',{style:{padding:'6px 8px',textAlign:'right'}},h('input',{className:'ed',style:{width:56,textAlign:'right'},
                type:'number',min:'0',step:'any',defaultValue:tx.fee||0,onBlur:e=>commitTxEdit(tx.origIdx,'fee',e.target.value,e.target),
                  onKeyDown:e=>e.key==='Enter'&&e.target.blur()})),
                h('td',{style:{padding:'6px 8px',textAlign:'right',fontFamily:'var(--mono)',color:isBuy?'var(--muted)':'var(--text)'}},sym+fn(tx.n*tx.price)),
                h('td',{style:{padding:'6px 8px',textAlign:'right',fontFamily:'var(--mono)',color:'var(--muted)'}},!isBuy&&tx.fifo?sym+fn(tx.fifo.costBasis):'—'),
                h('td',{style:{padding:'6px 8px',textAlign:'right',fontWeight:700,
                  color:!isBuy&&tx.fifo?(tx.fifo.realPL>=0?'var(--green)':'var(--red)'):'var(--muted)'}},
                  !isBuy&&tx.fifo?(tx.fifo.realPL>=0?'+':'')+sym+fn(Math.abs(tx.fifo.realPL)):'—'),
                h('td',{style:{padding:'6px 8px',textAlign:'right',fontFamily:'var(--mono)',fontSize:12,color:'var(--muted)'}},fn(tx.runShares,4)),
                h('td',{style:{padding:'6px 8px',textAlign:'right',fontFamily:'var(--mono)',fontSize:12,color:'var(--muted)'}},tx.runShares>0?sym+fn(tx.runAv):'—'),
                h('td',{style:{padding:'6px 8px',textAlign:'center'}},
                  h('button',{style:{background:'none',border:'none',color:'var(--red)',cursor:'pointer',fontSize:13,padding:'0 4px'},onClick:()=>delTx(tx.origIdx)},'\u00d7'))
              );
            }))
          ),
          txError&&h('div',{role:'alert',style:{color:'var(--red)',fontSize:12,marginBottom:8}},txError),
          draftTx&&h('div',{style:{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap',padding:'8px 0',marginBottom:8,borderBottom:'1px solid var(--border)'}},
            h('input',{className:'ed',type:'date',value:draftTx.date,onChange:e=>setDraftTx({...draftTx,date:e.target.value}),style:{width:130}}),
            h('select',{value:draftTx.type,onChange:e=>setDraftTx({...draftTx,type:e.target.value}),style:{background:'var(--s2)',color:'var(--text)',padding:4}},
              h('option',{value:'buy'},'BUY'),h('option',{value:'sell'},'SELL')),
            h('input',{className:'ed',type:'number',min:'0.000001',step:'any',placeholder:'Qtd',value:draftTx.n,onChange:e=>setDraftTx({...draftTx,n:e.target.value}),style:{width:76}}),
            h('input',{className:'ed',type:'number',min:'0',step:'any',placeholder:'Preço',value:draftTx.price,onChange:e=>setDraftTx({...draftTx,price:e.target.value}),style:{width:88}}),
            h('input',{className:'ed',type:'number',min:'0',step:'any',placeholder:'Fee',value:draftTx.fee,onChange:e=>setDraftTx({...draftTx,fee:e.target.value}),style:{width:76}}),
            h(BrokerSelect,{value:draftTx.broker||'',list:brokerList,onChange:v=>setDraftTx({...draftTx,broker:v})}),
        h('button',{className:'btn-primary',onClick:saveDraftTx},'Adicionar'),
            h('button',{className:'btn-secondary',onClick:()=>setDraftTx(null)},'Cancelar')
          ),
          h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:8}},
            h('div',{style:{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}},
              h('button',{className:'btn-quaternary',onClick:addTx},'＋ Adicionar Transacção'),
              h('select',{value:'',title:'Atribuir a mesma corretora a todas as transacções desta posição',
                style:{background:'var(--s2)',color:'var(--muted)',border:'1px solid var(--border)',borderRadius:6,fontSize:12,padding:'4px 6px',maxWidth:190},
                onChange:e=>setAllBrokers(e.target.value)},
                h('option',{value:''},'Corretora para todas…'),
                brokerList.map(b=>h('option',{key:b,value:b},b)))
            ),
            h('div',{style:{display:'flex',gap:16,fontSize:13,color:'var(--muted)'}},
              h('span',null,h('span',{className:'font-semibold text-[var(--text)]'},'Posição: '),
                h('span',{style:{color:'var(--green)',fontFamily:'var(--mono)',fontWeight:700}},fn(n,4),' @ ',sym+fn(av))),
              sells.length>0&&h('span',null,h('span',{className:'font-semibold text-[var(--text)]'},'Realizado: '),
                h('span',{style:{color:sells.reduce((s,x)=>s+x.realPL,0)>=0?'var(--green)':'var(--red)',fontFamily:'var(--mono)',fontWeight:700}},
                  (sells.reduce((s,x)=>s+x.realPL,0)>=0?'+':'')+sym+fn(Math.abs(sells.reduce((s,x)=>s+x.realPL,0)))))
            )
          )
        )
      )
    )
  );
}

function HoldingsEdit({pos,setPos,cfg,qual}){
  const[hsf,setHsf]=useState('name');
  const[hsd,setHsd]=useState('asc');
  const[hFlt,setHFlt]=useState('TODAS');
  const hts=f=>{if(hsf===f)setHsd(d=>d==='asc'?'desc':'asc');else{setHsf(f);setHsd('asc');}};
  const harr=hsd==='asc'?'↑':'↓';
  const posFiltered=useMemo(()=>pos.filter(p=>{
    if(hFlt==='TODAS')return true;
    if(hFlt==='Acções')return p.cat!=='ETF';
    if(hFlt==='ETFs')return p.cat==='ETF';
    if(hFlt==='EUR')return p.cat==='EUR';
    if(hFlt==='USD')return p.cat==='USD';
    return true;
  }),[pos,hFlt]);
  const posSorted=useMemo(()=>[...posFiltered].sort((a,b)=>{
    let va,vb;
    if(hsf==='name'){va=a.name||a.t;vb=b.name||b.t;return hsd==='asc'?va.localeCompare(vb):vb.localeCompare(va);}
    if(hsf==='cat'){va=a.cat;vb=b.cat;return hsd==='asc'?va.localeCompare(vb):vb.localeCompare(va);}
    if(hsf==='n'){va=a.n;vb=b.n;}if(hsf==='cv'){va=a.cv;vb=b.cv;}
    return hsd==='asc'?(va||0)-(vb||0):(vb||0)-(va||0);
  }),[posFiltered,hsf,hsd]);
  return h('div',null,
    h(Shdr,{title:'Holdings — Transacções',hint:'Clica em ▶ para expandir · P.Actual (cv) editável · FIFO automático'}),
    h('div',{style:{display:'flex',gap:6,marginBottom:12,flexWrap:'wrap'}},
      ['TODAS','Acções','ETFs','EUR','USD'].map(f=>h('button',{key:f,
        className:'fb'+(hFlt===f?' on':''),
        onClick:()=>setHFlt(f),
      },hFlt===f?f+' ('+posSorted.length+')':f))
    ),
    h('div',{className:'card-table overflow-x-auto'},
      h('table',{style:{width:'100%',borderCollapse:'collapse'}},
        h('thead',null,h('tr',null,
          h('th',{style:{width:28}}),
          h('th',{style:{width:36,textAlign:'center'}},'País'),
          h('th',{style:{textAlign:'left',cursor:'pointer',userSelect:'none'},onClick:()=>hts('name')},'Empresa'+(hsf==='name'?' '+harr:'')),
          h('th',{style:{textAlign:'right',cursor:'pointer',userSelect:'none'},onClick:()=>hts('n')},'Qtd FIFO'+(hsf==='n'?' '+harr:'')),
          h('th',{className:'text-right'},'P.Médio FIFO'),
          h('th',{style:{textAlign:'right',cursor:'pointer',userSelect:'none'},onClick:()=>hts('cv')},'P.Actual'+(hsf==='cv'?' '+harr:'')),
          h('th',{className:'text-center'},'Tx'),
        )),
        h('tbody',null,posSorted.map(p=>h(TxAccordion,{key:p.id||p.t,p,setPos,cfg})))
      )
    ),
    h('div',{style:{marginTop:8,fontSize:12,color:'var(--muted)',textAlign:'right'}},
      'Qtd e P.Médio calculados via FIFO · País editável via dropdown · Edita P.Actual (cv) ou as transacções no accordion'
    )
  );
}

// ── Shared BarChart (used in Income + DividendosPage) ───────────────────────
const BarChart=memo(function BarChart({tots,color,label,sm,estTotal,growth}){
  const CHART_YEARS=YEARS.filter(y=>y>=2023);
  const est=estTotal||0;
  // Next-year projection: this year's full estimate grown by cfg.divGrowth
  // (same formula as "Est. next year" in the income table).
  const nextEst=est>0&&growth>0?est*growth:0;
  const maxV=Math.max(...CHART_YEARS.map(y=>tots[y]||0),est,nextEst,1);
  const hatch=c=>'repeating-linear-gradient(45deg,'+c+' 0,'+c+' 3px,transparent 3px,transparent 6px)';
  return h('div',{className:'flex-1'},
    h('div',{style:{fontSize:12,fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',color:'var(--muted)',marginBottom:10}},label),
    h('div',{style:{display:'flex',gap:6,alignItems:'flex-end',height:176}},
      nextEst>0&&h('div',{key:'next',title:'Previsão: estimativa de '+CUR_YEAR+' × (1 + crescimento do dividendo de '+((growth-1)*100).toFixed(1)+'%, em Config)',
        style:{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:5}},
        h('div',{style:{fontSize:11,fontWeight:700,color:'var(--green)'}},'+'+((growth-1)*100).toFixed(0)+'%'),
        h('div',{style:{fontSize:11,color:'var(--muted)'}},'est. '+sm+fn(nextEst,0)),
        h('div',{style:{width:'100%',height:Math.max(nextEst/maxV*100*0.92,2)+'px',borderRadius:'3px 3px 0 0',
          background:hatch(color),border:'1px dashed '+color,opacity:.6}}),
        h('div',{style:{fontSize:11,color:'var(--muted)'}},(CUR_YEAR+1)+' (prev.)')
      ),
      CHART_YEARS.map((y,i)=>{
        const val=tots[y]||0;
        const prev=i<CHART_YEARS.length-1?tots[CHART_YEARS[i+1]]||0:null;
        const chg=prev!=null&&prev>0?(val-prev)/prev:null;
        const pct=val/maxV*100;
        const isLast=y===CUR_YEAR;
        // Projected remainder for the current year: how much more we expect to
        // receive by year-end, on top of what's already been received (est - val)
        const remaining=isLast?Math.max(0,est-val):0;
        const remPct=remaining/maxV*100;
        return h('div',{key:y,style:{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:5}},
          chg!=null
            ?h('div',{style:{fontSize:11,fontWeight:700,color:chg>=0?'var(--green)':'var(--red)'}},
                (chg>=0?'+':'')+(chg*100).toFixed(0)+'%')
            :h('div',{style:{height:14}}),
          isLast&&remaining>0
            ?h('div',{style:{fontSize:11,color:'var(--muted)'}},sm+fn(val,0)+' · est. '+sm+fn(est,0))
            :(val>0&&h('div',{style:{fontSize:11,color:isLast?'var(--gold)':'var(--muted)'}},sm+fn(val,0))),
          h('div',{style:{width:'100%',display:'flex',flexDirection:'column',borderRadius:'3px 3px 0 0',overflow:'hidden'}},
            isLast&&remaining>0&&h('div',{style:{width:'100%',height:Math.max(remPct*0.92,2)+'px',
              background:hatch(isLast?'var(--gold)':color),
              opacity:.35}}),
            h('div',{style:{width:'100%',height:Math.max(pct*0.92,val>0?2:0)+'px',background:isLast?'var(--gold)':color,opacity:.85}})
          ),
          h('div',{style:{fontSize:11,color:isLast?'var(--gold)':'var(--muted)'}},y)
        );
      })
    )
  );
});

// Editable dividend-growth-rate input cell (Quality Score table, Income page).
// Hoisted to top level — was previously defined inside Income's render body and
// used as a JSX component, forcing a full unmount/remount (and losing focus
// mid-edit) on every re-render of the parent.
function DgIn({q,field,updQ}){
  const DIVGR_THR=[0,.03,.05,.08];
  const v=q[field];const{bg,fg}=gc(v,DIVGR_THR);
  return h('td',null,h('input',{className:'ed',
    style:{width:64,background:v!=null?bg:undefined,color:v!=null?fg:undefined,borderColor:v!=null?fg+'44':undefined},
    defaultValue:v!=null?(v*100).toFixed(2):'',placeholder:'—',
    onBlur:e=>updQ(q.t,field,e.target.value===''?null:parseFloat(e.target.value)/100),
    onKeyDown:e=>e.key==='Enter'&&e.target.blur(),
  }));
}
// Renders one currency-group section (USD/EUR+ETF) of the "Rendimento por Ano" table.
// Hoisted to top level for the same reason as DgIn above.
function TableSection({grp,tots,sm,label,headerBg,qualMap:qm,displayYears,income,upd,rowTotal}){
  const sorted=grp; // pre-sorted by caller via useMemo
  const labelColor=sm==='$'?'var(--blue)':'var(--green)';
  return h('tbody',null,
    h('tr',{style:{background:headerBg}},
      h('td',{colSpan:displayYears.length+3,style:{padding:'8px 12px',fontSize:12,fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',color:labelColor}},'[ '+label+' ]')
    ),
    ...sorted.map(p=>{
      const rt=rowTotal(p.t);
      return h('tr',{key:p.t},
        h('td',null,
          h(TickerLink,{t:p.t,className:'font-semibold'})
        ),
        (()=>{
          const q=getQual(qm,p.t);
          const dy=q?.dy||0;
          const est=dy>0?dy*p.n*p.cv:0;
          if(!est)return h('td',{className:'text-[var(--muted)]'},'—');
          return h('td',{className:'mono-sm-italic'},sm+fn(est));
        })(),
        ...displayYears.map(y=>{
          const val=getIncomeYear(income,p.t,y);
          return h('td',{key:y},
            h('input',{
              className:'ed',
              style:{color:y===CUR_YEAR?'var(--gold)':'var(--text)',width:68},
              defaultValue:val>0?val.toFixed(2):'',
              placeholder:'—',
              onBlur:e=>upd(p.t,y,e.target.value),
              onKeyDown:e=>e.key==='Enter'&&e.target.blur(),
            })
          );
        }),
        h('td',{className:'font-bold text-[var(--green)]'},rt>0?sm+fn(rt):'—'),
      );
    }),
    h('tr',{className:'bg-[var(--s2)]'},
      h('td',null,h('span',{style:{fontWeight:600,color:labelColor,fontSize:13}},sm==='$'?'$ TOTAL':'€ TOTAL')),
      (()=>{
        const est=grp.reduce((s,p)=>{const q=getQual(qm,p.t);const dy=q?.dy||0;return s+dy*p.n*p.cv;},0);
        return h('td',{className:'mono-sm-italic'},est>0?sm+fn(est):'—');
      })(),
      ...displayYears.map(y=>h('td',{key:y,style:{fontWeight:600,fontSize:13,color:y===CUR_YEAR?'var(--gold)':'var(--text)'}},
        tots[y]>0?sm+fn(tots[y]):'—'
      )),
      h('td',{className:'font-bold text-[var(--green)]'},sm+fn(tots.total)),
    )
  );
}
function Income({pos,setPos,income,qual,setQual,sold,cfg,initialTab}){
  const[sf,setSf]=useState('2025');
  const[sd,setSd]=useState('desc');
  const qualMap=useMemo(()=>buildQualMap(qual||[]),[qual]);
  // Years shown in "Rendimento por Ano" — derived from years that actually have
  // dividend data (not from the earliest buy transaction), so a position bought
  // years before its first dividend doesn't produce an empty column.
  const displayYears=useMemo(()=>{
    const yearsWithData=new Set([CUR_YEAR]);
    Object.values(income||{}).forEach(yr=>{
      Object.entries(yr||{}).forEach(([y,v])=>{if(v>0)yearsWithData.add(Number(y));});
    });
    [...(pos||[]),...(sold||[])].forEach(p=>{
      Object.entries(p.divByYear||{}).forEach(([y,v])=>{if(v>0)yearsWithData.add(Number(y));});
    });
    return YEARS.filter(y=>yearsWithData.has(y));
  },[pos,sold,income]);
  // when called from Conf the tab is driven externally via initialTab
  const[qtab,setQtab]=useState(initialTab||'income');
  // Fix: sync internal qtab whenever the parent changes initialTab prop
  useEffect(()=>{if(initialTab&&initialTab!==qtab)setQtab(initialTab);},[initialTab]);

  const{stocksUSD,stocksEUR}=useMemo(()=>pos.reduce((a,p)=>{
    if(!hasDividend(p,qualMap,income))return a;
    p.cat==='USD'?a.stocksUSD.push(p):a.stocksEUR.push(p);return a;
  },{stocksUSD:[],stocksEUR:[]}),[pos,qualMap,income]);

  const ts=f=>{if(sf===f)setSd(d=>d==='desc'?'asc':'desc');else{setSf(f);setSd('desc');}};
  const SA=f=>sf===f?(sd==='desc'?' ↓':' ↑'):'';

  const sortGrp=useCallback((grp)=>[...grp].sort((a,b)=>{
    const yk=parseInt(sf);
    if(!isNaN(yk)){const va=getIncomeYear(income,a.t,yk),vb=getIncomeYear(income,b.t,yk);return sd==='desc'?vb-va:va-vb;}
    if(sf==='ticker')return sd==='asc'?a.t.localeCompare(b.t):b.t.localeCompare(a.t);
    if(sf==='total'){const va=getIncome(income,a.t),vb=getIncome(income,b.t);return sd==='desc'?vb-va:va-vb;}
    return 0;
  }),[sf,sd,income]);
  const sortedUSD=useMemo(()=>sortGrp(stocksUSD),[stocksUSD,sf,sd,income]);
  const sortedEUR=useMemo(()=>sortGrp(stocksEUR),[stocksEUR,sf,sd,income]);

  // Writes directly to the position's own divByYear (setPos), instead of a
  // separate income state — dividend history lives on the position itself.
  const upd=(ticker,year,v)=>{
    const val=parseFloat(v)||0;
    setPos(prev=>prev.map(p=>p.t!==ticker?p:{
      ...p,
      divByYear:{...(p.divByYear||{}),[year]:val},
    }));
  }

  const totUSD=useMemo(()=>mkTotals(stocksUSD,income),[stocksUSD,income]);
  const totEUR=useMemo(()=>mkTotals(stocksEUR,income),[stocksEUR,income]);
  const rowTotal=t=>getIncome(income,t);

  /* Helper: sum divByYear across all years for a sold position */
  const getSoldDivByYear=(p,y)=>(p.divByYear&&p.divByYear[y])||0;

  /* Sold positions split by currency (only those with div data) */
  const{soldUSD,soldEUR}=useMemo(()=>{
    const exitDate=p=>p.exit||p.transactions?.slice().sort((x,y)=>y.date.localeCompare(x.date)).find(t=>t.type==='sell')?.date||'';
    const byExit=(a,b)=>exitDate(b).localeCompare(exitDate(a));
    const res=(sold||[]).reduce((a,p)=>{
      const hasDivData=p.divByYear||p.div>0;
      if(!hasDivData)return a;
      p.cat==='USD'?a.soldUSD.push(p):a.soldEUR.push(p);
      return a;
    },{soldUSD:[],soldEUR:[]});
    res.soldUSD.sort(byExit);
    res.soldEUR.sort(byExit);
    return res;
  },[sold]);

  /* Totals per year for sold positions */
  const totSoldUSD=useMemo(()=>Object.fromEntries(
    [...YEARS,'total'].map(y=>y==='total'
      ?['total',soldUSD.reduce((s,p)=>s+getSoldDivTotal(p),0)]
      :[y,soldUSD.reduce((s,p)=>s+getSoldDivByYear(p,y),0)])
  ),[soldUSD]);
  const totSoldEUR=useMemo(()=>Object.fromEntries(
    [...YEARS,'total'].map(y=>y==='total'
      ?['total',soldEUR.reduce((s,p)=>s+getSoldDivTotal(p),0)]
      :[y,soldEUR.reduce((s,p)=>s+getSoldDivByYear(p,y),0)])
  ),[soldEUR]);

  /* Total dividends received since inception (open + sold positions) */

  // ── Qual editing (moved from Qualidade page) ─────────────────────────────

  // calcScore is global — defined at top level
  const[qualLastUpdate,setQualLastUpdate]=useState('');
  function updQ(ticker,field,raw){
    const v=raw===''||raw===null?null:parseFloat(raw);
    const parsed=isNaN(v)?null:v;
    setQual(prev=>{
      const next=prev.map(q=>{
        if(q.t!==ticker)return q;
        const updated={...q,[field]:parsed};
        updated.sc=calcScore(updated);
        return updated;
      });
      return next;
    });
    setQualLastUpdate(new Date().toLocaleString('pt-PT',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}));
  }
  const qualSorted=useMemo(()=>[...qual].sort((a,b)=>(b.sc||0)-(a.sc||0)),[qual]);
  const activeTickers=useMemo(()=>new Set((pos||[]).filter(p=>p.n>0).map(p=>normTicker(p.t))),[pos]);

  const TH=({f,label,align})=>h('th',{className:'srt cursor-pointer hover:text-slate-200',style:align?{textAlign:align}:{},onClick:()=>ts(f)},label+SA(f));

  const tabBtn=(id,label)=>h('button',{
    onClick:()=>setQtab(id),
    style:{padding:'6px 14px',borderRadius:6,border:'1px solid',cursor:'pointer',fontSize:13,fontWeight:600,
      background:qtab===id?'var(--surface)':'transparent',
      borderColor:qtab===id?'var(--border)':'transparent',
      color:qtab===id?'var(--text)':'var(--muted)'}
  },label);

  return h('div',null,
    !initialTab&&h('div',{style:{display:'flex',gap:8,marginBottom:16}},
      tabBtn('metricas','Quality Score'),
      tabBtn('holdings','Holdings'),
      tabBtn('income','Activas - Income'),
    ),
    qtab==='income'&&h('div',null,
    h(Shdr,{title:'Rendimento por Ano (Valor Bruto)'}),

    h('div',{className:'card-table overflow-x-auto'},
      h('table',null,
        h('thead',null,h('tr',null,
          h(TH,{f:'ticker',label:'Ticker',align:'left'}),
          h('th',{style:{color:'var(--muted)',fontStyle:'italic',fontSize:12,whiteSpace:'nowrap'}},'Est. Atual'),
          ...displayYears.map(y=>h(TH,{key:y,f:String(y),label:String(y)})),
          h(TH,{f:'total',label:'Total'}),
        )),
        h(TableSection,{grp:sortedUSD,tots:totUSD,sm:'$',label:'Acções USD',headerBg:'#18181b',qualMap,displayYears,income,upd,rowTotal}),
        h(TableSection,{grp:sortedEUR,tots:totEUR,sm:'€',label:'Acções EUR + ETFs',headerBg:'#0a1f16',qualMap,displayYears,income,upd,rowTotal}),
      )
    ),

    /* ── Sold Positions Dividends — only in standalone Income page, not Config ── */
    !initialTab&&(soldUSD.length>0||soldEUR.length>0)&&h('div',{className:'mt-6'},
      h(Shdr,{title:'Dividendos — Posições Fechadas',hint:'Rendimento por ano durante o período de detenção · Edita divByYear no portfolio.json'}),
      (()=>{
      const DIV_YEARS=YEARS.filter(y=>y>=2023);
      return h('div',{className:'card-table overflow-x-auto'},
        h('table',null,
          h('thead',null,h('tr',null,
            h('th',null,'Ticker'),
            h('th',{className:'text-[10px] text-[var(--muted)]'},'Entrada'),
            h('th',{className:'text-[10px] text-[var(--muted)]'},'Saída'),
            ...DIV_YEARS.map(y=>h('th',{key:y,style:{textAlign:'right',fontSize:12,color:y===CUR_YEAR?'var(--gold)':'var(--muted)'}},String(y))),
            h('th',{className:'text-right'},'Total'),
            h('th',{style:{textAlign:'right',fontSize:12,color:'var(--muted)'}},'div (ref)'),
          )),
          /* USD sold */
          soldUSD.length>0&&h('tbody',null,
            h('tr',{style:{background:'#18181b'}},
              h('td',{colSpan:DIV_YEARS.length+5,style:{padding:'8px 12px',fontSize:12,fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',color:'var(--blue)'}},'[ VENDIDAS USD ]')
            ),
            ...soldUSD.map(p=>{
              const tot=getSoldDivTotal(p);
              const sym='$';
              return h('tr',{key:p.t,style:{opacity:0.85}},
                h('td',null,
                  h('span',{className:'font-semibold text-[var(--muted)]'},(p.name||p.t)),
                  h('span',{style:{fontSize:11,color:'var(--muted)',marginLeft:6}},p.t),
                  h('span',{style:{marginLeft:6,fontSize:11,padding:'1px 5px',borderRadius:6,background:'#2a1f00',color:'var(--gold)',fontWeight:700}},'VENDIDA')
                ),
                h('td',{className:'text-[10px] text-[var(--muted)]'},(p.entry||'—').slice(0,7)),
                h('td',{style:{fontSize:12,color:'var(--red)'}},(p.exit||'—').slice(0,7)),
                ...DIV_YEARS.map(y=>{
                  const v=getSoldDivByYear(p,y);
                  const inPeriod=p.divByYear&&y in p.divByYear;
                  return h('td',{key:y,style:{textAlign:'right',color:inPeriod?(v>0?'var(--green)':'var(--muted)'):'var(--s2)',fontSize:13}},
                    inPeriod?(v>0?sym+fn(v):'—'):'·'
                  );
                }),
                h('td',{style:{textAlign:'right',fontWeight:700,color:tot>0?'var(--green)':'var(--muted)'}},tot>0?sym+fn(tot):'—'),
                h('td',{className:'mono-sm-italic text-right'},p.div>0?sym+fn(p.div):'—'),
              );
            }),
            h('tr',{className:'bg-[var(--s2)]'},
              h('td',{colSpan:3},h('span',{style:{fontWeight:600,color:'var(--blue)',fontSize:13}},'$ TOTAL VENDIDAS')),
              ...DIV_YEARS.map(y=>h('td',{key:y,style:{textAlign:'right',fontWeight:600,fontSize:13,color:y===CUR_YEAR?'var(--gold)':'var(--text)'}},
                totSoldUSD[y]>0?'$'+fn(totSoldUSD[y]):'—'
              )),
              h('td',{style:{textAlign:'right',fontWeight:700,color:'var(--green)'}},totSoldUSD.total>0?'$'+fn(totSoldUSD.total):'—'),
              h('td'),
            )
          ),
          /* EUR sold */
          soldEUR.length>0&&h('tbody',null,
            h('tr',{style:{background:'#0a1f16'}},
              h('td',{colSpan:DIV_YEARS.length+5,style:{padding:'8px 12px',fontSize:12,fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',color:'var(--green)'}},'[ VENDIDAS EUR ]')
            ),
            ...soldEUR.map(p=>{
              const tot=getSoldDivTotal(p);
              const sym='€';
              return h('tr',{key:p.t,style:{opacity:0.85}},
                h('td',null,
                  h('span',{className:'font-semibold text-[var(--muted)]'},(p.name||p.t)),
                  h('span',{style:{fontSize:11,color:'var(--muted)',marginLeft:6}},p.t),
                  h('span',{style:{marginLeft:6,fontSize:11,padding:'1px 5px',borderRadius:6,background:'#2a1f00',color:'var(--gold)',fontWeight:700}},'VENDIDA')
                ),
                h('td',{className:'text-[10px] text-[var(--muted)]'},(p.entry||'—').slice(0,7)),
                h('td',{style:{fontSize:12,color:'var(--red)'}},(p.exit||'—').slice(0,7)),
                ...DIV_YEARS.map(y=>{
                  const v=getSoldDivByYear(p,y);
                  const inPeriod=p.divByYear&&y in p.divByYear;
                  return h('td',{key:y,style:{textAlign:'right',color:inPeriod?(v>0?'var(--green)':'var(--muted)'):'var(--s2)',fontSize:13}},
                    inPeriod?(v>0?sym+fn(v):'—'):'·'
                  );
                }),
                h('td',{style:{textAlign:'right',fontWeight:700,color:tot>0?'var(--green)':'var(--muted)'}},tot>0?sym+fn(tot):'—'),
                h('td',{className:'mono-sm-italic text-right'},p.div>0?sym+fn(p.div):'—'),
              );
            }),
            h('tr',{className:'bg-[var(--s2)]'},
              h('td',{colSpan:3},h('span',{style:{fontWeight:600,color:'var(--green)',fontSize:13}},'€ TOTAL VENDIDAS')),
              ...DIV_YEARS.map(y=>h('td',{key:y,style:{textAlign:'right',fontWeight:600,fontSize:13,color:y===CUR_YEAR?'var(--gold)':'var(--text)'}},
                totSoldEUR[y]>0?'€'+fn(totSoldEUR[y]):'—'
              )),
              h('td',{style:{textAlign:'right',fontWeight:700,color:'var(--green)'}},totSoldEUR.total>0?'€'+fn(totSoldEUR.total):'—'),
              h('td'),
            )
          ),
        )
      );
      })()  // end DIV_YEARS IIFE
    ),

  ),   /* end qtab==='income' */
    qtab==='metricas'&&h('div',null,
      h(Shdr,{title:'Quality Score',hint:qualLastUpdate?'Última actualização: '+qualLastUpdate:''}),
      h('div',{className:'card-table sticky-head'},
        h('table',null,
          h('thead',null,h('tr',null,
            ['Ticker','Score','DivGr 1A','DivGr 3A','DivGr 5A','DivGr 10A','Payout %','Yield %','Buyback %','EPS Gr%','Debt x','ROIC %','FCF %','Rev Gr%','Op Mar%'].map(x=>h('th',{key:x},x))
          )),
          h('tbody',null,qualSorted.filter(q=>activeTickers.has(normTicker(q.t))).map(q=>{
            const s=scoreColor(q.sc);
            const payoutColor=payoutMetricColor(q.py);
            const yieldColor=yieldMetricColor(q.dy);
            return h('tr',{key:q.t},
              h('td',{className:'font-semibold'},h(TickerLink,{t:q.t,className:'font-mono'})),
              h('td',null,h('span',{className:'badge',style:{background:s.bg,color:s.fg,fontFamily:'var(--mono)',minWidth:32,textAlign:'center'}},q.sc)),
              h(DgIn,{q,field:'g1',updQ}),
              h(DgIn,{q,field:'g3',updQ}),
              h(DgIn,{q,field:'g5',updQ}),
              h(DgIn,{q,field:'g10',updQ}),
              h('td',null,h('input',{className:'ed',style:{width:64,color:payoutColor.color,background:payoutColor.bg},
                defaultValue:q.py!=null?(q.py*100).toFixed(1):'',placeholder:'—',
                onBlur:e=>updQ(q.t,'py',e.target.value===''?null:parseFloat(e.target.value)/100),
                onKeyDown:e=>e.key==='Enter'&&e.target.blur()})),
              h('td',null,h('input',{className:'ed',style:{width:64,color:yieldColor.color,background:yieldColor.bg},
                defaultValue:q.dy!=null?(q.dy*100).toFixed(2):'',placeholder:'—',
                onBlur:e=>updQ(q.t,'dy',e.target.value===''?null:parseFloat(e.target.value)/100),
                onKeyDown:e=>e.key==='Enter'&&e.target.blur()})),
              h('td',null,h('input',{className:'ed',style:{width:64,color:'var(--gold)'},
                defaultValue:q.buyback!=null?(q.buyback*100).toFixed(1):'',placeholder:'—',
                onBlur:e=>updQ(q.t,'buyback',e.target.value===''?null:parseFloat(e.target.value)/100),
                onKeyDown:e=>e.key==='Enter'&&e.target.blur()})),
              h('td',null,h('input',{className:'ed',style:{width:64,color:q.eps!=null?(q.eps<0?'var(--red)':q.eps<0.05?'var(--gold)':'var(--green)'):'var(--muted)'},
                defaultValue:q.eps!=null?(q.eps*100).toFixed(1):'',placeholder:'—',
                onBlur:e=>updQ(q.t,'eps',e.target.value===''?null:parseFloat(e.target.value)/100),
                onKeyDown:e=>e.key==='Enter'&&e.target.blur()})),
              h('td',null,h('input',{className:'ed',style:{width:60,color:q.debt!=null?(q.debt<1.5?'var(--green)':q.debt<3.5?'var(--gold)':'var(--red)'):'var(--muted)'},
                defaultValue:q.debt!=null?q.debt.toFixed(1):'',placeholder:'x',
                onBlur:e=>updQ(q.t,'debt',e.target.value===''?null:parseFloat(e.target.value)),
                onKeyDown:e=>e.key==='Enter'&&e.target.blur()})),
              h('td',null,h('input',{className:'ed',style:{width:64,color:q.roic!=null?(q.roic>=0.20?'var(--green)':q.roic>=0.09?'var(--gold)':q.roic>=0.02?'var(--tier-warn)':'var(--red)'):'var(--muted)'},

function fmtK(v){
  const a=Math.abs(v);
  if(a>=1e6)return (v/1e6).toFixed(1).replace(/\.0$/,'')+'M';
  if(a>=1e4)return Math.round(v/1000)+'k';
  if(a>=1e3)return (v/1000).toFixed(1).replace(/\.0$/,'')+'k';
  return String(Math.round(v));
}

// ── Alocação por Corretora ───────────────────────────────────────────────
// Each transaction may carry an optional `broker` string. Net shares per broker =
// buys − sells booked on that broker; anything not attributable goes to NO_BROKER.
const NO_BROKER='Sem corretora';
const BROKER_COL={'xtb':'#ef4444','interactive brokers':'#22c55e','trade republic':'#64748b','degiro':'#a16207','trading 212':'#0ea5e9','amundi':'#a855f7'};
function brokerSharesOf(p){
  const net={};
  (p.transactions||[]).forEach(tx=>{
    const b=(typeof tx.broker==='string'&&tx.broker.trim())||NO_BROKER;
    net[b]=(net[b]||0)+(tx.type==='buy'?tx.n:-tx.n);
  });
  const out=Object.entries(net).map(([broker,shares])=>({broker,shares:Math.max(0,shares)})).filter(x=>x.shares>1e-9);
  const assigned=out.reduce((a,x)=>a+x.shares,0);
  const rest=(p.n||0)-assigned;
  if(rest>1e-6){
    const e=out.find(x=>x.broker===NO_BROKER);
    if(e)e.shares+=rest;else out.push({broker:NO_BROKER,shares:rest});
  }
  return out;
}
function BrokerPie({pos,qualMap}){
  const items=useMemo(()=>{
    const acc={};
    pos.forEach(p=>{
      if(!(p.n>0))return;
      const c=cx(p,getQual(qualMap,p.t)?.dy);
      brokerSharesOf(p).forEach(({broker,shares})=>{
        const x=acc[broker]||(acc[broker]={broker,val:0,count:0});
        x.val+=c.val*shares/p.n;
        x.count+=1;
      });
    });
    const colOf=(b,i)=>b===NO_BROKER?'var(--muted)':(BROKER_COL[b.toLowerCase()]||CHART_PALETTE[i%CHART_PALETTE.length]);
    return Object.values(acc).filter(x=>x.val>0)
      .sort((x,y)=>(x.broker===NO_BROKER)-(y.broker===NO_BROKER)||y.val-x.val)
      .map((x,i)=>({key:x.broker,label:x.broker,val:x.val,col:colOf(x.broker,i),sub:x.count+(x.count===1?' posição':' posições')}));
  },[pos,qualMap]);
  return h(DistPanel,{items,totalLabel:'Carteira',emptyText:'Sem posições activas.'});
}

          ].sort((a,b)=>b.costAnnual-a.costAnnual);

                    h('td',{style:{padding:'8px 10px',textAlign:'right',color:'var(--muted)'}},' -€'+fn(totalCost/12)),

      (()=>{
        // Order follows cfg.despesasItems as declared (no longer auto-sorted by amount),

        if(!items.length) return h('div',null);
        let cum=0;
        const rows=items.map(it=>{

          const covered=monthlyEUR>=cum;
          const partial=!covered&&monthlyEUR>before&&amount>0;
          const partialPct=partial?Math.max(0,Math.min(100,((monthlyEUR-before)/amount)*100)):0;

          h('div',{className:'grid grid-cols-1 sm:grid-cols-3 gap-2'},
            rows.map((it,i)=>{
              const fillPct=it.covered?100:it.partial?it.partialPct:0;

              return h('div',{key:i,style:{minWidth:0,padding:10,background:'var(--surface)',
                border:'1px solid var(--border)',borderRadius:8}},
                h('div',{style:{display:'flex',alignItems:'flex-start',gap:7}},
                  h('span',{style:{fontSize:13}},it.icon),
                  h('span',{style:{fontSize:12,color:'var(--text)',fontWeight:600,flex:1,minWidth:0}},it.label),
                  h('span',{style:{fontSize:12,color:'var(--text)',fontWeight:700,whiteSpace:'nowrap'}},'€'+fn(it.amount)+'/mês')
                ),
                h('div',{style:{height:5,marginTop:9,background:'var(--s2)',borderRadius:4,overflow:'hidden'}},
                  h('div',{style:{height:'100%',width:fillPct+'%',background:coverageColor,borderRadius:4,transition:'width .4s ease'}})
                ),
                h('div',{style:{fontSize:11,color:coverageColor,marginTop:5,fontWeight:600}},
                  it.covered?'Coberto por dividendos':it.partial?it.partialPct.toFixed(0)+'% coberto':'Por cobrir')
              );
            })
          ),
          h('div',{style:{display:'flex',alignItems:'center',gap:8,padding:'8px 8px 2px',marginTop:6,borderTop:'1px solid var(--border)'}},
            h('span',{style:{fontSize:12,color:'var(--muted)',flex:1,fontWeight:700,textTransform:'uppercase',letterSpacing:'.04em'}},'Total / mês'),
            h('span',{style:{fontSize:13,color:'var(--text)',fontWeight:700}},'€'+cum.toFixed(2))
          )
        );
      })()
    ),

    /* ── Portfolio Distribution — split into 3 cards instead of one giant
       full-width card, so there's no dead space next to the tabs ── */
    h('div',{className:'portdist-grid mt-4'},

      /* Tabs card — 4/12 cols, spans both rows */
      h('div',{className:'card',style:{gridColumn:'span 4',gridRow:'span 2',display:'flex',flexDirection:'column'}},
        h(Shdr,{title:'Portfolio Distribution'}),
        h(PortDistTabs,{pos,qualMap,cfg}),
      ),

      /* Alocação por Posição — 8/12 cols */
      h('div',{className:'card',style:{gridColumn:'span 8'}},
        h(Shdr,{title:'Alocação por Posição'}),
        h(DonutChart,{pos,cfg,compact:true})
      ),

      /* Exposição por Stock — 8/12 cols */
      (()=>{
        const[hov,setHov]=useState(null);
        const stocks=pos.filter(p=>p.cat!=='ETF').map(p=>({t:p.t,name:p.name||p.t,country:p.country||'',val:p.n*(p.cv||0)})).filter(x=>x.val>0).sort((a,b)=>b.val-a.val);
        if(!stocks.length)return null;
        const COLS=CHART_PALETTE;
        const CX=110,CY=110,R=84,ri=52; // same ring as the compact DonutChart (Alocação por Posição)
        const slices=computeDonutSlices(stocks.map((x,i)=>({...x,col:COLS[i%COLS.length]})),CX,CY,R,ri);

        // Legend item styled like the compact DonutChart legend (Alocação por Posição).
        const LegRow=({sl})=>h('div',{
          style:{display:'flex',alignItems:'center',gap:6,cursor:'pointer',opacity:hov&&hov!==sl.t?.4:1,transition:'opacity .15s'},
          onMouseEnter:()=>setHov(sl.t),onMouseLeave:()=>setHov(null)},
          h('div',{style:{width:10,height:10,borderRadius:6,background:sl.col,flexShrink:0}}),
          h('span',{style:{fontSize:13,color:'var(--muted)',whiteSpace:'nowrap'}},
            sl.t,' ',h('span',{style:{color:sl.col,fontWeight:700}},(sl.pct*100).toFixed(1)+'%'))
        );
        return h('div',{className:'card',style:{gridColumn:'span 8'}},
          h(Shdr,{title:'Exposição por Stock',hint:stocks.length+' posições'}),
          h('div',{style:{display:'flex',gap:24,alignItems:'flex-start',flexWrap:'wrap'}},
            /* Pie */
            h('div',{style:{flexShrink:0}},
              h('svg',{width:220,height:220,style:{filter:'drop-shadow(0 4px 24px rgba(0,0,0,.4))'}},
                slices.map(sl=>h('path',{key:sl.t,d:sl.d,fill:sl.col,
                  opacity:hov&&hov!==sl.t?.2:1,

                h('text',{x:CX,y:CY-8,textAnchor:'middle',fontSize:12,fontWeight:700,fill:'var(--muted)'},hovSlice?hovSlice.t:'Stocks'),
                h('text',{x:CX,y:CY+10,textAnchor:'middle',fontSize:hovSlice?18:11,fontWeight:700,fill:hovSlice?hovSlice.col:'var(--blue)'},
                  hovSlice?(hovSlice.pct*100).toFixed(1)+'%':(stocks.length+' posições'))
              )
            ),
            /* legend: same grid as Alocação por Posição (row by row) */
            h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(110px,1fr))',gap:'4px 16px',flex:'1 1 220px',minWidth:0,alignContent:'start'}},
              slices.map(sl=>h(LegRow,{key:sl.t,sl}))
            )

        );
      })()
    ),

    /* ── Dividend Snowball Projection ── */
    (()=>{
      const CFG_MONTHLY=cfg?.monthlyCapital||1200;
      const ANNUAL_INJECTION=snowMonthly*12; // simulated via the slider; starts at cfg.monthlyCapital
      const YIELD=cfg?.targetYield||0.045;  // yield on new capital at purchase
      const GOAL_ANN=snowGoal;
      const HORIZON=30;
      const MILESTONES=[5,10,15,20,25,30];

      // M8 FIX: renamed from base2025 — reads CUR_YEAR-1 data, name was a stale hardcoded label
      // Also C11 FIX: include sold positions' dividends in base income
      const refYear=CUR_YEAR-1;
      const baseIncomeRefYear=Object.entries(income||{}).reduce((s,[t,yr])=>s+(yr[refYear]||0),0)
        +(sold||[]).reduce((s,p)=>s+(getSoldDivByYear(p,refYear)||0),0);
      const baseEst=pos.reduce((s,p)=>{
        if(baseIncomeRefYear>0)return s;
        const dy=getQual(qualMap,p.t)?.dy||0;
        return s+(dy>0&&p.n>0&&p.cv>0?dy*p.n*p.cv:0);
      },0);
      const baseInc=baseIncomeRefYear>0?baseIncomeRefYear:baseEst>0?baseEst:ANNUAL_INJECTION;

      const dg=snowDivGr/100;  // dividend growth rate
      const sg=snowStkGr/100;  // stock price growth rate
      const ig=snowInfl/100;   // inflation rate

      // Correct model:
      // existing income at year y = baseInc × (1+dg)^y
      //
      // Injection made at year j buys shares at price P₀×(1+sg)^j
      // shares bought = ANNUAL_INJECTION / (P₀×(1+sg)^j)
      // each share pays D₀×(1+dg)^y at year y
      // → injection j income at year y = ANNUAL_INJECTION × (D₀/P₀) × (1+dg)^y / (1+sg)^j
      //                                = ANNUAL_INJECTION × YIELD × (1+dg)^y / (1+sg)^j
      //
      // Total injection income at year y = ANNUAL_INJECTION × YIELD × (1+dg)^y × Σⱼ₌₀ʸ⁻¹ 1/(1+sg)^j
      // If sg>0: geometric sum = [(1+sg)^y - 1] / [(1+sg)^y × (sg/(1+sg))]
      //        = [(1+sg)((1+sg)^y-1)] / [sg×(1+sg)^y]
      // If sg=0: sum = y

      const injectionSum=y=>{
        if(y===0)return 0;
        if(Math.abs(sg)<0.0001)return y;
        return ((1+sg)*(Math.pow(1+sg,y)-1))/(sg*Math.pow(1+sg,y));
      };

      const nominalInc=y=>
        baseInc*Math.pow(1+dg,y)
        + ANNUAL_INJECTION*YIELD*Math.pow(1+dg,y)*injectionSum(y);

      const realInc=y=>nominalInc(y)/Math.pow(1+ig,y);

      const pts=Array.from({length:HORIZON+1},(_,i)=>({y:i,nom:nominalInc(i),real:realInc(i)}));
      const maxV=Math.max(...pts.map(p=>p.nom),GOAL_ANN*1.1);
      const W=900,H=300,PL=48,PR=8,iw=W-PL-PR;
      const xp=i=>PL+i*(iw/HORIZON);
      const yp=v=>H-Math.max(0,Math.round((v/maxV)*H*0.95));
      const nomLine=pts.map((p,i)=>`${i===0?'M':'L'}${xp(i).toFixed(1)},${yp(p.nom)}`).join(' ');
      const realLine=pts.map((p,i)=>`${i===0?'M':'L'}${xp(i).toFixed(1)},${yp(p.real)}`).join(' ');

      // When does nominal cross GOAL?
      const crossYear=pts.find(p=>p.y>0&&p.nom>=GOAL_ANN)?.y;

      return h('div',{className:'card mt-4'},
        h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}},
          h(Shdr,{title:'Dividend Snowball Projection'}),
          crossYear&&h('span',{style:{fontSize:12,color:'var(--green)',fontWeight:700}},
            'meta em '+crossYear+' anos ('+( new Date().getFullYear()+crossYear)+')')
        ),

        /* sliders */
        h('div',{className:'grid grid-cols-1 gap-3 sm:grid-cols-3',style:{
          padding:16,background:'var(--s2)',borderRadius:6,border:'1px solid var(--border)',marginBottom:12}},
          h(Slider,{label:'Div Growth',value:snowDivGr,set:setSnowDivGr,min:0,max:12,step:0.5,color:'var(--gold)'}),
          h(Slider,{label:'Stock Growth',value:snowStkGr,set:setSnowStkGr,min:0,max:12,step:0.5,color:'var(--blue)'}),
          h(Slider,{label:'Inflação',value:snowInfl,set:setSnowInfl,min:0,max:8,step:0.5,color:'var(--red)'}),
        ),
        /* Goal + monthly contribution, side by side (6/12 columns each) */
        h('div',{className:'grid grid-cols-1 gap-3 sm:grid-cols-2',style:{marginBottom:14}},
          /* Goal input */
          h('div',{style:{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',minWidth:0,flexWrap:'wrap',background:'var(--s2)',borderRadius:6,border:'1px solid var(--gold)'}},
            h('span',{style:{fontSize:12,color:'var(--gold)',fontWeight:700,flexShrink:0}},'Meta anual (bruto):'),
            h('input',{
              type:'range',min:500,max:5000,step:100,value:snowGoal,
              style:{flex:1,minWidth:90,accentColor:'var(--gold)'},
              onInput:e=>setSnowGoal(parseInt(e.target.value))
            }),
            h('span',{style:{fontSize:13,fontWeight:700,color:'var(--gold)',minWidth:64,textAlign:'right'}},
              '€'+snowGoal.toLocaleString()
            ),
            h('span',{style:{fontSize:11,color:'var(--muted)',marginLeft:4}},
              '→ €'+(snowGoal*(1-(cfg?.taxRate||0.28))).toFixed(0)+' líq.' // M4 FIX: cfg.taxRate not hardcoded 0.72
            )
          ),
          /* Monthly contribution (simulation) */
          h('div',{style:{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',minWidth:0,flexWrap:'wrap',background:'var(--s2)',borderRadius:6,border:'1px solid var(--blue)'}},
            h('span',{style:{fontSize:12,color:'var(--blue)',fontWeight:700,flexShrink:0}},'Aporte mensal:'),
            h('input',{
              type:'range',min:0,max:Math.max(5000,Math.ceil(CFG_MONTHLY/500)*500),step:50,value:snowMonthly,
              style:{flex:1,minWidth:90,accentColor:'var(--blue)'},
              onInput:e=>setSnowMonthly(parseInt(e.target.value))
            }),
            h('span',{style:{fontSize:13,fontWeight:700,color:'var(--blue)',minWidth:64,textAlign:'right'}},
              '€'+snowMonthly.toLocaleString()+'/mês'
            ),
            h('span',{style:{fontSize:11,color:'var(--muted)',marginLeft:4}},'→ €'+ANNUAL_INJECTION.toLocaleString()+'/ano'),
            snowMonthly!==CFG_MONTHLY&&h('button',{
              title:'Repor o valor da Config (€'+CFG_MONTHLY+'/mês)',
              onClick:()=>setSnowMonthly(CFG_MONTHLY),
              style:{background:'none',border:'1px solid var(--border)',borderRadius:6,color:'var(--muted)',cursor:'pointer',fontSize:12,padding:'2px 8px',flexShrink:0}
            },'↺ €'+CFG_MONTHLY)
          ),
        ),

        /* assumptions strip */
        h('div',{style:{display:'flex',gap:16,marginBottom:14,fontSize:11,color:'var(--muted)',flexWrap:'wrap'}},
          h('span',null,'Base: ',h('span',{className:'font-semibold text-[var(--gold)]'},'€'+baseInc.toFixed(0)+'/ano')),
          h('span',null,'Reforço: ',h('span',{style:{fontWeight:600,color:'var(--blue)'}},'€'+snowMonthly+'/mês · €'+ANNUAL_INJECTION+'/ano')),
          h('span',null,'Yield: ',h('span',{style:{fontWeight:600,color:'var(--blue)'}},(YIELD*100)+'%')),
          h('span',null,'Div growth: ',h('span',{className:'font-semibold text-[var(--gold)]'},(dg*100).toFixed(1)+'%')),
          h('span',null,'Stock growth: ',h('span',{style:{fontWeight:600,color:'var(--blue)'}},(sg*100).toFixed(1)+'%')),
          h('span',null,'Inflação: ',h('span',{className:'font-semibold text-[var(--red)]'},(ig*100).toFixed(1)+'%')),
        ),

        /* milestone boxes */
        // Milestones (2 per row) beside a larger chart; stacked on narrow screens.
        h('div',{className:'sim-split mb-4'},h('div',{className:'sim-cards'},
          MILESTONES.map(yr=>{
            const nom=nominalInc(yr);
            const real=realInc(yr);
            const mult=baseInc>0?nom/baseInc:0;
            const isGoal=nom>=GOAL_ANN;
            return h('div',{key:yr,style:{background:'var(--s2)',borderRadius:6,padding:'8px 6px',
              textAlign:'center',border:'1px solid '+(isGoal?'var(--green)':'var(--border)')}},
              h('div',{style:{fontSize:11,color:'var(--muted)',marginBottom:3}},yr+'a · '+(new Date().getFullYear()+yr)),
              h('div',{style:{fontSize:13,fontWeight:700,color:'var(--gold)'}},'€'+nom.toFixed(0)),
              h('div',{style:{fontSize:11,color:'var(--red)',marginTop:1}},'€'+real.toFixed(0)+' real'),
              h('div',{style:{fontSize:11,color:isGoal?'var(--green)':'var(--muted)',marginTop:1}},
                isGoal?'✅ meta':'×'+mult.toFixed(1))
            );
          })
        ),

        /* SVG chart */
        h('div',{className:'sim-chart'},h('svg',{viewBox:`0 0 ${W} ${H+36}`,style:{width:'100%',height:'auto',overflow:'visible'}},
          /* grid lines */
          [0.25,0.5,0.75,1].map(f=>h('g',{key:f},
            h('line',{x1:PL,y1:Math.round(H*(1-f)*0.95),x2:W-PR,y2:Math.round(H*(1-f)*0.95),
              stroke:'var(--border)',strokeDasharray:'3 4',strokeWidth:.7}),
            h('text',{x:PL-4,y:Math.round(H*(1-f)*0.95)+4,fontSize:9,fill:'var(--muted)',textAnchor:'end'},'€'+(maxV*f/1000).toFixed(0)+'k')
          )),
          /* goal line */
          GOAL_ANN<=maxV&&h('g',null,
            h('line',{x1:PL,y1:yp(GOAL_ANN),x2:W-PR,y2:yp(GOAL_ANN),
              stroke:'var(--green)',strokeDasharray:'4 3',strokeWidth:1.2,opacity:.8}),
            h('text',{x:W-PR-2,y:yp(GOAL_ANN)-4,fontSize:9,fill:'var(--green)',textAnchor:'end'},'€'+GOAL_ANN+'/ano')
          ),
          /* inflation real line */
          h('line',{x1:PL,y1:yp(baseInc),x2:W-PR,y2:yp(baseInc),
            stroke:'var(--muted)',strokeDasharray:'2 4',strokeWidth:.6,opacity:.5}),
          /* nominal area fill */
          h('path',{d:nomLine+` L${xp(HORIZON).toFixed(1)},${H} L${xp(0).toFixed(1)},${H}Z`,
            fill:'#f59e0b',opacity:.07}),
          /* nominal line */
          h('path',{d:nomLine,fill:'none',stroke:'#f59e0b',strokeWidth:2.5,
            strokeLinejoin:'round',strokeLinecap:'round'}),
          /* real line */
          h('path',{d:realLine,fill:'none',stroke:'var(--red)',strokeWidth:1.5,
            strokeLinejoin:'round',strokeLinecap:'round',strokeDasharray:'5 3'}),
          /* milestone dots */
          MILESTONES.map(yr=>{
            const cx2=xp(yr),cy2=yp(pts[yr].nom);
            const isGoal=pts[yr].nom>=GOAL_ANN;
            return h('g',{key:yr},
              h('circle',{cx:cx2,cy:cy2,r:4,
                fill:isGoal?'var(--green)':'var(--gold)',stroke:'var(--surface)',strokeWidth:2}),
              h('text',{x:cx2,y:H+20,textAnchor:'middle',fontSize:9,
                fill:'var(--muted)'},yr+'a')
            );
          }),
          h('text',{x:xp(0),y:H+20,textAnchor:'middle',fontSize:9,fill:'var(--muted)'},'hoje'),
          /* legend */
          h('g',null,
            h('line',{x1:PL,y1:H+32,x2:PL+16,y2:H+32,stroke:'#f59e0b',strokeWidth:2}),
            h('text',{x:PL+20,y:H+36,fontSize:9,fill:'var(--muted)'},'nominal'),
            h('line',{x1:PL+68,y1:H+32,x2:PL+84,y2:H+32,stroke:'var(--red)',strokeWidth:1.5,strokeDasharray:'5 3'}),
            h('text',{x:PL+88,y:H+36,fontSize:9,fill:'var(--muted)'},'real (−'+snowInfl+'% inflação)'),
          )
        ))),
        h('div',{style:{fontSize:11,color:'var(--muted)',marginTop:8}},
          '€'+ANNUAL_INJECTION+'/ano novo capital · nominal ',
          h('span',{className:'text-gold'},'€'+nominalInc(30).toFixed(0)),
          ' · real ',
          h('span',{className:'text-[var(--red)]'},'€'+realInc(30).toFixed(0)),
          ' em 30 anos'
        )
      );
    })(),

    /* ── Portfolio Value Goal 💼 ── */
    (()=>{
      const HORIZON=30;
      const MILESTONES=[3,5,10,15,20,25,30];
      const monthlySav=portMonthlySav;
      const annRet=portAnnRet/100;
      const ig=portInfl/100;
      const GOAL=portGoal;

      // Current portfolio value
      const currentVal=tv;

      // M7 FIX: monthly compounding FV formula — previous formula used annual contributions
      // which underestimates by ~€20k over 20yr at €500/mo at 7%
      const nomVal=y=>{
        if(y===0)return currentVal;
        const r12=annRet/12;
        const n=y*12;
        if(Math.abs(annRet)<0.0001)return currentVal+monthlySav*n;
        return currentVal*Math.pow(1+r12,n)+monthlySav*((Math.pow(1+r12,n)-1)/r12);
      };
      const realVal=y=>nomVal(y)/Math.pow(1+ig,y);

      const pts=Array.from({length:HORIZON+1},(_,i)=>({y:i,nom:nomVal(i),real:realVal(i)}));
      const maxV=Math.max(...pts.map(p=>p.nom),GOAL*1.15);
      const W=900,H=300,PL=54,PR=8,iw=W-PL-PR;
      const xp=i=>PL+i*(iw/HORIZON);
      const yp=v=>H-Math.max(0,Math.round((v/maxV)*H*0.95));
      const nomLine=pts.map((p,i)=>`${i===0?'M':'L'}${xp(i).toFixed(1)},${yp(p.nom)}`).join(' ');
