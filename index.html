/* ── CSS custom properties (theming) ─────────────────── */
:root{
  /* Theme "Graphite Emerald": near-black greys, one accent (emerald). --gold and
     --orange are the accent; --blue is a teal for secondary/info values. */
  --bg:#0a0a0b;--surface:#141416;--s2:#1c1c1f;--border:#2a2a2e;
  --muted:#9a9aa3;--green:#10b981;--red:#f43f5e;--gold:#10b981;
  --blue:#2dd4bf;--orange:#10b981;--mono:'JetBrains Mono',monospace;
  --text:#f4f4f5;--accent:#10b981;--accent-ink:#04130d;
  /* Named aliases for the 4-tier quality-metric scale (red→tier-warn→tier-ok→green)
     used across ~60 spots (scoreColor, sc2col, py/eps/debt/fcf/revgr/opmar colors,
     legends). Same hex as before — this only gives them a name so future edits
     don't add a third slightly-different orange/gold by accident. */
  --tier-warn:#fb923c;--tier-ok:#fbbf24;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-size:13px;}
table{border-collapse:collapse;width:100%;}
th{padding:8px 12px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:8px 12px;font-size:13px;border-bottom:1px solid var(--s2);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tfoot tr{background:var(--s2);border-top:2px solid var(--border);}
tfoot td{font-weight:600;font-size:13px;}
/* Native <select> dropdown popups otherwise render with the browser's default
   light theme (white background/black text) since inline styles on <select>
   don't reach its <option> popup list — style them globally instead. */
select{background:var(--s2);color:var(--text);}
option{background:var(--surface);color:var(--text);}
select:focus{outline:1px solid var(--blue);}

.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700;letter-spacing:.04em;}

input{background:transparent;border:none;color:inherit;font-family:inherit;font-size:inherit;width:100%;outline:none;}
a{color:var(--blue);text-decoration:none;}

/* ── KPI accent bars (pseudo-element, can't do in Tailwind) ── */
.kpi{position:relative;overflow:hidden;}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.kpi-bl::before{background:var(--blue);}
.kpi-gr::before{background:var(--green);}
.kpi-re::before{background:var(--red);}

/* ── Scrollbar hiding (pseudo-element) ── */
.tabs{-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}

/* ── Editable cell input ── */
.ed{font-family:var(--mono);font-size:12px;text-align:right;color:var(--muted);width:72px;background:#0a0a0b !important;border:1px solid var(--border);border-radius:4px;padding:2px 4px;}
.ed:focus{background:#2a2a2e;color:#f8fafc;outline:none;}
.ed:focus{color:#f8fafc;outline:none;}

/* ── Sortable header ── */
.srt{cursor:pointer;user-select:none;}
.srt:hover{color:#f8fafc;}

/* ── Filter button ── */
.fb{padding:4px 10px;border-radius:9999px;font-size:12px;font-weight:600;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap;}
.fb.on{border-color:var(--accent);background:rgba(16,185,129,.12);color:var(--accent);}
.fb:hover:not(.on){color:#f4f4f5;}

/* ── Toast ── */
.toast{position:fixed;bottom:24px;right:24px;background:#10b981;color:#fff;padding:8px 16px;border-radius:6px;font-size:13px;font-weight:600;z-index:9999;pointer-events:none;}

/* ── Top navigation bar ── */
/* Donut chart + legend: legend columns spread evenly over the free width */
.donut-wrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:center;}
.donut-legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px 12px;width:100%;}
@media(max-width:640px){.donut-wrap{grid-template-columns:1fr;justify-items:center;}}
/* Dividend calendar: 4 months per row (2 on phones) */
.cal-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:8px;}
@media(max-width:640px){.cal-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
/* SWOT matrix (Teses): 2×2 coloured quadrants with axis labels; one column on phones */
.swot{display:grid;grid-template-columns:52px 1fr 1fr;grid-template-rows:auto auto auto;gap:8px;}
.swot-head{background:#2a2a2e;color:#f3f4f6;border-radius:6px;padding:8px 10px;text-align:center;}
.swot-side{background:#2a2a2e;color:#f3f4f6;border-radius:6px;display:flex;align-items:center;justify-content:center;}
.swot-side>div{transform:rotate(-90deg);white-space:nowrap;text-align:center;}
.swot-q{border-radius:6px;padding:14px 14px 16px;color:#16181d;}
.swot-items{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-top:10px;}
@media(max-width:700px){.swot{grid-template-columns:1fr;}.swot-head,.swot-side,.swot-corner{display:none;}.swot-items{grid-template-columns:1fr;}}
/* Table whose header stays visible while its rows scroll (Quality Score) */
/* Long tables grow with the page (no inner scroll); the header sticks under the top bar. */
.sticky-head{overflow:visible !important;}
/* Table headers on every page: double height (overrides inline paddings). */
.page thead th{padding-top:24px !important;padding-bottom:24px !important;}
.sticky-head thead th{position:sticky;top:48px;z-index:2;background:var(--surface);box-shadow:inset 0 -1px 0 var(--border);}
.sticky-head thead th:first-child{border-top-left-radius:12px;}
.sticky-head thead th:last-child{border-top-right-radius:12px;}
/* Narrow screens: the table scrolls sideways inside its card, so the header can't stick to the page. */
@media(max-width:1100px){.sticky-head{overflow-x:auto !important;}.sticky-head thead th{position:static;}}

  display:flex;align-items:center;gap:8px;
  padding:0 12px;min-height:48px;
  background:var(--surface);
  border-bottom:1px solid var(--border);

  flex-wrap:wrap;overflow:visible;
}
@media(max-width:640px){
  .bar{padding:6px 10px;gap:4px;}

/* Custom grid utilities — this file ships a PURGED Tailwind build (only classes

/* Income page KPI row: "Total Dividends" spans 2 of 6 columns, the other 4

.go{color:var(--gold);}
.text-\[var\(--green\)\]{color:var(--green);}
.text-\[var\(--red\)\]{color:var(--red);}
/* ── Utility shorthand classes ── */
.mono-sm{font-family:var(--mono);font-size:12px;}
.mono-sm-italic{font-family:var(--mono);font-size:12px;font-style:italic;color:var(--muted);}
.mono-xs-muted{font-family:var(--mono);font-size:11px;color:var(--muted);}


/* ── Card variants ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 24px;}
@media(max-width:640px){.card{padding:14px 14px;border-radius:8px;}}
.card-table{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.card-sm{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;}
.summary-grid-6{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
@media(min-width:640px){.summary-grid-6{grid-template-columns:repeat(3,1fr);}}
@media(min-width:1024px){.summary-grid-6{grid-template-columns:repeat(6,1fr);}}
.portdist-grid{display:grid;grid-template-columns:1fr;gap:16px;}
@media(min-width:768px){.portdist-grid{grid-template-columns:repeat(12,1fr);}}

/* ── Section label ── */

/* ── Mono text helpers ── */
.mono-sm{font-family:var(--mono);font-size:13px;}
.mono-sm-muted{font-family:var(--mono);font-size:13px;color:var(--muted);}
.mono-sm-gold{font-family:var(--mono);font-size:13px;color:var(--gold);}
.mono-sm-italic{font-family:var(--mono);font-size:13px;color:var(--muted);font-style:italic;}
.mono-xs-muted{font-family:var(--mono);font-size:12px;color:var(--muted);}

/* ── Plain text helpers ── */



/* ── Input/config row ── */
.input-row{background:var(--s2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:10px;}

/* ── Stat cell (goal widget) ── */

/* ── Table footer total row ── */
.tfoot-total{font-weight:700;border-top:2px solid var(--border);}

/* ── Savebtn colour variants ── */
.btn-secondary{
  flex-shrink:0;padding:6px 16px;border-radius:999px;font-size:13px;font-weight:700;
  cursor:pointer;font-family:inherit;white-space:nowrap;transition:background .15s;
  background:#1a3a2a;border:1px solid #0d9488;color:#0d9488;
}
.btn-secondary:hover{background:#1f4a38;}
.btn-tertiary{
  flex-shrink:0;padding:6px 16px;border-radius:999px;font-size:13px;font-weight:700;
  cursor:pointer;font-family:inherit;white-space:nowrap;transition:background .15s;
  background:#1c1c1f;border:1px solid var(--blue);color:var(--blue);
}
.btn-tertiary:hover{background:#1e3a50;}
.btn-quaternary{
  flex-shrink:0;padding:6px 16px;border-radius:999px;font-size:13px;font-weight:700;
  cursor:pointer;font-family:inherit;white-space:nowrap;transition:background .15s;
  background:#1a2a1a;border:1px solid var(--green);color:var(--green);
}
.btn-quaternary:hover{background:#1f3a1f;}

/* ── Responsive handled by Tailwind responsive prefixes ── */

/* Text sizes across the app (base 13px): Tailwind arbitrary sizes raised like the inline ones. */
.text-\[8px\]{font-size:10px !important;}
.text-\[9px\]{font-size:11px !important;}
.text-\[10px\]{font-size:12px !important;}
.text-\[11px\]{font-size:12px !important;}
.text-\[12px\]{font-size:13px !important;}
.text-\[13px\]{font-size:14px !important;}
/* Phones: keep the previous, more compact size so wide cards and tables still fit. */
@media(max-width:640px){.page{zoom:.92;}.shdr-title{white-space:normal !important;}}
/* Grid and flex children may shrink below their content, so wide tables scroll inside their card. */
.page .grid>*,.page .flex-col>*{min-width:0;}
.tab{border-radius:999px !important;}
.logo{color:var(--text) !important;}
.logo::first-letter{color:var(--accent);}
/* Simulations (Analytics): milestone cards in 2 columns beside the chart. */
.sim-split{display:grid;grid-template-columns:minmax(260px,380px) minmax(0,1fr);gap:20px;align-items:center;}
.sim-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start;}
.sim-chart{min-width:0;}
@media(max-width:900px){.sim-split{grid-template-columns:1fr;}}
/* Button rows inside cards (Config, etc.): wrap to a second line instead of overflowing,
   and let long labels break inside the button. */
.page .flex:has(> .btn-primary.flex-1),.page .flex:has(> .btn-secondary.flex-1){flex-wrap:wrap;}
.page .flex > .btn-primary.flex-1,.page .flex > .btn-secondary.flex-1{flex:1 1 140px;min-width:0;white-space:normal;line-height:1.25;}
/* Navigation centred on the page: logo left, tabs centre, save button right. */
@media(min-width:641px){
  .bar{display:grid;grid-template-columns:1fr auto 1fr;}
  .bar .tabs{flex:none;justify-content:center;}
  .bar .btn-primary{justify-self:end;}
}
</style>

function writeStorageBatch(entries,removals=[]){
  const keys=[...new Set([...entries.map(([key])=>key),...removals])];
  const previous=new Map(keys.map(key=>[key,localStorage.getItem(key)]));
  const changed=[];
  try{
    entries.forEach(([key,value])=>{localStorage.setItem(key,value);changed.push(key);});
    removals.forEach(key=>{localStorage.removeItem(key);changed.push(key);});
  }catch(error){
    for(const key of [...new Set(changed)].reverse()){
      try{
        const oldValue=previous.get(key);
        if(oldValue===null)localStorage.removeItem(key);
        else localStorage.setItem(key,oldValue);
      }catch(rollbackError){console.error('storage rollback failed',rollbackError);}
    }
    const quotaExceeded=!!(error&&(error.name==='QuotaExceededError'||error.name==='NS_ERROR_DOM_QUOTA_REACHED'||error.code===22));
    window.dispatchEvent(new CustomEvent('storage-write-failed',{detail:{key:changed[changed.length-1],quotaExceeded}}));
    throw error;
  }
}
function removeStorageBatch(keys){
  const previous=new Map(keys.map(key=>[key,localStorage.getItem(key)]));
  const removed=[];
  try{
    keys.forEach(key=>{localStorage.removeItem(key);removed.push(key);});
  }catch(error){
    for(const key of removed.reverse()){
      try{
        const oldValue=previous.get(key);
        if(oldValue!==null)localStorage.setItem(key,oldValue);
      }catch(rollbackError){console.error('storage rollback failed',rollbackError);}
    }
    throw error;
  }
}
function parseDelimitedRows(text){
  const input=String(text||'').replace(/^\uFEFF/,'');
  const firstLine=input.split(/\r?\n/,1)[0]||'';
  const delimiters=[',',';','\t'];
  let delimiter=',',best=-1;
  delimiters.forEach(candidate=>{
    let quoted=false,count=0;
    for(let i=0;i<firstLine.length;i++){
      if(firstLine[i]==='"'){
        if(quoted&&firstLine[i+1]==='"'){i++;continue;}
        quoted=!quoted;
      }else if(firstLine[i]===candidate&&!quoted)count++;
    }
    if(count>best){best=count;delimiter=candidate;}
  });
  if(best<1)throw new Error('O CSV tem de incluir cabeçalhos e colunas separadas por vírgula, ponto e vírgula ou tabulação.');
  const rows=[];
  let row=[],cell='',quoted=false;
  for(let i=0;i<input.length;i++){
    const char=input[i];
    if(char==='"'){
      if(quoted&&input[i+1]==='"'){cell+='"';i++;}
      else quoted=!quoted;
    }else if(char===delimiter&&!quoted){row.push(cell.trim());cell='';}
    else if((char==='\n'||char==='\r')&&!quoted){
      if(char==='\r'&&input[i+1]==='\n')i++;
      row.push(cell.trim());cell='';
      if(row.some(value=>value!==''))rows.push(row);
      row=[];
    }else cell+=char;
  }
  if(quoted)throw new Error('O CSV contém um campo entre aspas incompleto.');
  row.push(cell.trim());
  if(row.some(value=>value!==''))rows.push(row);
  if(rows.length<2)throw new Error('O CSV não contém linhas de dados.');
  const headers=rows.shift().map(value=>value.trim().toLocaleLowerCase('pt-PT').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,''));
  return rows.map((values,index)=>{
    if(values.length!==headers.length)throw new Error(`A linha ${index+2} tem ${values.length} colunas; eram esperadas ${headers.length}.`);
    return Object.fromEntries(headers.map((header,column)=>[header,values[column]]));
  });
}
function parseMarketNumber(value,label){
  let number=String(value??'').trim().replace(/[\s\u00a0€$£]/g,'');
  if(!number)throw new Error(`${label} está vazio.`);
  if(number.includes(',')&&number.includes('.')){
    if(number.lastIndexOf(',')>number.lastIndexOf('.'))number=number.replace(/\./g,'').replace(',','.');
    else number=number.replace(/,/g,'');
  }else if(number.includes(','))number=number.replace(',','.');
  const parsed=Number(number);
  if(!Number.isFinite(parsed))throw new Error(`${label} não é um número válido.`);
  return parsed;
}
function parseBrokerQuoteCsv(text,positions){
  const rows=parseDelimitedRows(text);
  const findHeader=(...names)=>names.map(name=>name.toLowerCase().replace(/[^a-z0-9]/g,'')).find(name=>rows.some(row=>Object.prototype.hasOwnProperty.call(row,name)));
  const tickerHeader=findHeader('ticker','symbol','symbol code','instrument ticker');
  const priceHeader=findHeader('price','last','last price','close','current price','market price','preco');
  const currencyHeader=findHeader('currency','ccy','moeda');
  const dateHeader=findHeader('date','asof','quote date','price date','data');
  const fxHeader=findHeader('eurusd','eur usd','fx eur usd','eurusd rate');
  if(!tickerHeader||!priceHeader||!currencyHeader||!dateHeader)throw new Error('Cabeçalhos obrigatórios em falta: Ticker, Price, Currency e Date (ou Symbol, Last/Close, Currency e AsOf).');
  const byExact=new Map();
  const byNormalized=new Map();
  (positions||[]).filter(position=>position.n>0).forEach(position=>{
    const exact=position.t.toUpperCase();
    byExact.set(exact,[...(byExact.get(exact)||[]),position]);
    const normalized=normTicker(position.t).toUpperCase();
    byNormalized.set(normalized,[...(byNormalized.get(normalized)||[]),position]);
  });
  const latestByTicker=new Map();
  let fxRate=null,fxDate=null,ignored=0;
  rows.forEach((row,index)=>{
    const symbol=String(row[tickerHeader]||'').trim().toUpperCase();
    const price=parseMarketNumber(row[priceHeader],`Preço na linha ${index+2}`);
    const date=String(row[dateHeader]||'').trim();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||Number.isNaN(Date.parse(date))||new Date(date+'T00:00:00Z').toISOString().slice(0,10)!==date){
      throw new Error(`Data inválida na linha ${index+2}; usa o formato YYYY-MM-DD.`);
    }
    if(date>new Date().toISOString().slice(0,10))throw new Error(`A data da cotação na linha ${index+2} está no futuro.`);
    if(!symbol)throw new Error(`Ticker vazio na linha ${index+2}.`);
    if(/^(EURUSD|EUR\/USD|EURUSD=X|FX:EURUSD)$/.test(symbol)){
      if(price<=0)throw new Error(`Taxa EUR/USD inválida na linha ${index+2}.`);
      if(fxRate!==null&&(fxRate!==price||fxDate!==date))throw new Error('O CSV contém valores EUR/USD inconsistentes.');
      fxRate=price;fxDate=date;return;
    }
    if(fxHeader&&String(row[fxHeader]||'').trim()){
      const rowFx=parseMarketNumber(row[fxHeader],`EUR/USD na linha ${index+2}`);
      if(rowFx<=0)throw new Error(`Taxa EUR/USD inválida na linha ${index+2}.`);
      if(fxRate!==null&&fxRate!==rowFx)throw new Error('O CSV contém valores EUR/USD inconsistentes.');
      fxRate=rowFx;fxDate=date;
    }
    if(price<0)throw new Error(`Preço negativo na linha ${index+2}.`);
    let candidates=byExact.get(symbol)||[];
    if(candidates.length===0)candidates=byNormalized.get(normTicker(symbol).toUpperCase())||[];
    if(candidates.length===0){ignored++;return;}
    if(candidates.length!==1)throw new Error(`O ticker ${symbol} não é único na carteira; usa o ticker completo da posição.`);
    const position=candidates[0];
    const currency=String(row[currencyHeader]||'').trim().toUpperCase();
    if(!currency)throw new Error(`Moeda em falta para ${position.t} na linha ${index+2}.`);
    const expectedCurrency=position.cat==='USD'?'USD':'EUR';
    if(currency&&currency!==expectedCurrency)throw new Error(`Moeda ${currency} incorreta para ${position.t}; esperava ${expectedCurrency}.`);
    const quote={ticker:position.t,price,date};
    const previous=latestByTicker.get(position.t);
    if(previous&&(previous.price!==price||previous.date!==date))throw new Error(`O CSV tem cotações duplicadas e diferentes para ${position.t}.`);
    latestByTicker.set(position.t,quote);
  });
  if(latestByTicker.size===0&&fxRate===null)throw new Error('Não foi encontrada nenhuma cotação correspondente à carteira nem uma taxa EUR/USD.');
  return{quotes:[...latestByTicker.values()],fxRate,fxDate,ignored};
}

// ── Shared utility: holding period in fractional years between two date strings ──
// Returns null if either date is missing or invalid (callers must guard).
function calcHoldingYears(entry, exit) {
  if (!entry || !exit) return null;
  const e = new Date(entry), x = new Date(exit);
  if (isNaN(e) || isNaN(x)) return null;
  return (x - e) / (365.25 * 24 * 3600 * 1000);
}

// ── Global scoring function (single source of truth) ─────────────────────────
function calcScore(q){
  // 103 pts total: Payout(10)+ShrYield(8)+Chowder(6)+G3(10)+G5(10)+G10(3)+EPS(8)+Debt(6)+ROIC(14)+FCF(10)+RevGr(10)+OpMar(8)
  function sPy(v){if(v==null)return 0;if(v>0.92)return 0;if(v>0.75)return 3;if(v>0.60)return 6;if(v>0.50)return 8;return 10;}
  function sShrYield(v){if(v==null)return 0;if(v<0.005)return 0;if(v<0.015)return 1;if(v<0.025)return 2;if(v<0.035)return 4;if(v<0.045)return 6;return 8;}
  function sChowder(dy,g5){
    if(dy==null||g5==null)return 0;
    const v=dy+g5;
    if(v<=0.08)return 0;
    if(v<=0.10)return 2;
    if(v<=0.12)return 4;
    if(v<=0.15)return 5;
    return 6;
  }
  function sG3(v){if(v==null)return 0;if(v<0)return 0;if(v<0.02)return 2;if(v<0.05)return 4;if(v<0.08)return 6;if(v<0.12)return 8;return 10;}
  function sG5(v){if(v==null)return 0;if(v<0)return 0;if(v<0.01)return 0;if(v<0.02)return 1;if(v<0.04)return 3;if(v<0.08)return 6;if(v<0.10)return 8;return 10;}
  function sG10(v){if(v==null)return 0;if(v<0)return 0;if(v<0.03)return 1;if(v<0.06)return 2;return 3;}
  function sEps(v){if(v==null)return 0;if(v<0)return 0;if(v<0.02)return 1;if(v<0.05)return 3;if(v<0.10)return 6;return 8;}
  function sDebt(v){if(v==null)return 0;if(v<1.5)return 6;if(v<2.5)return 5;if(v<3.5)return 4;if(v<5.0)return 1;return 0;}
  function sRoic(v){if(v==null)return 0;if(v<0.02)return 1;if(v<0.06)return 3;if(v<0.09)return 5;if(v<0.12)return 7;if(v<0.15)return 9;if(v<0.20)return 11;if(v<0.25)return 13;return 14;}
  function sRevGr(v){if(v==null)return 0;if(v<0)return 0;if(v<0.02)return 1;if(v<0.05)return 3;if(v<0.08)return 5;if(v<0.12)return 7;if(v<0.18)return 9;return 10;}
  function sOpMar(v){if(v==null)return 0;if(v<0.05)return 0;if(v<0.10)return 1;if(v<0.15)return 3;if(v<0.20)return 5;if(v<0.30)return 7;return 8;}
  function sFcf(v){if(v==null)return 0;if(v<0.03)return 1;if(v<0.05)return 3;if(v<0.08)return 6;return 10;}
  return sPy(q.py)+sShrYield((q.dy||0)+(q.buyback||0))+sChowder(q.dy,q.g5)+sG3(q.g3)+sG5(q.g5)+sG10(q.g10)+sEps(q.eps)+sDebt(q.debt)+sRoic(q.roic)+sFcf(q.fcf)+sRevGr(q.revgr)+sOpMar(q.opmar);
}

// Sum all years of income for a single ticker
// Normalise ticker: strip exchange suffix for income/qual lookups
// e.g. AD.AS → AD, COR.LS → COR, DG.PA → DG, SHELL.AS → SHELL
const _normTickerCache=new Map();
function normTicker(ticker){
  if(!ticker)return ticker;
  if(_normTickerCache.has(ticker))return _normTickerCache.get(ticker);
  // Strips common exchange suffixes from Yahoo Finance / broker tickers
  // EU: AS LS PA MC DE MI BE SW L OL ST HE CO
  // Americas: TO V CN MX SA BA
  // Asia-Pacific: AX HK T NS BO KS KQ TWO TW NZ
  // Other: JO SI ME IS
  const result=ticker.replace(/\.(AS|LS|PA|MC|DE|MI|BE|SW|L|OL|ST|HE|CO|TO|V|CN|MX|SA|BA|AX|HK|T|NS|BO|KS|KQ|TWO|TW|NZ|JO|SI|ME|IS)$/i,'');
  _normTickerCache.set(ticker,result);
  return result;
}
// Normalise all keys of an income object (merges e.g. 'NOV.DE' + 'NOV' into one 'NOV' bucket)
function normalizeIncomeKeys(income){
  if(!income)return income;
  const out=Object.create(null);
  Object.entries(income).forEach(([t,years])=>{
    out[t]=Object.assign(Object.create(null),out[t]||{});
    Object.entries(years||{}).forEach(([y,v])=>{ out[t][y]=(out[t][y]||0)+(v||0); });
  });
  attachIncomeTickerLookup(out);
  return out;
}
function attachIncomeTickerLookup(income){
  const candidates=Object.create(null);
  Object.keys(income).forEach(t=>{
    const key=normTicker(t).toUpperCase();
    candidates[key]=[...(candidates[key]||[]),t];
  });
  const lookup=Object.create(null);
  Object.entries(candidates).forEach(([key,tickers])=>{if(tickers.length===1)lookup[key]=tickers[0];});
  Object.defineProperty(income,'__tickerLookup',{value:lookup,configurable:true});
  return income;
}
function incomeByYear(income,ticker){
  if(!income)return null;
  if(Object.prototype.hasOwnProperty.call(income,ticker))return income[ticker];
  const exactKey=income.__tickerLookup?.[normTicker(ticker||'').toUpperCase()];
  return exactKey?income[exactKey]:null;
}
function buildDividendCalendarData(positions,qualMap,fxRate,dividendEvents){
  const today=new Date().toISOString().slice(0,10);
  const months=[
    {name:'Jan',tickers:[]},{name:'Fev',tickers:[]},{name:'Mar',tickers:[]},
    {name:'Abr',tickers:[]},{name:'Mai',tickers:[]},{name:'Jun',tickers:[]},
    {name:'Jul',tickers:[]},{name:'Ago',tickers:[]},{name:'Set',tickers:[]},
    {name:'Out',tickers:[]},{name:'Nov',tickers:[]},{name:'Dez',tickers:[]},
  ];
  let annualEUR=0,scheduledEUR=0;
  const unassigned=[];
  (positions||[]).forEach(position=>{
    if(position.n<=0||position.cv<=0)return;
    const yieldRate=getQual(qualMap,position.t)?.dy||0;
    const annualLocal=yieldRate*position.n*position.cv;
    if(annualLocal<=0)return;
    const isUSD=position.cat==='USD';
    const annualPositionEUR=isUSD?annualLocal/(fxRate||1.08):annualLocal;
    annualEUR+=annualPositionEUR;
    // Real payment months from the dividend dates when known, else divMonths.
    const paymentMonths=paymentMonthsFor(position,dividendEvents?.[position.t]?.events,today);
    if(!paymentMonths.length){
      unassigned.push({ticker:position.t,annualEUR:annualPositionEUR});
      return;
    }
    const localPayment=annualLocal/paymentMonths.length;
    const eurPayment=annualPositionEUR/paymentMonths.length;
    scheduledEUR+=annualPositionEUR;
    paymentMonths.forEach(month=>{
      months[month-1].tickers.push({
        ticker:position.t,amountEUR:eurPayment,
        amountLocal:localPayment,currency:isUSD?'USD':'EUR',
      });
    });
  });
  months.forEach(month=>{
    month.tickers.sort((a,b)=>b.amountEUR-a.amountEUR||a.ticker.localeCompare(b.ticker));
    month.totalEUR=month.tickers.reduce((sum,item)=>sum+item.amountEUR,0);
    month.annualShare=annualEUR>0?month.totalEUR/annualEUR:0;
  });
  return{months,annualEUR,scheduledEUR,unassignedEUR:Math.max(0,annualEUR-scheduledEUR),unassigned};
}

// Build a Map<ticker, qualityObj> for O(1) lookup — indexes both raw and normalised ticker
function buildQualMap(qual){
  const exact={},normalized={},normalizedCandidates={};
  (qual||[]).forEach(q=>{
    exact[q.t.toUpperCase()]=q;
    const key=normTicker(q.t).toUpperCase();
    normalizedCandidates[key]=[...(normalizedCandidates[key]||[]),q];
  });
  Object.entries(normalizedCandidates).forEach(([key,candidates])=>{if(candidates.length===1)normalized[key]=candidates[0];});
  return{exact,normalized};
}
// Also build a reverse map: given a suffixed ticker, find the qual entry
function getQual(qualMap, ticker){
  const exact=qualMap?.exact||{};
  return exact[(ticker||'').toUpperCase()]||qualMap?.normalized?.[normTicker(ticker||'').toUpperCase()];
}
function cleanQuality(q){
  const quality={...q};
  delete quality.yoc;
  delete quality.sc;
  return quality;
}
// Build exact ticker keys and only unambiguous normalized aliases.
function buildPosMap(pos){
  const map=Object.create(null);
  const candidates={};
  (pos||[]).forEach(p=>{
    map[p.t]=p;
    const key=normTicker(p.t).toUpperCase();
    candidates[key]=[...(candidates[key]||[]),p];
  });
  Object.entries(candidates).forEach(([key,positions])=>{
    if(positions.length===1&&!Object.prototype.hasOwnProperty.call(map,key))map[key]=positions[0];
  });
  return map;
}

// ── FIFO Engine ──────────────────────────────────────────────────────────────
// Returns lots remaining, realised P&L per sell tx, and derived n/av
function fifoEngine(transactions){
  if(!transactions||!transactions.length)return{lots:[],sells:[],n:0,av:0};
  const txs=[...transactions].sort((a,b)=>new Date(a.date)-new Date(b.date));
  const lots=[]; // {date, n, price, remaining} — price already includes any buy fee, folded in per-share
  const sells=[]; // {date, n, price, fee, proceeds, costBasis, realPL, lots:[{date,n,price}]}
  txs.forEach(tx=>{
    if(tx.type==='buy'){
      const fee=tx.fee||0;
      const effPrice=tx.n>0?tx.price+fee/tx.n:tx.price;
      // L1 FIX: create fresh lot object — never mutate input data
      lots.push({date:tx.date,n:tx.n,price:effPrice,remaining:tx.n});
    } else if(tx.type==='sell'){
      let toSell=tx.n;
      let costBasis=0;
      const usedLots=[];
      for(const lot of lots){
        if(toSell<=0)break;
        if(lot.remaining<=0)continue;
        const used=Math.min(lot.remaining,toSell);
        lot.remaining-=used;
        toSell-=used;
        costBasis+=used*lot.price;
        usedLots.push({date:lot.date,n:used,price:lot.price});
      }
      const fee=tx.fee||0;
      const proceeds=tx.n*tx.price-fee; // sell fee reduces net proceeds
      sells.push({date:tx.date,n:tx.n,price:tx.price,fee,proceeds,costBasis,realPL:proceeds-costBasis,lots:usedLots});
    }
  });
  // Derive n and av from remaining lots
  let remShares=0,remCost=0;
  lots.forEach(l=>{remShares+=l.remaining;remCost+=l.remaining*l.price;});
  const av=remShares>0?remCost/remShares:0;
  return{lots,sells,n:parseFloat(remShares.toFixed(6)),av:parseFloat(av.toFixed(6))};
}
function getBuyLotSegments(transactions,throughDate){
  const txs=(transactions||[]).map((tx,index)=>({tx,index}))
    .sort((a,b)=>a.tx.date.localeCompare(b.tx.date)||a.index-b.index);
  const lots=[];
  const segments=[];
  txs.forEach(({tx,index})=>{
    if(tx.type==='buy'){
      lots.push({index,start:tx.date,remaining:tx.n});
      return;
    }
    if(tx.type!=='sell')return;
    let toSell=tx.n;
    for(const lot of lots){
      if(toSell<=0)break;
      if(lot.remaining<=0)continue;
      const sold=Math.min(lot.remaining,toSell);
      segments.push({index:lot.index,shares:sold,start:lot.start,end:tx.date});
      lot.remaining-=sold;
      toSell-=sold;
    }
  });
  lots.forEach(lot=>{
    if(lot.remaining>0)segments.push({index:lot.index,shares:lot.remaining,start:lot.start,end:throughDate});
  });
  return segments;
}
function estimateBuyLotHoldingYears(transactions,throughDate){
  const segments=getBuyLotSegments(transactions,throughDate);
  const years=(transactions||[]).map(()=>null);
  const weighted={};
  const shares={};
  segments.forEach(segment=>{
    const duration=calcHoldingYears(segment.start,segment.end);
    if(duration==null||duration<0)return;
    weighted[segment.index]=(weighted[segment.index]||0)+duration*segment.shares;
    shares[segment.index]=(shares[segment.index]||0)+segment.shares;
  });
  Object.keys(weighted).forEach(index=>{
    years[index]=weighted[index]/shares[index];
  });
  return years;
}

function estimateDividendsByBuy(transactions,divByYear,throughDate){
  const estimates=(transactions||[]).map(()=>null);
  const segments=getBuyLotSegments(transactions,throughDate);

  const weightsByYear={};
  Object.entries(divByYear||{}).forEach(([yearText,dividends])=>{
    const year=Number(yearText);
    if(!Number.isInteger(year)||!Number.isFinite(dividends))return;
    const yearStart=new Date(year,0,1);
    const yearEnd=new Date(year+1,0,1);
    const weights={};
    segments.forEach(segment=>{
      const start=new Date(Math.max(new Date(segment.start+'T00:00:00').getTime(),yearStart.getTime()));
      const end=new Date(Math.min(new Date(segment.end+'T00:00:00').getTime(),yearEnd.getTime()));
      const days=Math.max(0,(end-start)/86400000);
      if(days>0)weights[segment.index]=(weights[segment.index]||0)+segment.shares*days;
    });
    const totalWeight=Object.values(weights).reduce((sum,weight)=>sum+weight,0);
    if(totalWeight>0)weightsByYear[year]=Object.entries(weights).map(([index,weight])=>[Number(index),dividends*weight/totalWeight]);
  });

    allocations.forEach(([index,amount])=>{estimates[index]=(estimates[index]||0)+amount;});

// Average cost, computed on the fly from the transaction log (FIFO) — replaces

// Fully-closed positions (0 remaining): weighted avg of every buy, which is
// mathematically identical to the FIFO cost of what was sold (100% of it was).
// Cache keyed by position object reference — auto-invalidates whenever data
// reloads/edits produce a new object (React/JSON always creates a fresh

const _avCache=new WeakMap();
function getAv(p){
  if(!p)return 0;
  if(_avCache.has(p))return _avCache.get(p);
  const fifo=fifoEngine(p?.transactions);
  let result;
  if(fifo.n>0)result=fifo.av;
  else{
    const buys=(p?.transactions||[]).filter(t=>t.type==='buy');
    if(!buys.length)result=p?.av||0;
    else{
      const totN=buys.reduce((s,t)=>s+t.n,0);
      const totCost=buys.reduce((s,t)=>{const fee=t.fee||0;const eff=t.n>0?t.price+fee/t.n:t.price;return s+t.n*eff;},0);
      result=totN>0?totCost/totN:0;

// Portuguese capital-gains tax tiers by holding period (years) — single source of truth.

// exactly the kind of drift that let a currency-conversion bug slip through undetected.
const PT_CG_TAX_TIERS=[{from:0,rate:0.28},{from:2,rate:0.252},{from:5,rate:0.224},{from:8,rate:0.196}];
function cgRateForHoldingBase(years,fallbackRate){
  for(let i=PT_CG_TAX_TIERS.length-1;i>=0;i--){
    if(years>=PT_CG_TAX_TIERS[i].from)return PT_CG_TAX_TIERS[i].rate;

// fxRate: a number (one rate for everything) or a function date→rate (USD per EUR).
// With a function, each USD amount is converted at its own date, as the Portuguese

function buildCapitalGainsEvents(pos,sold,fxRate,taxRate){
  const events=[];
  const fxOn=typeof fxRate==='function'?fxRate:()=>fxRate||1.08;
  const addSale=(position,sale,source)=>{
    const shareCount=sale.n||0;
    if(shareCount<=0||!sale.date)return;
    const isUSD=position.cat==='USD';
    const toEur=(v,date)=>isUSD?v/fxOn(date):v;
    const fallbackBuyDate=position.transactions?.find(tx=>tx.type==='buy')?.date||position.entry;
    let weightedYears=0,positiveGain=0,taxPotential=0;
    let positiveGainEur=0,taxPotentialEur=0,costEur=0;
    const proceedsEur=toEur(sale.proceeds,sale.date);
    const lots=sale.lots||[];
    if(lots.length){
      lots.forEach(lot=>{
        const years=calcHoldingYears(lot.date,sale.date)??0;
        const rateY=cgRateForHoldingBase(years,taxRate);
        weightedYears+=(lot.n/shareCount)*years;
        const lotProceeds=sale.proceeds*(lot.n/shareCount);
        const lotGain=lotProceeds-lot.n*lot.price;
        if(lotGain>0){positiveGain+=lotGain;taxPotential+=lotGain*rateY;}
        const lotCostEur=toEur(lot.n*lot.price,lot.date||fallbackBuyDate);
        costEur+=lotCostEur;

      positiveGain=Math.max(0,sale.realPL);
      taxPotential=positiveGain*cgRateForHoldingBase(weightedYears,taxRate);
      costEur=toEur(sale.costBasis,fallbackBuyDate);
      positiveGainEur=Math.max(0,proceedsEur-costEur);
      taxPotentialEur=positiveGainEur*cgRateForHoldingBase(weightedYears,taxRate);
    }
    const rate=positiveGainEur>0?taxPotentialEur/positiveGainEur:positiveGain>0?taxPotential/positiveGain:cgRateForHoldingBase(weightedYears,taxRate);
    events.push({
      ticker:position.t,name:position.name||position.t,date:sale.date,
      buyDate:lots.length>1?'':lots[0]?.date||fallbackBuyDate,
      n:shareCount,sellPrice:sale.price,avgBuyPrice:sale.costBasis/shareCount,
      proceeds:sale.proceeds,costBasis:sale.costBasis,pl:sale.realPL,
      proceedsEur,costEur,feeEur:toEur(sale.fee||0,sale.date),fxSale:isUSD?fxOn(sale.date):1,
      plEur:proceedsEur-costEur,positiveGainEur,
      taxPotentialEur,taxEur:0,rate,yrs:weightedYears,
      sym:currencySymbol(position.cat),fee:sale.fee||0,fifoLots:lots,source
    });

    if(position.transactions?.length){
      fifoEngine(position.transactions).sells.forEach(sale=>addSale(position,sale,'sold'));

      const proceeds=(position.n||0)*(position.sv||0);

  });

    if(!position.transactions?.length)return;
    fifoEngine(position.transactions).sells.forEach(sale=>addSale(position,sale,'active'));
  });

function applyAnnualCapitalGainsTax(events){
  const byYear={};
  events.forEach(event=>{
    const year=String(event.date||'').slice(0,4);
    if(!/^\d{4}$/.test(year))return;
    if(!byYear[year])byYear[year]={pl:0,positiveGain:0,taxPotential:0};
    byYear[year].pl+=event.plEur;
    byYear[year].positiveGain+=event.positiveGainEur;
    byYear[year].taxPotential+=event.taxPotentialEur;
  });
  const taxByYear={};
  Object.entries(byYear).forEach(([year,totals])=>{
    const lossOffsetRatio=totals.positiveGain>0?Math.min(1,Math.max(0,totals.pl)/totals.positiveGain):0;
    taxByYear[year]=totals.taxPotential*lossOffsetRatio;
  });

    const year=String(event.date||'').slice(0,4);
    const totals=byYear[year];
    const ratio=totals?.taxPotential>0?taxByYear[year]/totals.taxPotential:0;
    return{...event,taxEur:event.taxPotentialEur*ratio};
  });

// pct/d (svg path)/mid added, in the given order (caller pre-sorts).

    ['n','cv','av','sv','div'].forEach(key=>{
      if(position[key]!==undefined&&(!Number.isFinite(position[key])||position[key]<0)){
        throw new Error(`${label}[${index}].${key} deve ser um número finito não negativo.`);
      }
    });
    if(position.transactions!==undefined){
      if(!Array.isArray(position.transactions))throw new Error(`Transacções inválidas em ${position.t}.`);
      const historyError=validateTransactionHistory(position.transactions);
      if(historyError)throw new Error(`${position.t}: ${historyError}`);
    }
  });
  return value;
}
function validateTransactionHistory(transactions){
  if(!Array.isArray(transactions))return'A lista de transacções é inválida.';
  const ordered=(transactions||[]).map((transaction,index)=>({transaction,index}))
    .sort((a,b)=>String(a.transaction?.date??'').localeCompare(String(b.transaction?.date??''))||a.index-b.index);
  let availableShares=0;
  for(const{transaction:tx,index}of ordered){
    if(!tx||typeof tx!=='object'||Array.isArray(tx)||!['buy','sell'].includes(tx.type)||typeof tx.date!=='string'||
       !/^\d{4}-\d{2}-\d{2}$/.test(tx.date)||Number.isNaN(Date.parse(tx.date))||
       new Date(tx.date+'T00:00:00Z').toISOString().slice(0,10)!==tx.date||
       !Number.isFinite(tx.n)||tx.n<=0||!Number.isFinite(tx.price)||tx.price<0||
       (tx.fee!==undefined&&(!Number.isFinite(tx.fee)||tx.fee<0))||
       (tx.broker!==undefined&&typeof tx.broker!=='string')){
      return`A transacção ${index+1} tem data ou valores inválidos.`;
    }
    if(tx.type==='buy')availableShares+=tx.n;
    else{
      if(tx.n>availableShares+0.000001)return`A venda de ${tx.date} excede as acções disponíveis.`;
      availableShares-=tx.n;
    }
  }
  return null;
}
function validateImportedQuality(value){
  if(!Array.isArray(value))throw new Error('quality deve ser uma lista.');
  const metrics=['py','dy','buyback','g3','g5','g10','eps','debt','roic','fcf','revgr','opmar'];
  value.forEach((item,index)=>{
    requireJsonRecord(item,`quality[${index}]`);
    if(typeof item.t!=='string'||!item.t.trim())throw new Error(`quality[${index}] não tem ticker.`);
    metrics.forEach(key=>{
      if(item[key]!==undefined&&item[key]!==null&&!Number.isFinite(item[key])){
        throw new Error(`quality[${index}].${key} deve ser numérico.`);
      }
    });
  });
  return value;
}
function validateImportedIncome(value){
  requireJsonRecord(value,'income');
  Object.entries(value).forEach(([ticker,years])=>{
    if(!ticker.trim())throw new Error('income contém um ticker vazio.');
    requireJsonRecord(years,`income.${ticker}`);
    Object.entries(years).forEach(([year,amount])=>{
      if(!/^\d{4}$/.test(year)||!Number.isFinite(amount)){
        throw new Error(`income.${ticker}.${year} deve conter um ano e um valor numérico.`);
      }
    });
  });
  return value;
}
function validateImportedConfig(value){
  requireJsonRecord(value,'config');
  Object.entries(DCFG).forEach(([key,defaultValue])=>{
    if(!Object.prototype.hasOwnProperty.call(value,key))return;
    const imported=value[key];
    if(typeof defaultValue==='number'&&!Number.isFinite(imported))throw new Error(`${key} deve ser numérico.`);
    if(typeof defaultValue==='string'&&typeof imported!=='string')throw new Error(`${key} deve ser texto.`);
    if(Array.isArray(defaultValue)&&!Array.isArray(imported))throw new Error(`${key} deve ser uma lista.`);
    if(defaultValue&&typeof defaultValue==='object'&&!Array.isArray(defaultValue)&&
       (!imported||typeof imported!=='object'||Array.isArray(imported))){
      throw new Error(`${key} deve ser um objecto.`);
    }
  });
  if(!Object.keys(DCFG).some(key=>Object.prototype.hasOwnProperty.call(value,key)))throw new Error('Não foram encontrados campos de configuração.');
  return value;
}
function validateImportedWealth(value){
  requireJsonRecord(value,'wealth');
  if(!['ppr','aforro','depositos','juros'].some(key=>Object.prototype.hasOwnProperty.call(value,key))&&!Object.keys(value).some(isInvestmentKey))throw new Error('Não foram encontrados dados de património.');
  ['ppr','aforro','depositos','juros'].forEach(key=>{
    if(value[key]!==undefined&&!Array.isArray(value[key]))throw new Error(`${key} deve ser uma lista.`);
  });
  return value;
}
function validateImportedTheses(value){
  requireJsonRecord(value,'teses');
  // exportTesesJSON writes `version` and `exportedAt` next to the tickers; they are not theses.
  const out={};
  Object.entries(value).forEach(([ticker,thesis])=>{
    if(ticker==='version'||ticker==='exportedAt')return;
    requireJsonRecord(thesis,`tese de ${ticker}`);
    out[ticker]=thesis;
  });
  return out;
}
function validateValuationHistory(value){
  if(!Array.isArray(value))throw new Error('O histórico de avaliações deve ser uma lista.');
  value.forEach((item,index)=>{
    requireJsonRecord(item,`avaliação ${index+1}`);
    if(typeof item.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(item.date)||
       !Number.isFinite(item.totalValueEUR)||!Number.isFinite(item.fxEurUsd)||item.fxEurUsd<=0){
      throw new Error(`A avaliação ${index+1} tem dados inválidos.`);
    }
  });
  return value;
}

// ── Data file: income-factory.json ──────────────────────────────────────────
// All app data travels in one versioned file. To add a new kind of data:
//   1. add a key to emptyDataset() and to buildDataFile(),
//   2. read it in readDataFileV2() (and in any older reader if it has a default),
//   3. store it in the app's applyDataset().
// If the shape of an existing section changes, bump DATA_SCHEMA_VERSION and add
// a step to DATA_MIGRATIONS that converts the previous version, so old files keep importing.
const DATA_FILE_APP='income-factory';
const DATA_SCHEMA_VERSION=2;
const DATA_MIGRATIONS={
  // 2: { ... } → 3: { ... }   e.g. 2:file=>({...file,schemaVersion:3,newSection:[]})
};
function emptyDataset(){
  return{positions:[],sold:[],quality:[],config:{...DCFG},wealth:null,theses:null,valuations:[]};
}
// Active and closed positions are kept apart in the app and joined in the file;
// closed ones carry status:'sold' in the file only. Every other field is kept as is.
function joinPortfolio(pos,sold){
  return[...(pos||[]).map(p=>({...p})),...(sold||[]).map(p=>({...p,status:'sold'}))];
}
function splitPortfolio(positions){
  return{
    positions:positions.filter(p=>p.status!=='sold'),
    sold:positions.filter(p=>p.status==='sold').map(({status,...p})=>p),
  };
}
function buildDataFile({pos,sold,qual,cfg,wealth,teses,valuations,priceKeys}){
  const keys=Object.fromEntries(Object.entries(priceKeys||{}).filter(([,v])=>v));
  return{
    app:DATA_FILE_APP,schemaVersion:DATA_SCHEMA_VERSION,exportedAt:new Date().toISOString(),
    portfolio:{positions:joinPortfolio(pos,sold)},
    quality:(qual||[]).map(cleanQuality),
    config:cfg||DCFG,
    wealth:wealth||null,
    theses:teses||null,
    history:{valuations:valuations||[]},
    // Only when "Incluir as chaves no ficheiro" is ticked in Config → Cotações online.
    ...(Object.keys(keys).length?{secrets:{priceKeys:keys}}:{}),
  };
}
function readPriceKeysSection(secrets){
  if(secrets==null)return undefined;
  const keys=requireJsonRecord(secrets,'secrets').priceKeys;
  if(keys==null)return undefined;
  requireJsonRecord(keys,'secrets.priceKeys');
  const out={};
  Object.entries(keys).forEach(([id,key])=>{
    if(!PRICE_PROVIDERS[id])return;
    if(typeof key!=='string')throw new Error(`secrets.priceKeys.${id} deve ser texto.`);
    if(key.trim())out[id]=key.trim();
  });
  return out;
}
function readDataFileV2(file){
  const portfolio=requireJsonRecord(file.portfolio||{positions:[]},'portfolio');
  const{positions,sold}=splitPortfolio(validateImportedPositions(portfolio.positions||[],'portfolio.positions'));
  return{
    positions,sold,
    quality:validateImportedQuality(file.quality||[]),
    config:file.config?validateImportedConfig(file.config):{...DCFG},
    wealth:file.wealth==null?null:validateImportedWealth(file.wealth),
    theses:file.theses==null?null:validateImportedTheses(file.theses),
    valuations:validateValuationHistory(file.history?.valuations||[]),
    priceKeys:readPriceKeysSection(file.secrets),
  };
}
// Old "Backup completo" (type income-factory-full-backup, version 1).
function readFullBackupV1(backup){
  if(backup.version!==1)throw new Error('Versão de backup não suportada.');
  return{
    positions:validateImportedPositions(backup.positions,'positions'),
    sold:validateImportedPositions(backup.sold,'sold'),
    quality:validateImportedQuality(backup.quality),
    config:validateImportedConfig(backup.config),
    wealth:backup.wealth===null?null:validateImportedWealth(backup.wealth),
    theses:backup.teses===null?null:validateImportedTheses(backup.teses),
    valuations:validateValuationHistory(backup.valuationHistory),
  };
}
// Old portfolio.json: positions[] (closed ones with status:'sold' or n:0) and/or sold[].
function readLegacyPortfolio(data){
  if(data.positions!==undefined)validateImportedPositions(data.positions,'positions');
  if(data.sold!==undefined)validateImportedPositions(data.sold,'sold');
  if(!data.positions)return{positions:undefined,sold:data.sold};
  const allPos=data.positions.map(({dv,...r})=>r);
  const hasNewFormat=allPos.some(p=>p.status==='sold'||p.transactions);
  if(!hasNewFormat)return{positions:allPos,sold:data.sold||[]};
  const active=allPos.filter(p=>p.status!=='sold'&&(p.n==null||p.n>0));
  const closed=allPos.filter(p=>p.status==='sold'||p.n===0);
  const soldBuilt=closed.map(p=>{
    const fi=fifoEngine(p.transactions||[]);
    const lastSell=fi.sells.length?fi.sells[fi.sells.length-1]:null;
    const entry=p.transactions?.find(t=>t.type==='buy')?.date||'';
    const exit=lastSell?.date||'';
    const totalBought=p.transactions?.filter(t=>t.type==='buy').reduce((s,t)=>s+t.n,0)||0;
    return{
      t:p.t,cat:p.cat,sec:p.sec||'',name:p.name||p.t,country:p.country||'',
      n:totalBought,sv:lastSell?.price||p.sv||0,
      div:p.div||0,divByYear:p.divByYear||{},
      entry,exit,note:p.note||'',transactions:p.transactions||[],
    };
  });
  const explicitSold=(data.sold||[]).filter(s=>!soldBuilt.find(x=>x.t===s.t));
  return{positions:active,sold:[...soldBuilt,...explicitSold]};
}
const WEALTH_KEYS=['ppr','aforro','depositos','juros'];
// An old teses.json is an object of theses; each one has at least one of these sections
// ('business' is no longer shown but still identifies older files).
const THESIS_FIELDS=['name','meta','thesis','business','moat','dividends','financials','keyPhrase','finalDecision','swot'];
function looksLikeThesis(entry){return hasAnyKey(entry,THESIS_FIELDS);}
function hasAnyKey(obj,keys){return keys.some(key=>Object.prototype.hasOwnProperty.call(obj,key));}
// Reads any file the app has ever exported. Returns {kind, data} where data holds
// only the sections that file contains. kind 'full' replaces everything on import.
function readDataFile(json,fileName){
  const file=requireJsonRecord(json,fileName);
  if(file.app===DATA_FILE_APP){
    let version=file.schemaVersion,current=file;
    if(!Number.isInteger(version))throw new Error(`${fileName}: schemaVersion em falta.`);
    if(version>DATA_SCHEMA_VERSION)throw new Error(`${fileName} foi criado por uma versão mais recente da app. Actualiza a app e tenta de novo.`);
    while(version<DATA_SCHEMA_VERSION){
      const step=DATA_MIGRATIONS[version];
      if(!step)throw new Error(`${fileName}: não sei converter a versão ${version}.`);
      current=step(current);version=current.schemaVersion;
    }
    return{kind:'full',data:readDataFileV2(current)};
  }
  if(file.type==='income-factory-full-backup')return{kind:'full',data:readFullBackupV1(file)};
  // Old single-section files (portfolio / metrics / config / wealth / teses .json).
  const data={};
  if(file.positions!==undefined||file.sold!==undefined){
    const p=readLegacyPortfolio(file);
    if(p.positions!==undefined)data.positions=p.positions;
    if(p.sold!==undefined)data.sold=p.sold;
  }else if(file.quality!==undefined||file.income!==undefined){
    if(file.quality!==undefined)data.quality=validateImportedQuality(file.quality);
    if(file.income!==undefined)data.legacyIncome=normalizeIncomeKeys(validateImportedIncome(file.income));
  }else if(hasAnyKey(file,Object.keys(DCFG))){
    const{version,exportedAt,...cfg}=file;
    data.config=validateImportedConfig(cfg);
  }else if(hasAnyKey(file,WEALTH_KEYS)||Object.keys(file||{}).some(isInvestmentKey)){
    const{version,exportedAt,...w}=file;
    data.wealth=validateImportedWealth(w);
  }else{
    const theses=validateImportedTheses(file);
    const entries=Object.values(theses);
    if(!entries.length||!entries.every(looksLikeThesis))throw new Error(`${fileName}: não reconheço este ficheiro.`);
    data.theses=theses;
  }
  return{kind:'partial',data,fileName};
}
// Combines several files picked together. One full file can be combined with
// old single-section files; those then override its sections.
function combineDataFiles(results){
  const fulls=results.filter(r=>r.kind==='full');
  if(fulls.length>1)throw new Error('Escolhe só um ficheiro income-factory.json de cada vez.');
  const data=fulls.length?{...fulls[0].data}:{};
  const seen={};
  results.filter(r=>r.kind==='partial').forEach(r=>{
    Object.keys(r.data).forEach(key=>{
      if(seen[key])throw new Error(`${seen[key]} e ${r.fileName} têm os mesmos dados (${key}). Escolhe só um deles.`);
      seen[key]=r.fileName;
    });
    Object.assign(data,r.data);
  });
  return{full:fulls.length>0,data};
}
// Older metrics.json files carried dividends per ticker; they now live on each position's divByYear.
function mergeLegacyIncome(positions,legacyIncome){
  return positions.map(p=>{
    if(p.divByYear)return p;
    const byYear=incomeByYear(legacyIncome,p.t);
    if(!byYear)return p;
    const filtered=Object.fromEntries(Object.entries(byYear).filter(([,v])=>v));
    if(!Object.keys(filtered).length)return p;
    return{...p,divByYear:filtered,div:Object.values(filtered).reduce((s,v)=>s+v,0)};
  });
}
function normalizeConfig(config){
  const merged={...DCFG,...config};
  ['whtByCountry','posCountry','etfTer'].forEach(k=>{
    if(!merged[k]||Object.keys(merged[k]).length===0)merged[k]=DCFG[k];
  });
  return merged;
}
// In the installed app on iPhone/iPad a plain download is unreliable, so the
// file goes to the share sheet ("Guardar em Ficheiros"). Elsewhere it downloads.
// Must be called directly from a click: navigator.share needs the user gesture.
function saveJsonFile(data,filename){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const standalone=(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
  const ios=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(standalone&&ios&&navigator.canShare&&typeof File==='function'){
    const file=new File([blob],filename,{type:'application/json'});
    if(navigator.canShare({files:[file]})){
      return navigator.share({files:[file],title:filename}).then(()=>'shared',error=>{
        if(error&&error.name==='AbortError')return'cancelled';
        downloadBlob(blob,filename);return'downloaded';
      });
    }
  }
  downloadBlob(blob,filename);
  return Promise.resolve('downloaded');
}
function openFilesPicker(accept,cb){
  const inp=document.createElement('input');inp.type='file';inp.accept=accept;inp.multiple=true;
  inp.onchange=e=>{const files=[...e.target.files];if(files.length)cb(files);};inp.click();
}

// ── Live prices and exchange rates ──────────────────────────────────────────
// EUR reference rates published by the European Central Bank (via Frankfurter:
// free, no key, allows browser requests).
const ECB_FX_URLS=['https://api.frankfurter.dev/v1/latest?base=EUR','https://api.frankfurter.app/latest?from=EUR'];
async function fetchEcbRates(){
  let lastError=null;
  for(const url of ECB_FX_URLS){
    try{
      const res=await fetch(url);
      if(!res.ok)throw new Error('HTTP '+res.status);
      const json=await res.json();
      if(!json||!json.rates||!Number.isFinite(json.rates.USD)||!/^\d{4}-\d{2}-\d{2}$/.test(json.date||''))throw new Error('resposta inesperada');
      return{date:json.date,rates:{...json.rates,EUR:1}};
    }catch(error){lastError=error;}
  }
  throw new Error('Não foi possível obter as taxas do BCE ('+(lastError?.message||'sem rede')+').');
}
// Daily EUR/USD history (cfg.fxHistory.rates: { "YYYY-MM-DD": USD per 1 EUR }).
// on(date): rate of that day or the last one before it (weekends, holidays);
// avg('YYYY' | 'YYYY-MM'): average of the period. Falls back to cfg.fxEurUsd.
function makeFxLookup(cfg){
  const rates=cfg?.fxHistory?.rates||{};
  const dates=Object.keys(rates).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)&&rates[d]>0).sort();
  const fallback=cfg?.fxEurUsd||1.08;
  const on=date=>{
    if(!date||!dates.length)return fallback;
    let lo=0,hi=dates.length-1,ans=-1;
    while(lo<=hi){const m=(lo+hi)>>1;if(dates[m]<=date){ans=m;lo=m+1;}else hi=m-1;}
    return ans>=0?rates[dates[ans]]:rates[dates[0]];
  };
  const cache={};
  const avg=period=>{
    if(cache[period]!=null)return cache[period];
    const vs=dates.filter(d=>d.startsWith(period)).map(d=>rates[d]);
    return cache[period]=vs.length?vs.reduce((a,b)=>a+b,0)/vs.length:on(period.length===4?period+'-12-31':period+'-31');
  };
  return{on,avg,fallback,count:dates.length,from:dates[0]||null,to:dates[dates.length-1]||null};
}
// All ECB EUR/USD reference rates from `start` (YYYY-MM-DD) to today, as { date: rate }.
async function fetchEcbHistory(start){
  const urls=[`https://api.frankfurter.dev/v1/${start}..?base=EUR&symbols=USD`,`https://api.frankfurter.app/${start}..?from=EUR&to=USD`];
  let lastError=null;
  for(const url of urls){
    try{
      const res=await fetch(url);
      if(!res.ok)throw new Error('HTTP '+res.status);
      const json=await res.json();
      const out={};
      Object.entries(json?.rates||{}).forEach(([d,r])=>{if(/^\d{4}-\d{2}-\d{2}$/.test(d)&&Number.isFinite(r?.USD))out[d]=r.USD;});
      if(!Object.keys(out).length)throw new Error('sem dados');
      return out;
    }catch(error){lastError=error;}
  }
  throw new Error('Não foi possível obter o histórico do BCE ('+(lastError?.message||'sem rede')+').');
}
// First date the app needs a rate for: earliest transaction, or 2019-01-01.
function earliestDataDate(pos,sold){
  const ds=[...(pos||[]),...(sold||[])].flatMap(p=>(p.transactions||[]).map(t=>t.date)).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d||'')).sort();
  return ds[0]||'2019-01-01';
}
// Exchanges, keyed by the Yahoo-style suffix used in tickers (NN.AS, COR.LS, ...).
// mic = ISO market code (Twelve Data), av = Alpha Vantage suffix.
// (EODHD was tried and left out: it does not allow requests from a browser.)
const PRICE_EXCHANGES={
  US:{name:'EUA',currency:'USD',mic:null,av:''},
  L: {name:'Londres',currency:'GBp',mic:'XLON',av:'.LON'},
  AS:{name:'Amesterdão',currency:'EUR',mic:'XAMS',av:'.AMS'},
  LS:{name:'Lisboa',currency:'EUR',mic:'XLIS',av:'.LIS'},
  MI:{name:'Milão',currency:'EUR',mic:'XMIL',av:'.MIL'},
  DE:{name:'Xetra',currency:'EUR',mic:'XETR',av:'.DEX'},
  F: {name:'Frankfurt',currency:'EUR',mic:'XFRA',av:'.FRK'},
  BE:{name:'Berlim',currency:'EUR',mic:'XBER',av:'.BER'},
  PA:{name:'Paris',currency:'EUR',mic:'XPAR',av:'.PAR'},
  MC:{name:'Madrid',currency:'EUR',mic:'XMAD',av:'.MAD'},
  CO:{name:'Copenhaga',currency:'DKK',mic:'XCSE',av:'.CPH'},
};
// Symbol used to ask for a price. Tickers without suffix are US listings, except
// non-USD British positions (e.g. LGEN), which trade in London.
function defaultPriceSymbol(position){
  const m=/\.([A-Z]{1,2})$/.exec(position.t);
  if(m&&PRICE_EXCHANGES[m[1]])return position.t;
  if(position.cat!=='USD'&&position.country==='🇬🇧')return position.t+'.L';
  return position.t;
}
function parsePriceSymbol(symbol){
  const m=/^(.+)\.([A-Z]{1,2})$/.exec(symbol.trim());
  if(m&&PRICE_EXCHANGES[m[2]])return{base:m[1],code:m[2],exchange:PRICE_EXCHANGES[m[2]]};
  return{base:symbol.trim(),code:'US',exchange:PRICE_EXCHANGES.US};
}
function positionCurrency(position){return position.cat==='USD'?'USD':'EUR';}
// Converts a price between currencies with EUR-based rates. Pence (GBp/GBX) become pounds first.
function convertPrice(price,from,to,rates){
  let amount=price,currency=String(from||'').trim();
  if(/^(GBp|GBX|GBx)$/.test(currency)){amount=amount/100;currency='GBP';}
  currency=currency.toUpperCase();
  if(currency===to)return amount;
  const rate=code=>{
    if(code==='EUR')return 1;
    if(!rates||!Number.isFinite(rates[code]))throw new Error(`Sem taxa de câmbio para ${code}.`);
    return rates[code];
  };
  return amount/rate(currency)*rate(to);
}
const enc=encodeURIComponent;
const PRICE_PROVIDERS={
  twelvedata:{
    name:'Twelve Data',site:'twelvedata.com',delayMs:8000,dailyLimit:800,
    note:'Grátis: 8 pedidos/minuto, 800/dia, só bolsas dos EUA (bolsas europeias exigem plano pago). Devolve a moeda de cada cotação.',
    url:(s,key)=>`https://api.twelvedata.com/quote?symbol=${enc(s.base)}${s.exchange.mic?'&mic_code='+s.exchange.mic:''}&apikey=${enc(key)}`,
    parse:json=>{
      if(json.status==='error'||json.code){
        const m=json.message||'erro do fornecedor';
        throw new Error(/plan|upgrad/i.test(m)?'Só disponível em plano pago deste fornecedor.':m);
      }
      return{price:parseFloat(json.close),date:String(json.datetime||'').slice(0,10),currency:json.currency||null};
    },
  },
  alphavantage:{
    name:'Alpha Vantage',site:'alphavantage.co',delayMs:12500,dailyLimit:25,
    note:'Grátis: 5 pedidos/minuto, 25/dia (~12 s por ticker). Usado só para bolsas europeias: Londres (.L), Xetra (.DE), Frankfurt (.F), Amesterdão (.AS) e Lisboa (.LS); Paris, Milão e Madrid não. As acções dos EUA ficam para o Twelve Data e o Finnhub, para não gastar os 25 pedidos diários.',
    // US listings deliberately left out: Twelve Data and Finnhub price them, and the
    // free plan's 25 requests/day are kept for European tickers.
    exchanges:['L','DE','F','AS','LS'],
    url:(s,key)=>`https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=${enc(s.base+s.exchange.av)}&apikey=${enc(key)}`,
    parse:json=>{

// A price counts as live when it came from an online provider and is at most

  const source=online?position.cvSource:position.cvSource==='manual'?'introduzido à mão':position.cvSource==='csv'?'CSV do broker':'origem desconhecida';
  const when=asOf?`de ${asOf}${age!==null?` (${age} dia${age===1?'':'s'})`:''}`:'sem data';

// Current price for tickers held outside the portfolio (wealth.<owner>Investimentos

function referencePrice(ticker,pos,cfg){
  const p=(pos||[]).find(x=>x.t===ticker&&x.cv>0);
  if(p)return{cv:p.cv,cvAsOf:p.cvAsOf||null,cvSource:p.cvSource||null};
  const r=cfg?.refPrices?.[ticker];
  return r&&r.cv>0?{cv:r.cv,cvAsOf:r.asOf||null,cvSource:r.source||null}:null;
}
// Tickers held in wealth sections (…Investimentos) that are not active positions.
function referenceTickers(wealth,pos,cfg){

  const out=new Set(Object.keys(cfg?.refPrices||{}));
  Object.entries(wealth||{}).forEach(([key,section])=>{
    if(/Investimentos$/.test(key)&&Array.isArray(section?.investimentos))section.investimentos.forEach(r=>{if(r&&r.ticker)out.add(r.ticker);});

// Wealth sections holding lots bought outside the main portfolio, and their owner.
// Any wealth key ending in "Investimentos" (e.g. "anaInvestimentos") is one owner's
// section; the owner defaults to the capitalised prefix, or section.owner / section.label.
const isInvestmentKey=key=>/^[a-z][A-Za-z0-9]*Investimentos$/.test(key);
const INVESTMENT_COLORS=['#f472b6','#fbbf24','#34d399','#60a5fa','#c084fc'];
function wealthInvestments(wealth){

    const prefix=key.slice(0,-'Investimentos'.length);

// One lot: units = invested / purchase price; current value needs a price
// (referencePrice). Without a price the value falls back to the amount invested.
function investmentLot(r,pos,cfg){
  const ref=referencePrice(r.ticker,pos,cfg);
  const cv=ref?.cv??null;
  const units=r.precoCompra&&r.valorInvestido?r.valorInvestido/r.precoCompra:null;
  const currentVal=units&&cv?units*cv:null;
  const pl=currentVal!=null?currentVal-r.valorInvestido:null;
  const plp=pl!=null&&r.valorInvestido?pl/r.valorInvestido:null;
  return{ref,cv,units,currentVal,value:currentVal??(r.valorInvestido||0),pl,plp};
}
function investmentsSummary(items,pos,cfg){
  return(items||[]).reduce((acc,r)=>{
    const lot=investmentLot(r,pos,cfg);

    return acc;
  },{value:0,cost:0,pl:0});
}

async function fetchMonthlyAdjusted(symbol,key){
  const res=await fetch(`https://www.alphavantage.co/query?function=TIME_SERIES_MONTHLY_ADJUSTED&symbol=${enc(symbol)}&apikey=${enc(key)}`);
  if(!res.ok)throw new Error('HTTP '+res.status);
  const json=await res.json();
  const info=json.Note||json.Information||json['Error Message'];
  if(info)throw new Error(maskKey(/rate limit|requests per/i.test(info)?RATE_LIMIT_MESSAGE:String(info).slice(0,100),key));
  const ts=json['Monthly Adjusted Time Series'];
  if(!ts)throw new Error('Resposta sem série mensal para '+symbol+'.');
  return Object.entries(ts).map(([date,v])=>({date,adj:parseFloat(v['5. adjusted close'])}))
    .filter(x=>Number.isFinite(x.adj)&&x.adj>0).sort((a,b)=>a.date.localeCompare(b.date));
}
// Calendar-year total returns from month-end adjusted closes; the current year is "YYYY YTD".
function yearlyReturns(series,startYear){
  const lastOf=y=>{const pts=series.filter(x=>x.date.startsWith(String(y)));return pts.length?pts[pts.length-1]:null;};
  const last=series[series.length-1];
  const lastYear=parseInt(last.date.slice(0,4));
  const out={};
  for(let y=startYear;y<=lastYear;y++){
    const prev=lastOf(y-1),cur=lastOf(y);
    if(!prev||!cur)continue;
    out[y===CUR_YEAR?y+' YTD':String(y)]=Math.round((cur.adj/prev.adj-1)*10000)/10000;
  }
  return{byYear:out,asOf:last.date};
}
// The API key is kept only in this browser: never in the data file, the config or the code.
const PRICE_KEY_PREFIX='if_pricekey_';
function readPriceKey(provider){try{return localStorage.getItem(PRICE_KEY_PREFIX+provider)||'';}catch(e){return'';}}
function writePriceKey(provider,key){
  try{if(key)localStorage.setItem(PRICE_KEY_PREFIX+provider,key);else localStorage.removeItem(PRICE_KEY_PREFIX+provider);}
  catch(e){console.error('save price key failed',e);}
}
const RATE_LIMIT_MESSAGE='Limite de pedidos atingido.';
// Providers sometimes echo the API key in their messages; never show it.
function maskKey(message,key){return key&&key.length>3?String(message).split(key).join('•••'):String(message);}
async function fetchQuote(providerId,symbol,key){
  try{return await fetchQuoteRaw(providerId,symbol,key);}
  catch(error){throw new Error(maskKey(error.message,key));}
}
async function fetchQuoteRaw(providerId,symbol,key){
  const provider=PRICE_PROVIDERS[providerId];
  const s=parsePriceSymbol(symbol);
  let res;
  try{res=await fetch(provider.url(s,key));}
  catch(e){throw new Error('Pedido bloqueado pelo browser ou sem rede.');}
  let json=null;
  try{json=await res.json();}catch(e){if(res.ok)throw new Error('Resposta inválida do fornecedor.');}
  if(!res.ok){
    const detail=json&&(json.message||json.error||json.Information||json.Note);
    // Providers answer tickers outside the free plan with 403/404 plus an explanation.
    if(detail&&/plan|upgrad|subscri|premium|access/i.test(detail))throw new Error('Só disponível em plano pago deste fornecedor.');
    if(res.status===401||res.status===403)throw new Error('Sem acesso: chave inválida ou ticker fora do plano.');
    if(res.status===404)throw new Error(detail?'Não encontrado: '+String(detail).slice(0,80):'Símbolo não encontrado.');
    if(res.status===429)throw new Error(RATE_LIMIT_MESSAGE);
    throw new Error('Erro HTTP '+res.status+(detail?': '+String(detail).slice(0,80):'.'));
  }
  const quote=provider.parse(json||{});
  if(!Number.isFinite(quote.price)||quote.price<=0)throw new Error('Preço inválido.');
  return{...quote,currency:quote.currency||s.exchange.currency};
}

// cfg.dividendEvents = { TICKER: { fetchedAt, events:[{ex,pay,amount}] } }, amount per share
// in the listing currency. Only US listings are covered by the free plan.
const DIV_EVENTS_SINCE='2019-01-01';
async function fetchDividendEvents(symbol,key){
  const res=await fetch(`https://www.alphavantage.co/query?function=DIVIDENDS&symbol=${enc(symbol)}&apikey=${enc(key)}`);
  if(!res.ok)throw new Error('HTTP '+res.status);
  const json=await res.json();
  const info=json.Note||json.Information||json['Error Message'];
  if(info)throw new Error(maskKey(/rate limit|requests per/i.test(info)?RATE_LIMIT_MESSAGE:String(info).slice(0,100),key));
  const iso=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||'')?v:null;
  return(json.data||[]).map(e=>({ex:iso(e.ex_dividend_date),pay:iso(e.payment_date),amount:parseFloat(e.amount)}))
    .filter(e=>e.ex&&e.ex>=DIV_EVENTS_SINCE&&Number.isFinite(e.amount)&&e.amount>0)
    .sort((a,b)=>a.ex.localeCompare(b.ex));
}
const payDate=e=>e.pay||e.ex;
// Payment months seen in the 12 months up to `date`, from the events (or divMonths).
function paymentMonthsFor(p,events,date){
  if(events&&events.length){
    const from=String(parseInt(date.slice(0,4))-1)+date.slice(4);
    const ms=[...new Set(events.filter(e=>payDate(e)>from&&payDate(e)<=date).map(e=>parseInt(payDate(e).slice(5,7))))];
    if(ms.length)return ms.sort((a,b)=>a-b);
  }

}
// "Actualizar datas": real dividend dates and amounts per share for the active US
// positions (Alpha Vantage), stored in cfg.dividendEvents and used by the dividend calendar.
function DividendDatesButton({pos,cfg,setCfg}){
  const[status,setStatus]=useState(null);
  const cancel=useRef(false);
  useEffect(()=>()=>{cancel.current=true;},[]);
  // Active US tickers whose dates are missing or older than 30 days.
  const toFetch=()=>{
    const today=new Date();
    const stale=t=>{const f=cfg?.dividendEvents?.[t]?.fetchedAt;return!f||(today-new Date(f))/86400000>30;};
    const isUS=p=>p.cat==='USD'&&parsePriceSymbol((cfg?.priceSymbols||{})[p.t]||defaultPriceSymbol(p)).code==='US';
    return[...new Set((pos||[]).filter(p=>(p.n==null||p.n>0)&&isUS(p)&&stale(p.t)).map(p=>p.t))];
  };
  const refresh=async()=>{
    const key=readPriceKey('alphavantage');
    if(!key){setStatus({error:true,text:'Falta a chave do Alpha Vantage (Config → Cotações online).'});return;}
    const list=toFetch().slice(0,20);
    if(!list.length){setStatus({text:'Datas já actualizadas.'});return;}
    cancel.current=false;
    const got={};let done=0,errorMsg=null;
    for(let i=0;i<list.length&&!cancel.current;i++){
      const t=list[i];
      if(i>0)await new Promise(r=>setTimeout(r,13000));
      if(cancel.current)break;
      setStatus({loading:true,text:`A obter datas de ${t} (${i+1}/${list.length})…`});
      try{got[t]={fetchedAt:new Date().toISOString().slice(0,10),events:await fetchDividendEvents(t,key)};done++;}
      catch(e){errorMsg=e.message;if(e.message===RATE_LIMIT_MESSAGE)break;}
    }
    if(done)setCfg(c=>({...c,dividendEvents:{...(c?.dividendEvents||{}),...got}}));
    const left=Math.max(0,toFetch().length-done);
    const limited=errorMsg===RATE_LIMIT_MESSAGE;
    setStatus({error:!!errorMsg&&!done,text:`${done} tickers actualizados.`+
      (left>0?(limited?` Faltam ${left}: o Alpha Vantage atingiu o limite diário, tenta amanhã.`:` Faltam ${left}: carrega outra vez (máx. 20 por vez; o plano grátis permite 25 pedidos por dia).`):'')+
      (errorMsg&&!limited?' '+errorMsg:'')});
  };
  return h('div',{style:{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}},
    h('button',{className:'btn-secondary ml-0',style:{fontSize:12,padding:'5px 10px'},disabled:status&&status.loading,onClick:refresh,
      title:'Datas de pagamento e valores por acção das acções dos EUA (Alpha Vantage, até 20 tickers por vez)'},status&&status.loading?'…':'Actualizar datas'),
    status&&h('span',{style:{fontSize:12,color:status.error?'var(--red)':'var(--muted)'}},status.text));
}

const AFORRO_MATURITY_YEARS={E:10,F:15,CTPV:7};
// End Date = `endDate` explícita no JSON, ou `dataConstituicao` + anos da série. Devolve YYYY-MM-DD ou null.
function aforroEndDate(r){
  if(r&&typeof r.endDate==='string'&&r.endDate)return r.endDate;
  const yrs=AFORRO_MATURITY_YEARS[String(r?.serie||'').trim().toUpperCase()];
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(r?.dataConstituicao||'');
  if(!yrs||!m)return null;
  const y=+m[1]+yrs,mo=+m[2],d=+m[3];
  const last=new Date(Date.UTC(y,mo,0)).getUTCDate(); // 29 Fev -> 28 Fev em anos não bissextos
  return y+'-'+String(mo).padStart(2,'0')+'-'+String(Math.min(d,last)).padStart(2,'0');
}

    /* ── Distribuição de ativos por investidor ────────────────────────────── */

        {key:'dep',label:'Depósitos',color:'#2dd4bf'},
        {key:'ppr',label:'PPR',color:'#34d399'},

      const alloc={};
