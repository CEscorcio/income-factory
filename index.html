const HoldingsPerf=memo(function HoldingsPerf({pos,income}){
  const[flt,setFlt]=useState('All');
  const calcs=useMemo(()=>pos.map(p=>{
    const cost=p.n*getAv(p),val=p.n*p.cv,pl=val-cost;
    const plp=cost>0?pl/cost:0;
    const div=getIncome(income,p.t);
    const totalReturn=pl+div;
    const trp=cost>0?totalReturn/cost:0;
    return{t:p.t,plp,trp,div,cat:p.cat};
  }),[pos,income]);
  const filtered=useMemo(()=>calcs.filter(x=>{
    if(flt==='Gainers')return x.plp>0;
    if(flt==='Losers')return x.plp<0;
    return true;
  }).sort((a,b)=>b.trp-a.trp),[calcs,flt]);

  const maxAbs=Math.max(...filtered.map(x=>Math.abs(x.trp)),.01);
  const rowH=26;
  const btnStyle=(f)=>({
    padding:'3px 10px',
    border:'1px solid',
    borderRadius:6,
    fontSize:12,
    cursor:'pointer',
    fontWeight:flt===f?700:400,
    background:flt===f?'var(--gold)':'transparent',
    color:flt===f?'#000':'var(--muted)',
    borderColor:flt===f?'var(--gold)':'var(--border)',
  });

  return h('div',{className:'w-full'},
    h('div',{style:{display:'flex',gap:6,marginBottom:10,flexWrap:'wrap'}},
      ['All','Gainers','Losers'].map(f=>
        h('button',{key:f,style:btnStyle(f),onClick:()=>setFlt(f)},f)
      )
    ),
    h('div',null,
      filtered.map(x=>{
        const pct=x.trp*100;
        const isPos=pct>=0;
        const barW=Math.min(Math.abs(x.trp)/maxAbs*100,100);
        const color=isPos?'var(--green)':'var(--red)';
        return h('div',{key:x.t,style:{
          display:'flex',alignItems:'center',gap:6,
          height:rowH+'px',marginBottom:2,
        }},
          h('div',{style:{
            fontSize:12,
            color:'var(--muted)',width:38,textAlign:'right',
            flexShrink:0,fontWeight:600,
          }},x.t),
          h('div',{style:{flex:1,position:'relative',height:10,background:'var(--s2)',borderRadius:6,overflow:'hidden'}},
            h('div',{style:{
              position:'absolute',left:0,top:0,
              width:barW+'%',height:'100%',
              background:color,borderRadius:6,opacity:.85,
              transition:'width .3s',
            }})
          ),
          h('div',{style:{
            fontSize:12,
            color:color,fontWeight:700,
            minWidth:52,textAlign:'right',flexShrink:0,paddingRight:30,
          }},(isPos?'+':'')+pct.toFixed(1)+'%')
        );
      })
    )
  );
});

// One ticker's income-by-year row in the Dividendos "Rendimento por Posição" table.
// Hoisted to top level — was previously defined inside DividendosPage's render
// body and used as a JSX component, forcing a full unmount/remount of every
// row on every re-render.
// Estimated annual dividend of an active position: yield × shares × current price
// (same as the current-year estimate in the annual bar charts). Null when unknown.
function positionEstAnnual(p,qualMap){
  if(p._closed)return null; // sold position shown in the "Todas" tab
  const dy=getQual(qualMap,p.t)?.dy||0;
  return dy>0&&p.n>0&&p.cv>0?dy*p.n*p.cv:null;
}
function IncRow({p,sm,qualMap,income,DISP_YEARS,GROWTH}){
  // Est. this year = yield × shares × price; Est. next year = that × (1 + divGrowth)
  const est=positionEstAnnual(p,qualMap);
  const estNext=est!=null?est*GROWTH:null;
  const vals=DISP_YEARS.map(y=>getIncomeYear(income,p.t,y));
  const total=getIncome(income,p.t);
  const hasAny=total>0||est;
  if(!hasAny)return null;
  return h('tr',{key:p.t},
    h('td',null,h(TickerLink,{t:p.t,className:'font-semibold'}),
      p._closed&&h('span',{style:{fontSize:11,color:'var(--muted)',marginLeft:6,padding:'1px 5px',border:'1px solid var(--border)',borderRadius:4}},'vendida')),
    h('td',{className:'mono-sm-italic'},
      estNext?sm+fn(estNext):'—'),
    h('td',{className:'mono-sm-italic'},
      est?sm+fn(est):'—'),
    ...DISP_YEARS.map((y,i)=>h('td',{key:y,style:{
      color:y===CUR_YEAR?'var(--gold)':'var(--text)',
      fontWeight:y===CUR_YEAR?600:400,
    }},vals[i]>0?sm+fn(vals[i]):'—')),
    h('td',{className:'font-bold text-[var(--green)]'},
      total>0?sm+fn(total):'—')
  );
}
// Renders one currency-group section (USD/EUR+ETF) of the "Rendimento por
// Posição" table. Hoisted to top level for the same reason as IncRow above.
function GroupSection({grp,sm,label,headerBg,labelColor,qualMap,income,DISP_YEARS,GROWTH,sortField,sortDir,sortVal}){
  const sortedGrp=useMemo(()=>{
    if(!sortField||!sortVal)return grp;
    const withVal=grp.map(p=>({p,v:sortVal(p,sortField)}));
    withVal.sort((a,b)=>{
      if(typeof a.v==='string')return sortDir==='asc'?a.v.localeCompare(b.v):b.v.localeCompare(a.v);
      return sortDir==='asc'?a.v-b.v:b.v-a.v;
    });
    return withVal.map(x=>x.p);
  },[grp,sortField,sortDir,sortVal]);
  const rows=sortedGrp.map(p=>h(IncRow,{key:p.t,p,sm,qualMap,income,DISP_YEARS,GROWTH})).filter(Boolean);
  if(!rows.length)return null;
  const totals=Object.fromEntries(DISP_YEARS.map(y=>[y,grp.reduce((s,p)=>s+getIncomeYear(income,p.t,y),0)]));
  const grandTotal=grp.reduce((s,p)=>s+getIncome(income,p.t),0);
  const estTotal=grp.reduce((s,p)=>s+(positionEstAnnual(p,qualMap)||0),0);
  const estNextTotal=estTotal*GROWTH;
  return h('tbody',null,
    h('tr',{style:{background:headerBg}},
      h('td',{colSpan:DISP_YEARS.length+4,style:{padding:'8px 12px',fontSize:12,fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',color:labelColor}},'[ '+label+' ]')
    ),
    ...rows,
    h('tr',{className:'bg-[var(--s2)]'},
      h('td',null,h('span',{style:{fontWeight:600,color:labelColor,fontSize:13}},sm==='$'?'$ TOTAL':'€ TOTAL')),
      h('td',{className:'mono-sm-italic'},
        estNextTotal>0?sm+fn(estNextTotal):'—'),
      h('td',{className:'mono-sm-italic'},
        estTotal>0?sm+fn(estTotal):'—'),
      ...DISP_YEARS.map(y=>h('td',{key:y,style:{fontWeight:600,color:y===CUR_YEAR?'var(--gold)':'var(--text)'}},
        totals[y]>0?sm+fn(totals[y]):'—')),
      h('td',{className:'font-bold text-[var(--green)]'},
        grandTotal>0?sm+fn(grandTotal):'—')
    )
  );
}
// ── Chowder Rule (dividend yield + 5Y dividend growth) — shown on the Dividends page ──
function ChowderRuleCard({pos,qualMap,income}){
  const chowderRows=useMemo(()=>pos
    .filter(p=>p.n>0&&hasDividend(p,qualMap,income))
    .map(p=>{
      const q=getQual(qualMap,p.t);
      const yieldRate=q?.dy??null;
      const dividendGrowth5y=q?.g5??null;
      const chowder=yieldRate!=null&&dividendGrowth5y!=null?yieldRate+dividendGrowth5y:null;
      return{t:p.t,name:p.name||p.t,type:p.cat==='ETF'?'ETF':'Stock',yieldRate,dividendGrowth5y,chowder};
    })
    .sort((a,b)=>{
      if(a.chowder==null)return b.chowder==null?a.t.localeCompare(b.t):1;
      if(b.chowder==null)return -1;
      return b.chowder-a.chowder;
    }),[pos,qualMap,income]);
  return h('div',{className:'card',style:{height:'100%'}},
      h(Shdr,{title:'Chowder Rule',hint:chowderRows.length+' dividend payers'}),
      h('div',{style:{display:'flex',gap:12,flexWrap:'wrap',marginBottom:12,fontSize:12}},
        h('span',{style:{display:'inline-flex',alignItems:'center',gap:5,color:'var(--green)',fontWeight:700}},
          h('span',{style:{width:9,height:9,borderRadius:'50%',background:'var(--green)',display:'inline-block'}}),
          '>12% · Golden Rule atingida'),
        h('span',{style:{display:'inline-flex',alignItems:'center',gap:5,color:'var(--gold)',fontWeight:700}},
          h('span',{style:{width:9,height:9,borderRadius:'50%',background:'var(--gold)',display:'inline-block'}}),
          '10–11.99% · Perto do limiar'),
        h('span',{style:{display:'inline-flex',alignItems:'center',gap:5,color:'var(--red)',fontWeight:700}},
          h('span',{style:{width:9,height:9,borderRadius:'50%',background:'var(--red)',display:'inline-block'}}),
          '<10% · Abaixo do limiar'),
        h('span',{style:{display:'inline-flex',alignItems:'center',gap:5,color:'var(--muted)'}},
          h('span',{style:{width:9,height:9,borderRadius:'50%',background:'var(--muted)',display:'inline-block'}}),
          'Dados de yield ou crescimento 5Y em falta')
      ),
      chowderRows.length===0
        ?h('div',{style:{padding:'12px 8px',fontSize:13,color:'var(--muted)'}},'Não foram encontrados activos com dividendos.')
        :h('div',{className:'card-table overflow-x-auto'},
          h('table',{style:{width:'100%',borderCollapse:'collapse',fontSize:13}},
            h('thead',null,h('tr',null,
              h('th',{className:'text-left'},'Ticker'),
              h('th',{className:'text-left'},'Tipo'),
              h('th',{className:'text-right'},'Dividend Yield'),
              h('th',{className:'text-right'},'Dividend Growth 5Y'),
              h('th',{className:'text-right'},'Chowder Rule'),
              h('th',{className:'text-left'},'Sinal')
            )),
            h('tbody',null,chowderRows.map(r=>{
              const meetsRule=r.chowder!=null&&r.chowder>0.12;
              const nearRule=r.chowder!=null&&r.chowder>=0.10&&r.chowder<=0.12;
              const color=r.chowder==null?'var(--muted)':meetsRule?'var(--green)':nearRule?'var(--gold)':'var(--red)';
              const background=r.chowder==null?'transparent':meetsRule?'rgba(16,185,129,.06)':nearRule?'rgba(234,179,8,.07)':'rgba(239,68,68,.05)';
              return h('tr',{key:r.t,style:{borderBottom:'1px solid var(--s2)',background}},
                h('td',{style:{padding:'8px 10px',fontWeight:700}},h(TickerLink,{t:r.t})),
                h('td',{style:{padding:'8px 10px',color:'var(--muted)'}},r.type),
                h('td',{style:{padding:'8px 10px',textAlign:'right',color:r.yieldRate!=null?'var(--blue)':'var(--muted)'}},r.yieldRate!=null?(r.yieldRate*100).toFixed(2)+'%':'—'),
                h('td',{style:{padding:'8px 10px',textAlign:'right',color:r.dividendGrowth5y!=null?'var(--text)':'var(--muted)'}},r.dividendGrowth5y!=null?(r.dividendGrowth5y*100).toFixed(1)+'%':'—'),
                h('td',{style:{padding:'8px 10px',textAlign:'right',fontWeight:800,color}},r.chowder!=null?(r.chowder*100).toFixed(1)+'%':'—'),
                h('td',{style:{padding:'8px 10px',color,fontWeight:700,whiteSpace:'nowrap'}},
                  r.chowder==null?'Dados insuficientes':meetsRule?'✓ Acima de 12%':'↓ 12% ou abaixo')
              );
            }))
          )
        )
    );
}

// ── Desaceleração — posições onde o crescimento do dividendo a 1 ano ficou abaixo do de 5 anos ──
// Shows every stock whose 1Y dividend growth is below its 5Y growth (decelerating),
// most decelerated first; free rows (up to DECEL_ROWS) go to the stocks closest to
// decelerating, shown in green as "a acelerar".
const DECEL_ROWS=19;
function DecelerationCard({pos,qualMap}){
      const all=pos.filter(p=>p.cat!=='ETF'&&p.n>0).map(p=>{
        const q=getQual(qualMap,p.t);
        return{t:p.t,name:p.name,g1:q?.g1,g5:q?.g5};
      }).filter(x=>x.g1!=null&&x.g5!=null&&x.g1>0&&x.g5>0)
        .sort((a,b)=>(a.g1/a.g5)-(b.g1/b.g5));
      const slowing=all.filter(x=>x.g1<x.g5);
      const rows=[...slowing.slice(0,DECEL_ROWS),...all.filter(x=>x.g1>=x.g5).slice(0,Math.max(0,DECEL_ROWS-slowing.length))];
      if(!slowing.length)return null;
      const maxG=Math.max(...rows.map(x=>Math.max(x.g1,x.g5)),.01);
      const extra=rows.length-Math.min(slowing.length,DECEL_ROWS);
      return h('div',{className:'card',style:{height:'100%'}},
        h(Shdr,{title:'Desaceleração',hint:'1Y DGR abaixo do 5Y DGR — '+Math.min(slowing.length,DECEL_ROWS)+' a desacelerar'+(extra?' · '+extra+' a acelerar':'')}),
        h('div',null,
          ...rows.map((x,i)=>{
            const up=x.g1>=x.g5;
            const col=up?'var(--green)':'var(--gold)';
            const barW1=Math.min(x.g1/maxG*100,100);
            const barW5=Math.min(x.g5/maxG*100,100);
            return h('div',{key:x.t,title:up?'A acelerar: crescimento a 1 ano acima do de 5 anos':'A desacelerar: crescimento a 1 ano abaixo do de 5 anos',
              style:{display:'flex',alignItems:'center',gap:10,padding:'8px 0',borderBottom:'1px solid var(--s2)',
                borderTop:up&&i>0&&rows[i-1].g1<rows[i-1].g5?'1px dashed var(--border)':undefined}},
              h('div',{style:{width:64,flexShrink:0}},
                h(TickerLink,{t:x.t,style:{fontSize:12,fontWeight:700}}),
                up&&h('div',{style:{fontSize:10,color:'var(--green)',marginTop:2}},'a acelerar')),
              h('div',{style:{flex:1}},
                h('div',{style:{position:'relative',height:7,background:'var(--s2)',borderRadius:4,overflow:'hidden',marginBottom:3}},
                  h('div',{style:{position:'absolute',left:0,top:0,height:'100%',width:barW5+'%',background:'var(--muted)',opacity:.4,borderRadius:4}})
                ),
                h('div',{style:{position:'relative',height:7,background:'var(--s2)',borderRadius:4,overflow:'hidden'}},
                  h('div',{style:{position:'absolute',left:0,top:0,height:'100%',width:barW1+'%',background:col,borderRadius:4}})
                )
              ),
              h('div',{style:{textAlign:'right',flexShrink:0,minWidth:100}},
                h('div',{style:{fontSize:12,color:col,fontWeight:700}},'1Y '+fp(x.g1)),
                h('div',{style:{fontSize:11,color:'var(--muted)'}},'5Y '+fp(x.g5))
              )
            );
          })
        )
      );
}

function DividendosPage({pos,income,qual,sold,cfg,setCfg}){
  const[incTab,setIncTab]=useState('posicoes');
  const[incSortField,setIncSortField]=useState('total');
  const[incSortDir,setIncSortDir]=useState('desc');
  // Per-ticker annual income (2025 = current year)
  // ── Qualidade state (moved from Qual page) ─────────────────────────────

  const qualMap=useMemo(()=>buildQualMap(qual),[qual]);
  const stocks=useMemo(()=>pos.filter(p=>hasDividend(p,qualMap,income)),[pos,qualMap,income]);
  // Precomputed USD/EUR splits used in KPIs and Row 0
  const stocksUSD_div=useMemo(()=>stocks.filter(p=>p.cat==='USD'),[stocks]);
  const stocksEUR_div=useMemo(()=>stocks.filter(p=>p.cat!=='USD'),[stocks]);
  // "Todas": active positions plus sold tickers no longer held, in one table.
  const allWithDiv=useMemo(()=>{
    const held=new Set(stocks.map(p=>p.t));
    const closed=[];const seen=new Set();
    (sold||[]).forEach(p=>{if(held.has(p.t)||seen.has(p.t))return;if(!(getIncome(income,p.t)>0))return;seen.add(p.t);closed.push({...p,_closed:true});});
    return[...stocks,...closed];
  },[stocks,sold,income]);
  const allUSD_div=useMemo(()=>allWithDiv.filter(p=>p.cat==='USD'),[allWithDiv]);
  const allEUR_div=useMemo(()=>allWithDiv.filter(p=>p.cat!=='USD'),[allWithDiv]);

  // Per-ticker 2025 income for diversification donut + bars

  // Yield/Payout bars per ticker (USD stocks with quality data)
  const yieldBars=useMemo(()=>{
    return stocks
      .map(p=>{
        const q=getQual(qualMap,p.t);
        const dy=q?.dy||0;
        const yld=dy;                       // dy is already yield ratio
        const av=getAv(p);
        const yoc=av>0&&p.cv>0&&dy>0?dy*p.cv/av:null; // YoC = yield × current price ÷ average cost
        const py=q?.py||null;
        return{t:p.t,yld,yoc,py,cat:p.cat};
      })
      .filter(x=>x.yld>0)
      .sort((a,b)=>b.yld-a.yld)
      .slice(0,25);
  },[stocks,qualMap]);


  // Colour palette for donut

  const[hov,setHov]=useState(null);

  // Uses shared top-level svgArc utility







  /* Grand totals for the inception card — using divByYear for sold positions */
  const{grandTotalUSD,grandTotalEUR}=useMemo(()=>{
    const tU=mkTotals(stocksUSD_div,income);
    const tE=mkTotals(stocksEUR_div,income);
    const soldDivUSD=(sold||[]).filter(p=>p.cat==='USD').reduce((s,p)=>
      s+(p.divByYear?Object.values(p.divByYear).reduce((a,v)=>a+(v||0),0):(p.div||0)),0);
    const soldDivEUR=(sold||[]).filter(p=>p.cat!=='USD').reduce((s,p)=>
      s+(p.divByYear?Object.values(p.divByYear).reduce((a,v)=>a+(v||0),0):(p.div||0)),0);
    const totalUSD=YEARS.reduce((s,y)=>s+(tU[y]||0),0)+soldDivUSD;
    const totalEUR=YEARS.reduce((s,y)=>s+(tE[y]||0),0)+soldDivEUR;
    return{grandTotalUSD:totalUSD,grandTotalEUR:totalEUR};
  },[stocksUSD_div,stocksEUR_div,income,sold]);

  /* Sold positions split by currency for the dividend table */
  const soldWithDivUSD=useMemo(()=>(sold||[]).filter(p=>p.cat==='USD'&&(p.divByYear||p.div>0)),[sold]);
  const soldWithDivEUR=useMemo(()=>(sold||[]).filter(p=>p.cat!=='USD'&&(p.divByYear||p.div>0)),[sold]);
  const getSoldDivByYear_dp=(p,y)=>(p.divByYear&&p.divByYear[y])||0;

  // Years to show as columns — derived from years that actually have dividend
  // data (income for active positions, divByYear for sold ones), not from the
  // earliest buy transaction. A position bought in 2022 but first paying a
  // dividend in 2023 no longer produces an empty, all-dashes 2022 column.
  // The current year is always included so the in-progress year stays visible.
  const yearsWithData=new Set([CUR_YEAR]);
  Object.values(income||{}).forEach(yr=>{
    Object.entries(yr||{}).forEach(([y,v])=>{if(v>0)yearsWithData.add(Number(y));});
  });
  [...(pos||[]),...(sold||[])].forEach(p=>{
    Object.entries(p.divByYear||{}).forEach(([y,v])=>{if(v>0)yearsWithData.add(Number(y));});
  });
  const DISP_YEARS=YEARS.filter(y=>yearsWithData.has(y));
  const GROWTH=1+(cfg?.divGrowth??0.03); // same dividend-growth assumption used app-wide (cfg.divGrowth)

  const totSoldUSD_dp=useMemo(()=>Object.fromEntries([...DISP_YEARS,'total'].map(y=>y==='total'
    ?['total',soldWithDivUSD.reduce((s,p)=>s+getSoldDivTotal(p),0)]
    :[y,soldWithDivUSD.reduce((s,p)=>s+getSoldDivByYear_dp(p,y),0)])),[soldWithDivUSD,DISP_YEARS]);
  const totSoldEUR_dp=useMemo(()=>Object.fromEntries([...DISP_YEARS,'total'].map(y=>y==='total'
    ?['total',soldWithDivEUR.reduce((s,p)=>s+getSoldDivTotal(p),0)]
    :[y,soldWithDivEUR.reduce((s,p)=>s+getSoldDivByYear_dp(p,y),0)])),[soldWithDivEUR,DISP_YEARS]);


  return h('div',null,
    /* ── Top cards: Total Dividends · Avg Yield · Div CAGR 1Y / 3Y / 5Y ── */
    (()=>{
      const divStocks2=stocks.filter(p=>getQual(qualMap,p.t)?.dy>0&&p.n>0&&p.cv>0&&getAv(p)>0);
      const totDiv2=divStocks2.reduce((s,p)=>s+((getQual(qualMap,p.t)?.dy||0)*p.cv*p.n),0);
      const totVal2=divStocks2.reduce((s,p)=>s+p.cv*p.n,0);
      const totCost2=divStocks2.reduce((s,p)=>s+getAv(p)*p.n,0);
      const avgYld2=totVal2>0?totDiv2/totVal2:0;
      const avgYoc2=totCost2>0?totDiv2/totCost2:0;
      /* CAGR calculations using yearly income totals */
      const sBy2=buildSoldByYear(sold||[]);
      const tU2=mkTotals(stocksUSD_div,income);const tE2=mkTotals(stocksEUR_div,income);
      const addS2=(t,sb)=>Object.fromEntries(YEARS.map(y=>[y,(t[y]||0)+(sb[y]||0)]));
      const tUf2=addS2(tU2,sBy2.USD);const tEf2=addS2(tE2,sBy2.EUR);
      const totByY=y=>(tUf2[y]||0)+(tEf2[y]||0);
      
      /* use last COMPLETED year as baseline — skip current year if <80% of prev */
      const prevYearTotal=totByY(String(CUR_YEAR-1));
      const curYearTotal=totByY(String(CUR_YEAR));
      const curYearComplete=prevYearTotal>0&&curYearTotal>=prevYearTotal*0.8;
      const latestY=curYearComplete
        ?YEARS.find(y=>totByY(y)>0)||YEARS[0]
        :YEARS.find(y=>y<CUR_YEAR&&totByY(y)>0)||(CUR_YEAR-1); // M5 FIX: explicit year not YEARS[1] array index
      const prev1Y=YEARS[YEARS.indexOf(latestY)+1]||null;
      const prev3YIdx=YEARS.indexOf(latestY)+3;
      const prev3Yr=YEARS[prev3YIdx]||null;
      const latestV=totByY(latestY);
      const cagr1=prev1Y&&totByY(prev1Y)>0?(latestV/totByY(prev1Y))-1:null;
      const cagr3=prev3Yr&&totByY(prev3Yr)>0?Math.pow(latestV/totByY(prev3Yr),1/3)-1:null;
      const prev5Yr=YEARS[YEARS.indexOf(latestY)+5]||null;
      const cagr5=prev5Yr&&totByY(prev5Yr)>0?Math.pow(latestV/totByY(prev5Yr),1/5)-1:null;
      return h('div',{className:'grid-1-6 mb-4'},
        /* Total Dividends Received */
        h('div',{className:'gcol-span-2',style:{background:'var(--surface)',border:'1px solid var(--border)',
          borderLeft:'3px solid var(--gold)',borderRadius:6,padding:16,
          display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:12}},
          h('div',null,
            h('div',{style:{fontSize:12,fontWeight:700,letterSpacing:'.07em',textTransform:'uppercase',
              color:'var(--muted)',marginBottom:8}},'Total Dividends Received'),
            h('div',{style:{display:'flex',gap:20,alignItems:'baseline',flexWrap:'wrap'}},
              h('span',{style:{fontSize:26,fontWeight:800,color:'var(--gold)'}},
                '$'+fn(grandTotalUSD)),
              h('span',{style:{fontSize:26,fontWeight:800,color:'var(--gold)'}},
                '€'+fn(grandTotalEUR))
            ),
          ),
        ),
        /* Avg Yield */
        h(Kpi,{label:'Avg Yield',value:fp(avgYld2),accent:'bl',sub:'Yield on Cost: '+fp(avgYoc2)}),
        /* Dividend CAGR, 1Y · 3Y · 5Y (fp already adds the sign) */
        ...[['1Y',cagr1,prev1Y],['3Y',cagr3,prev3Yr],['5Y',cagr5,prev5Yr]].map(([k,v,base])=>
          h(Kpi,{key:k,label:k+' Div CAGR',value:v!=null?fp(v):'—',accent:'bl',
            sub:!base?'Dados insuficientes':v!=null?latestY+' vs '+base:'Sem dividendos registados em '+base})),
      );
    })(),

    /* ── Row 0: Bars, KPIs, CAGR from Income ── */
    (()=>{
      
      const tU=mkTotals(stocksUSD_div,income);
      const tE=mkTotals(stocksEUR_div,income);
      // Add SOLD dividends per year using shared buildSoldByYear
      const sBy=buildSoldByYear(sold);
      const addSold=(tot,soldByYear)=>Object.fromEntries(YEARS.map(y=>[y,(tot[y]||0)+(soldByYear[y]||0)]));
      const tUf={...addSold(tU,sBy.USD),total:YEARS.reduce((s,y)=>s+(tU[y]||0)+(sBy.USD[y]||0),0)};
      const tEf={...addSold(tE,sBy.EUR),total:YEARS.reduce((s,y)=>s+(tE[y]||0)+(sBy.EUR[y]||0),0)};
      // Current-year full estimate (same formula as homepage PADI card) — used to
      // show a light "projected remainder" segment on top of the current year's bar
      const estUSD=(pos||[]).filter(p=>p.cat==='USD'&&p.n>0&&p.cv>0).reduce((s,p)=>{const dy=getQual(qualMap,p.t)?.dy||0;return s+(dy>0?dy*p.n*p.cv:0);},0);
      const estEUR=(pos||[]).filter(p=>p.cat!=='USD'&&p.n>0&&p.cv>0).reduce((s,p)=>{const dy=getQual(qualMap,p.t)?.dy||0;return s+(dy>0?dy*p.n*p.cv:0);},0);
      return h('div',{className:'mb-4'},
        h('div',{className:'grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3'},
          h('div',{className:'card-sm px-5'},h(BarChart,{tots:tUf,color:'var(--blue)',label:'USD — Evolução Anual (incl. posições fechadas) · Total recebido $'+fn(tUf.total,0),sm:'$',estTotal:estUSD,growth:1+(cfg?.divGrowth??0.03)})),
          h('div',{className:'card-sm px-5'},h(BarChart,{tots:tEf,color:'var(--green)',label:'EUR — Evolução Anual (incl. posições fechadas) · Total recebido €'+fn(tEf.total,0),sm:'€',estTotal:estEUR,growth:1+(cfg?.divGrowth??0.03)}))
        ),
      );
    })(),

    /* ── Mapa de rendimento: dividendos por mês ── */

    /* ── Row 2: Yield & Estimated Dividend Pies — 2 cols ── */
    h('div',{className:'grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4'},
      /* Yield pie */
      h('div',{className:'card'},
        h(Shdr,{title:'Yield por Ticker'}),
        (()=>{
          const items=yieldBars.slice(0,20).filter(x=>x.yld>0);
          if(!items.length)return null;
          const CX=120,CY=120,R=90,ri=54;
          const slices=computeDonutSlices(
            items.map((x,i)=>({...x,val:x.yld,col:CHART_PALETTE[i%CHART_PALETTE.length]})),
            CX,CY,R,ri
          );
          return h('div',{className:'donut-wrap'},
            h('svg',{width:240,height:240,viewBox:'0 0 240 240'},
              slices.map(sl=>{
                const isH=hov===sl.t;
                return h('path',{
                  key:sl.t,
                  d:sl.d,
                  fill:sl.col,opacity:hov&&!isH?.35:1,
                  style:{cursor:'pointer',transition:'opacity .15s',transform:isH?`translate(${Math.cos(sl.mid)*4}px,${Math.sin(sl.mid)*4}px)`:'',transformOrigin:'120px 120px'},
                  onMouseEnter:()=>setHov(sl.t),onMouseLeave:()=>setHov(null),
                });
              }),
              h('text',{x:CX,y:CY-8,textAnchor:'middle',fontSize:hov?11:14,fontWeight:700,fill:'#e2e8f0'},
                hov?hov:'Yield'
              ),
              h('text',{x:CX,y:CY+12,textAnchor:'middle',fontSize:hov?16:11,fontWeight:700,fill:'var(--blue)'},
                hov?(items.find(x=>x.t===hov)?.yld*100||0).toFixed(1)+'%':'por Ticker'
              )
            ),
            h('div',{className:'donut-legend'},
              slices.map(sl=>h('div',{key:sl.t,
                style:{display:'flex',alignItems:'center',gap:5,cursor:'pointer',opacity:hov&&hov!==sl.t?.4:1},
                onMouseEnter:()=>setHov(sl.t),onMouseLeave:()=>setHov(null),
              },
                h('div',{style:{width:8,height:8,borderRadius:6,background:sl.col,flexShrink:0}}),
                h('span',{style:{fontSize:12,color:'var(--muted)',whiteSpace:'nowrap'}},
                  sl.t,' ',h('span',{style:{color:sl.col,fontWeight:700}},(sl.pct*100).toFixed(1)+'%')
                )
              ))
            )
          );
        })(),

      ),

    /* Dividendos Estimados pie */
    h(DividendosEstPorPosicaoPie,{pos,qualMap,cfg,standalone:true})
    ),

    /* ── Income Tabs ── */
    h('div',{style:{display:'flex',gap:6,marginBottom:16,borderBottom:'1px solid var(--border)',paddingBottom:8}},
      h('button',{className:'fb'+(incTab==='todas'?' on':''),onClick:()=>setIncTab('todas')},'Todas'),
      h('button',{className:'fb'+(incTab==='posicoes'?' on':''),onClick:()=>setIncTab('posicoes')},'Posições Activas'),
      h('button',{className:'fb'+(incTab==='fechadas'?' on':''),onClick:()=>setIncTab('fechadas')},'Posições Vendidas')
    ),

    /* ── Tab: Rendimento por Posição ── */
    (incTab==='posicoes'||incTab==='todas')&&(()=>{
      const all=incTab==='todas';
      const grpUSD=all?allUSD_div:stocksUSD_div,grpEUR=all?allEUR_div:stocksEUR_div;
      const sortVal=(p,field)=>{
        if(field==='ticker')return p.t;
        if(field==='est')return positionEstAnnual(p,qualMap)||0;
        if(field==='estNext')return(positionEstAnnual(p,qualMap)||0)*GROWTH;
        if(field==='total')return getIncome(income,p.t);
        return getIncomeYear(income,p.t,field); // field is a year number
      };
      const sortIcon=field=>incSortField===field?(incSortDir==='desc'?' ↓':' ↑'):'';
      const thSort=(field,label,extraStyle)=>h('th',{
        key:field,style:{cursor:'pointer',userSelect:'none',...extraStyle},
        onClick:()=>{
          if(incSortField===field)setIncSortDir(d=>d==='desc'?'asc':'desc');
          else{setIncSortField(field);setIncSortDir('desc');}
        }},label+sortIcon(field));
      return h('div',{className:'mb-4'},
        h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}},
          h(Shdr,{title:all?'Rendimento por Posição — activas e vendidas':'Rendimento por Posição'}),
          h('span',{style:{fontSize:11,color:'var(--muted)',fontStyle:'italic'}},'Est. '+CUR_YEAR+' = yield × posições × preço · Est. '+(CUR_YEAR+1)+' = Est. '+CUR_YEAR+' × '+GROWTH.toFixed(3))
        ),
        h('div',{className:'card-table sticky-head'},
          h('table',null,
            h('thead',null,h('tr',null,
              thSort('ticker','Ticker',{textAlign:'left'}),
              thSort('estNext','Est. '+(CUR_YEAR+1),{color:'var(--muted)',fontStyle:'italic',fontSize:12,whiteSpace:'nowrap'}),
              thSort('est','Est. '+CUR_YEAR,{color:'var(--muted)',fontStyle:'italic',fontSize:12,whiteSpace:'nowrap'}),
              ...DISP_YEARS.map(y=>thSort(y,y,{color:y===CUR_YEAR?'var(--gold)':'inherit'})),
              thSort('total','Total'),
            )),
            h(GroupSection,{grp:grpUSD,sm:'$',label:'Acções USD',headerBg:'#18181b',labelColor:'var(--blue)',qualMap,income,DISP_YEARS,GROWTH,sortField:incSortField,sortDir:incSortDir,sortVal}),
            h(GroupSection,{grp:grpEUR,sm:'€',label:'Acções EUR + ETFs',headerBg:'#0a1f16',labelColor:'var(--green)',qualMap,income,DISP_YEARS,GROWTH,sortField:incSortField,sortDir:incSortDir,sortVal}),
          )
        )
      );
    })(),

    /* ── Tab: Posições Fechadas ── */
    incTab==='fechadas'&&(soldWithDivUSD.length>0||soldWithDivEUR.length>0)&&h('div',{className:'mb-4'},
      h(Shdr,{title:'Dividendos — Posições Fechadas',hint:'Rendimento por ano durante o período de detenção'}),
      (()=>{
        return h('div',{className:'card-table sticky-head'},
          h('table',null,
            h('thead',null,h('tr',null,
              h('th',{className:'text-left'},'Ticker'),
              ...DISP_YEARS.map(y=>h('th',{key:y,style:{color:y===CUR_YEAR?'var(--gold)':'inherit'}},y)),
              h('th',null,'Total'),
            )),
            /* USD sold */
            soldWithDivUSD.length>0&&h('tbody',null,
              h('tr',{style:{background:'#18181b'}},
                h('td',{colSpan:DISP_YEARS.length+2,style:{fontSize:12,fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',color:'var(--blue)'}},'[ VENDIDAS USD ]')
              ),
              ...soldWithDivUSD.map(p=>{
                const tot=getSoldDivTotal(p);
                return h('tr',{key:p.t},
                  h('td',null,h(TickerLink,{t:p.t,className:'font-semibold'})),
                  ...DISP_YEARS.map(y=>{
                    const inPeriod=p.divByYear&&y in p.divByYear;
                    const v=getSoldDivByYear_dp(p,y);
                    return h('td',{key:y,style:{color:inPeriod?(v>0?'var(--green)':'var(--muted)'):'var(--s2)'}},
                      inPeriod?(v>0?'$'+fn(v):'—'):'·');
                  }),
                  h('td',{className:'font-bold text-[var(--green)]'},tot>0?'$'+fn(tot):'—'),
                );
              }),
              h('tr',{className:'bg-[var(--s2)]'},
                h('td',null,h('span',{style:{fontWeight:600,color:'var(--blue)',fontSize:13}},'$ TOTAL')),
                ...DISP_YEARS.map(y=>h('td',{key:y,style:{fontWeight:600,color:y===CUR_YEAR?'var(--gold)':'var(--text)'}},
                  totSoldUSD_dp[y]>0?'$'+fn(totSoldUSD_dp[y]):'—')),
                h('td',{className:'font-bold text-[var(--green)]'},totSoldUSD_dp.total>0?'$'+fn(totSoldUSD_dp.total):'—'),
              )
            ),
            /* EUR sold */
            soldWithDivEUR.length>0&&h('tbody',null,
              h('tr',{style:{background:'#0a1f16'}},
                h('td',{colSpan:DISP_YEARS.length+2,style:{fontSize:12,fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',color:'var(--green)'}},'[ VENDIDAS EUR ]')
              ),
              ...soldWithDivEUR.map(p=>{
                const tot=getSoldDivTotal(p);
                return h('tr',{key:p.t},
                  h('td',null,h(TickerLink,{t:p.t,className:'font-semibold'})),
                  ...DISP_YEARS.map(y=>{
                    const inPeriod=p.divByYear&&y in p.divByYear;
                    const v=getSoldDivByYear_dp(p,y);
                    return h('td',{key:y,style:{color:inPeriod?(v>0?'var(--green)':'var(--muted)'):'var(--s2)'}},
                      inPeriod?(v>0?'€'+fn(v):'—'):'·');
                  }),
                  h('td',{className:'font-bold text-[var(--green)]'},tot>0?'€'+fn(tot):'—'),
                );
              }),
              h('tr',{className:'bg-[var(--s2)]'},
                h('td',null,h('span',{style:{fontWeight:600,color:'var(--green)',fontSize:13}},'€ TOTAL')),
                ...DISP_YEARS.map(y=>h('td',{key:y,style:{fontWeight:600,color:y===CUR_YEAR?'var(--gold)':'var(--text)'}},
                  totSoldEUR_dp[y]>0?'€'+fn(totSoldEUR_dp[y]):'—')),
                h('td',{className:'font-bold text-[var(--green)]'},totSoldEUR_dp.total>0?'€'+fn(totSoldEUR_dp.total):'—'),
              )
            ),
          )
        );
      })()
    ),

    /* ── Row 3b: Dividendos de Posições Vendidas (por ano) ── */
    incTab==='fechadas'&&(()=>{
      const soldWithDiv=(sold||[]).filter(p=>p.div>0);
      if(soldWithDiv.length===0)return null;
      const byYear=soldWithDiv.reduce((a,p)=>{
        const y=p.exit?p.exit.slice(0,4):'—';
        const prev=a[y]||{USD:0,EUR:0,items:[]};
        return{...a,[y]:{
          USD:prev.USD+(p.cat==='USD'?p.div:0),
          EUR:prev.EUR+(p.cat!=='USD'?p.div:0),
          items:[...prev.items,p]
        }};
      },{});
      const years=Object.keys(byYear).sort((a,b)=>b-a);
      return h('div',{className:'card my-4'},
        h(Shdr,{title:'Dividendos de Posições Vendidas'}),
        h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:12}},
          years.map(y=>h('div',{key:y,style:{background:'var(--s2)',borderRadius:6,padding:16,border:'1px solid var(--border)'}},
            h('div',{style:{fontSize:13,fontWeight:700,color:'var(--gold)',marginBottom:8}},y),
            byYear[y].items.map(p=>h('div',{key:p.t,style:{display:'flex',justifyContent:'space-between',padding:'2px 0',fontSize:13}},
              h('span',{className:'text-[var(--text)]'},p.t),
              h('span',{className:'text-gold'},(p.cat==='USD'?'+$':'+€')+fn(p.div))
            )),
            h('div',{style:{marginTop:6,paddingTop:6,display:'flex',justifyContent:'space-between',fontSize:13,fontWeight:700}},
              h('span',{className:'text-muted'},'Total'),
              h('span',{className:'text-gold'},
                [byYear[y].USD>0?'+$'+fn(byYear[y].USD):null,byYear[y].EUR>0?'+€'+fn(byYear[y].EUR):null].filter(Boolean).join(' · ')
              )
            )
          ))
        )
      );
    })(),

    /* ── Calendar (8/12) + DRIP (4/12) side by side ── */
    h('div',{className:'split-8-4 mt-4',style:{alignItems:'start'}},
    /* ── Dividend calendar projection, allocated across each position's known
       payment months using current yield × shares × price. ── */
    (()=>{
      const calendar=buildDividendCalendarData(pos||[],qualMap,cfg?.fxEurUsd||1.08,cfg?.dividendEvents);
      const maxMonth=Math.max(...calendar.months.map(month=>month.totalEUR),1);
      const averageMonth=calendar.annualEUR/12;

function TesesRow(label,value){

// Thesis scorecard ("x / max" strings), coloured like the Quality Score legend:
// ≥80% green · ≥60% blue · ≥40% yellow · ≥20% orange · below red.
function parseScore(text){
  const m=/^\s*(-?[\d.,]+)\s*\/\s*([\d.,]+)/.exec(String(text||''));
  if(!m)return null;
  const v=parseFloat(m[1].replace(',','.')),max=parseFloat(m[2].replace(',','.'));
  return Number.isFinite(v)&&max>0?{v,max,r:Math.max(0,Math.min(1,v/max))}:null;
}
function scoreTone(r){
  return r>=0.8?'var(--green)':r>=0.6?'var(--blue)':r>=0.4?'var(--tier-ok)':r>=0.2?'var(--tier-warn)':'var(--red)';
}
// Financial Quality rows, laid out like the Scorecard: muted metric names, mono values,
// thin row dividers; the latest year is in bold.

}
function TesesScorecard({items,total}){
  if(!items||!items.length)return null;

// ── SWOT (thesis.swot = { strengths, weaknesses, opportunities, threats }: 4 × {title, note}) ──
const SWOT_Q={

}
function TesesList(items,color){

// ── Teses: cartão "Dividends" (histórico anual FY: DPS, yield, payout) ──────────────
// Dados em teses.json -> <TICKER>.dividends = {currency,source,history:[{year,dps,yield,payout}]}  (yield/payout em decimal)
function TesesDividends({data}){
  // All three series side by side per year. Each one is scaled to its own maximum,
  // since DPS (currency) and yield/payout (%) have different units.
  const[hidden,setHidden]=useState({});
  const hist=(Array.isArray(data?.history)?data.history:[]).filter(r=>r&&Number.isFinite(r.year)).sort((a,b)=>a.year-b.year);
  if(!hist.length)return null;
  const cur=!data.currency||data.currency==='USD'?'$':data.currency==='EUR'?'€':data.currency+' ';
  const per=data.periodLabel||'FY';   // 'FY' (exercício) por defeito; ex.: 'Ano de pagamento'
  const M={
    dps:{label:'Dividendo por acção',short:'DPS',col:'var(--green)',fmt:v=>cur+(Math.abs(v*100-Math.round(v*100))>1e-6?v.toFixed(3):v.toFixed(2))},
    yield:{label:'Dividend yield',short:'Yield',col:'var(--blue)',fmt:v=>(v*100).toFixed(2)+'%'},
    payout:{label:'Payout ratio',short:'Payout',col:'var(--gold)',fmt:v=>(v*100).toFixed(2)+'%'}
  };
  const KEYS=['dps','yield','payout'];
  const shown=KEYS.filter(k=>!hidden[k]&&hist.some(r=>Number.isFinite(r[k])));
  const maxOf=Object.fromEntries(KEYS.map(k=>[k,Math.max(0,...hist.map(r=>Number.isFinite(r[k])?r[k]:0))||1]));
  const CH=140;
  const fm=(k,r)=>Number.isFinite(r[k])?M[k].fmt(r[k]):'—';
  const tip=(r,i)=>{
    const prev=hist[i-1];
    const g=i>0&&Number.isFinite(r.dps)&&prev&&prev.dps>0?' ('+((r.dps/prev.dps-1)>=0?'+':'')+((r.dps/prev.dps-1)*100).toFixed(1)+'% vs '+prev.year+')':'';
    return per+' '+r.year+' · DPS '+fm('dps',r)+g+' · Yield '+fm('yield',r)+' · Payout '+fm('payout',r);
  };
  const dot=col=>h('span',{style:{display:'inline-block',width:9,height:9,borderRadius:3,background:col,marginRight:6,flexShrink:0}});
  const legend=k=>h('button',{key:k,onClick:()=>setHidden(x=>({...x,[k]:!x[k]})),title:hidden[k]?'Mostrar':'Esconder',style:{
    display:'flex',alignItems:'center',padding:'5px 10px',borderRadius:8,border:'1px solid var(--border)',fontSize:12,fontWeight:600,cursor:'pointer',
    background:hidden[k]?'transparent':'var(--surface)',color:hidden[k]?'var(--muted)':'var(--text)',opacity:hidden[k]?.55:1}},
    dot(M[k].col),M[k].short);
  return h('div',{className:'card mb-4'},
    h(Shdr,{title:'Dividends',hint:per+' · '+(data.currency||'USD')+(data.source?' · '+data.source:'')}),
    h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:8,margin:'10px 0 6px'}},
      h('div',{style:{fontSize:12,color:'var(--muted)'}},'DPS, yield e payout · '+hist[0].year+'–'+hist[hist.length-1].year+' · cada métrica na sua escala'),
      h('div',{style:{display:'flex',gap:4,padding:3,background:'var(--s2)',border:'1px solid var(--border)',borderRadius:10}},KEYS.map(legend))
    ),
    h('div',{style:{overflowX:'auto'}},
      h('div',{style:{display:'flex',alignItems:'flex-end',gap:10,height:CH+44,minWidth:hist.length*Math.max(36,shown.length*16+12),paddingTop:4}},
        hist.map((r,i)=>{
          const last=i===hist.length-1;
          return h('div',{key:r.year,title:tip(r,i),style:{flex:1,minWidth:Math.max(30,shown.length*14),display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'flex-end',gap:4}},
            h('div',{style:{display:'flex',alignItems:'flex-end',justifyContent:'center',gap:2,width:'100%',height:CH+16}},
              shown.map(k=>{
                const v=Number.isFinite(r[k])?r[k]:null;
                return h('div',{key:k,title:M[k].label+' '+r.year+': '+fm(k,r),style:{flex:1,maxWidth:16,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'flex-end',height:'100%'}},
                  h('div',{style:{width:'100%',height:v==null?0:Math.max(3,Math.round(v/maxOf[k]*CH)),background:M[k].col,opacity:last?1:.75,borderRadius:'3px 3px 0 0'}})
                );
              })
            ),
            h('div',{style:{fontSize:12,color:last?'var(--text)':'var(--muted)',fontWeight:last?700:400}},r.year)
          );
        })
      )
    ),
    h('div',{className:'card-table overflow-x-auto',style:{marginTop:14}},
      h('table',{style:{width:'100%',borderCollapse:'collapse',fontSize:12}},
        h('thead',null,h('tr',null,
          h('th',{className:'text-left'},per),
          hist.map(r=>h('th',{key:r.year,className:'text-right'},r.year))
        )),
        h('tbody',null,KEYS.map(k=>h('tr',{key:k},
          h('td',{className:'text-left',style:{whiteSpace:'nowrap',color:'var(--muted)'}},h('span',{style:{display:'inline-flex',alignItems:'center'}},dot(M[k].col),M[k].label)),
          hist.map(r=>h('td',{key:r.year,className:'text-right',style:{fontFamily:'var(--mono)',color:Number.isFinite(r[k])?M[k].col:'var(--muted)'}},fm(k,r)))
        )))
      )
    )
  );
}

          [
            ['Cotação de referência',m.price!=null?curSymT+m.price:'—'],
            ['Dividend Yield',m.yield!=null?(m.yield*100).toFixed(2)+'%':'—'],
            ['Dividendo anual',m.annualDividend!=null?curSymT+m.annualDividend:'—'],
            ['Fair Value (base)',m.fairValue!=null?'~'+curSymT+m.fairValue:'—'],
            ['Score',m.score!=null?m.score+' / 100':'—'],
            ['Convicção',m.conviction!=null?convStars(m.conviction):'—'],
          ].map(([label,val])=>h('div',{key:label,style:{background:'var(--s2)',borderRadius:8,padding:'8px 10px'}},
            h('div',{style:{fontSize:11,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.05em'}},label),
            h('div',{style:{fontSize:13,fontWeight:700,marginTop:2}},val)
          ))
        )
      ),

      (showFactT||showSigT)&&h('div',{className:showFactT&&showSigT?'split-8-4 mb-4':'mb-4'},
        showFactT&&h('div',{className:'split-8'},h('div',{className:'card',style:{height:'100%'}},
          h(Shdr,{title:'Factores'}),
          h('div',{style:{marginTop:10}},h(StockFactors,{q:factorsQ}))
        )),
        showSigT&&h('div',{className:'split-4'},h('div',{className:'card',style:{height:'100%'}},
          h(Shdr,{title:'Sinais',hint:'DGR 1Y vs 5Y'}),
          h('div',{style:{marginTop:10}},h(StockSignals,{q:factorsQ}))
        ))
      ),

      ticker&&h('div',{className:isEtfT&&!(t.scorecard||[]).length?'mb-4':'grid grid-cols-1 sm:grid-cols-2 gap-5 mb-4'},
        // Left column: dividend quality, then the thesis' financial quality table under it.
        h('div',{style:{display:'flex',flexDirection:'column',gap:20}},
          h('div',{className:'card'},
            h(Shdr,{title:'Qualidade do Dividendo'}),
            h('div',{style:{marginTop:8}},isEtfT?h('div',{style:{fontSize:12,color:'var(--muted)',fontStyle:'italic'}},'N/A — ETFs não têm métricas de qualidade por empresa.'):h(StockDividendQuality,{q:factorsQ||{}}))
          ),
          (t.financials||[]).length>0&&h('div',{className:'card',style:{flex:1}},
            h(Shdr,{title:'Financial Quality'}),
            h(TesesFinancials,{years:t.financialsYears,rows:t.financials})
          )
        ),
        (!isEtfT||(t.scorecard||[]).length>0)&&h('div',{className:'card',style:{height:'100%'}},
          h(Shdr,{title:(t.scorecard||[]).length?'Fundamentais & Scorecard':'Fundamentais'}),
          !isEtfT&&h('div',{style:{marginTop:8}},h(StockFundamentals,{q:factorsQ||{}})),
          h(TesesScorecard,{items:t.scorecard,total:t.scorecardTotal})
        )
      ),

      h(TesesSwot,{swot:t.swot}),

      t.dividends&&h(TesesDividends,{key:ticker,data:t.dividends}),

      h('div',{className:'card mb-4'},
        h(Shdr,{title:'1. A Tese em Poucas Palavras'}),
        h('p',{style:{fontSize:14,lineHeight:1.6,marginTop:8,whiteSpace:'pre-wrap'}},t.thesis||'Por preencher.')
      ),

      h('div',{className:'card mb-4'},
        h(Shdr,{title:'2. Moat / Vantagem Competitiva',hint:t.moat?.rating!=null?('Moat: '+convStars(t.moat.rating)):null}),
        h('div',{style:{marginTop:8}},TesesList(t.moat?.points))
      ),

      h('div',{className:'card mb-4'},
        h(Shdr,{title:'3. Principal Risco'}),
        h('p',{style:{fontSize:14,lineHeight:1.6,marginTop:8,whiteSpace:'pre-wrap'}},t.mainRisk||'Por preencher.')
      ),

      h('div',{className:'card mb-4'},
        h(Shdr,{title:'4. Resposta Estratégica'}),
        h('div',{style:{marginTop:8}},TesesList(t.strategicResponse))
      ),

      h('div',{className:'card mb-4'},
        h(Shdr,{title:'5. Growth Thesis'}),
        h('p',{style:{fontSize:14,lineHeight:1.6,marginTop:8,whiteSpace:'pre-wrap'}},t.growthThesis||'Por preencher.')
      ),

      // Bull and Bear cases side by side (stacked on narrow screens).
      h('div',{className:'grid grid-cols-1 sm:grid-cols-2 gap-5 mb-4'},
        h('div',{className:'card'},
          h(Shdr,{title:'6. Bull Case'}),
          h('div',{style:{marginTop:8}},TesesList(t.bullCase,'var(--green)'))
        ),
        h('div',{className:'card'},
          h(Shdr,{title:'7. Bear Case'}),
          h('div',{style:{marginTop:8}},TesesList(t.bearCase,'var(--red)'))
        )
      ),

      h('div',{className:'card mb-4'},
        h(Shdr,{title:'8. O Que Destruiria a Tese?'}),
        h('div',{style:{marginTop:8}},TesesList(t.whatWouldBreakThesis,'var(--red)'))
      ),

      h('div',{className:'card mb-4'},
        h(Shdr,{title:'9. Decisão Final'}),
        h('div',{style:{marginTop:8}},
          TesesRow('Rating',t.finalDecision?.rating),
          TesesRow('Fair value',t.finalDecision?.fairValue),
          TesesRow('Dividend yield',t.finalDecision?.dividendYield),
          TesesRow('Expected long-term EPS growth',t.finalDecision?.epsGrowth),
          TesesRow('Expected dividend growth',t.finalDecision?.divGrowth),
          TesesRow('Expected total return',t.finalDecision?.totalReturn),
        ),
        t.keyPhrase&&h('div',{style:{marginTop:14,padding:'12px 16px',background:'var(--s2)',borderRadius:8,borderLeft:'3px solid var(--gold)',fontStyle:'italic',fontSize:14,lineHeight:1.6}},
          '“'+t.keyPhrase+'”'
        ),
        t.followUpQuestion&&h('div',{style:{marginTop:14}},
          h('div',{style:{fontSize:12,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:4}},'Pergunta de Acompanhamento Trimestral'),
          h('p',{style:{fontSize:13,lineHeight:1.6}},t.followUpQuestion)
        )
      )
    )
  );
}

function SoldPage({sold,setSold,cfg}){
  const SOLD=sold||[];
  const[soldFlt,setSoldFlt]=useState('TODAS');
  const fx=cfg?.fxEurUsd||1.1; // 1 EUR = fx USD
  const toEur=(p,val)=>p.cat==='USD'?val/fx:val;

  // Delegate to shared top-level utility
  const holdingYears=(entry,exit)=>calcHoldingYears(entry,exit);

  const isEtf=p=>p.cat==='ETF'||(p.sec&&p.sec.startsWith('ETF'));
  const soldAll=SOLD.filter(p=>soldFlt==='TODAS'||(soldFlt==='Acções'&&!isEtf(p))||(soldFlt==='ETFs'&&isEtf(p)));
  const closedWithData=soldAll.filter(p=>{const s=getSoldSummary(p);return s.quantity>0&&s.grossProceeds>0&&s.costBasis>0;});
  const closedPartial=soldAll.filter(p=>!closedWithData.includes(p));
  // All monetary totals in EUR (USD converted via fx rate)
  const {totCost,totReal,totDiv}=closedWithData.reduce((acc,p)=>({
    totCost:acc.totCost+toEur(p,getSoldSummary(p).costBasis),
    totReal:acc.totReal+toEur(p,getSoldSummary(p).proceeds),
    totDiv:acc.totDiv+toEur(p,getSoldDivTotal(p)),
  }),{totCost:0,totReal:0,totDiv:0});
  const totPl=totReal-totCost;
  const totTotal=totPl+totDiv;

  // read-only display helpers (editing happens in Config → 📁 Holdings - Sold)
  const noteTxt=(t,p)=>h('span',{className:'text-[10px] text-[var(--muted)]'},p.note||'—');

  const divIn=(t,p)=>{
    // Non-distributive: EUR ETF with 0 div
    if(p&&p.cat==='EUR'&&(p.div||0)===0)
      return h('span',{style:{color:'var(--muted)',fontSize:13}},'-');
    const divVal=getSoldDivTotal(p);
    return h('span',{style:{fontSize:13,fontFamily:'var(--mono)',color:divVal>0?'var(--green)':'var(--muted)'}},
      divVal>0?fn(divVal):'—');
  };

  return h('div',null,
    h('div',{style:{display:'flex',gap:6,marginBottom:12}},
      ['TODAS','Acções','ETFs'].map(f=>h('button',{key:f,
        onClick:()=>setSoldFlt(f),
        className:'fb'+(soldFlt===f?' on':''),
      },f==='TODAS'?'Todas':f))
    ),
    h(Shdr,{title:'Posições Fechadas'}),

    (()=>{
      const byYear=closedWithData.reduce((a,p)=>{
        const exitDate=getSoldSummary(p).exitDate;
        const y=exitDate?exitDate.slice(0,4):'—';
        return{...a,[y]:[...(a[y]||[]),p]};
      },{});
      const years=Object.keys(byYear).sort((a,b)=>b-a);
      const headers=['Ticker','Qtd','Data Compra','Valor Compra','Data Venda','Valor Venda','Duração','Realizado','Dividendos','Total','P&L%','Total%'];
      const renderRow=p=>{
        const sym=currencySymbol(p.cat);
        const summary=getSoldSummary(p);
        const av=summary.quantity>0?summary.costBasis/summary.quantity:getAv(p);
        const cost=summary.costBasis,pl=summary.pl,plp=cost>0?pl/cost:null;
        const div=getSoldDivTotal(p);
        const total=pl+div;
        const totalp=cost>0?total/cost:null;
        const yrs=holdingYears(summary.entryDate,summary.exitDate);
        const yrsLabel=yrs!=null?(yrs<1?(yrs*12).toFixed(0)+'m':(yrs).toFixed(1)+'y'):null;
        return h('tr',{key:p.t},
          h('td',{className:'font-semibold'},p.t.replace(/_[12]$/,'')),
          h('td',{style:{textAlign:'right',color:'var(--muted)',fontFamily:'var(--mono)',fontSize:12}},fn(summary.quantity,summary.quantity%1===0?0:2)),
          h('td',null,summary.entryDate||'—'),
          h('td',{className:'text-muted'},sym+fn(av)),
          h('td',null,summary.exitDate||'—'),
          h('td',null,sym+fn(summary.averageSellPrice)),
          h('td',{className:'mono-sm-muted'},yrsLabel||'—'),
          h('td',{className:pl>=0?'text-[var(--green)]':'text-[var(--red)]'},(pl>=0?'+':'-')+sym+fn(Math.abs(pl))),
          h('td',null,divIn(p.t,p)),
          h('td',{className:'font-bold '+(total>=0?'text-[var(--green)]':'text-[var(--red)]')},(total>=0?'+':'-')+sym+fn(Math.abs(total))),
          h('td',{className:'font-bold '+(plp!=null?(plp>=0?'text-[var(--green)]':'text-[var(--red)]'):'')},plp!=null?fp(plp):'—'),
          h('td',{className:'font-bold '+(totalp!=null?(totalp>=0?'text-[var(--green)]':'text-[var(--red)]'):'')},totalp!=null?fp(totalp):'—'),
        );
      };
      return h('div',null,
        years.map(y=>{
          const rows=byYear[y];
          const yTotCost=rows.reduce((s,p)=>s+toEur(p,getSoldSummary(p).costBasis),0);
          const yTotReal=rows.reduce((s,p)=>s+toEur(p,getSoldSummary(p).proceeds),0);
          const yTotPl=rows.reduce((s,p)=>s+toEur(p,getSoldSummary(p).pl),0);
          const yTotDiv=rows.reduce((s,p)=>s+toEur(p,getSoldDivTotal(p)),0);
          const yTotTotal=yTotPl+yTotDiv;
          return h('div',{key:y,style:{marginTop:24,marginBottom:20}},
            h('div',{style:{fontSize:13,fontWeight:700,color:'var(--gold)',marginBottom:6,letterSpacing:'.06em'}},y),
            h('div',{className:'card-table overflow-x-auto'},
              h('table',null,
                h('thead',null,h('tr',null,headers.map(x=>h('th',{key:x},x)))),
                h('tbody',null,
                  ...rows.map(renderRow),
                  h('tr',{className:'bg-[var(--s2)]'},
                    h('td',{className:'font-semibold text-[var(--gold)]'},y+' TOTAL'),
                    h('td'),
                    h('td'),
                    h('td',{className:'text-muted'},'€'+fn(yTotCost)),
                    h('td'),
                    h('td',{className:'text-muted'},'€'+fn(yTotReal)),
                    h('td'),
                    h('td',{className:yTotPl>=0?'text-[var(--green)]':'text-[var(--red)]'},(yTotPl>=0?'+':'-')+'€'+fn(Math.abs(yTotPl))),
                    h('td',{className:'text-[var(--green)]'},yTotDiv>0?'€'+fn(yTotDiv):'—'),
                    h('td',{className:'font-bold '+(yTotTotal>=0?'text-[var(--green)]':'text-[var(--red)]')},(yTotTotal>=0?'+':'-')+'€'+fn(Math.abs(yTotTotal))),
                    h('td',{colSpan:2})
                  )
                )
              )
            )
          );
        }),
        closedPartial.length>0&&h('div',{style:{marginTop:12,opacity:.7}},
          h('div',{style:{fontSize:12,fontWeight:700,color:'var(--muted)',marginBottom:6,textTransform:'uppercase',letterSpacing:'.06em'}},'Sem dados suficientes'),
          closedPartial.map(p=>h('div',{key:p.t,style:{fontSize:13,padding:'4px 0',borderBottom:'1px solid var(--border)',color:'var(--muted)',display:'flex',gap:12}},
            h('span',{className:'font-semibold'},p.t),
            h('span',null,noteTxt(p.t,p))
          ))
        ),
        h('div',{style:{marginTop:12,padding:'8px 12px',background:'var(--s2)',borderRadius:6,display:'flex',gap:24,fontSize:13,flexWrap:'wrap'}},
          h('span',{className:'font-bold text-[var(--gold)]'},'TOTAL GERAL'),
          h('span',{className:'text-muted'},'Compra: €'+fn(totCost)),
          h('span',{className:'text-muted'},'Venda: €'+fn(totReal)),
          h('span',{className:totPl>=0?'text-[var(--green)]':'text-[var(--red)]'},'P&L: '+(totPl>=0?'+':'-')+'€'+fn(Math.abs(totPl))),
          totDiv>0&&h('span',{className:'text-[var(--green)]'},'Div: €'+fn(totDiv)),
          h('span',{className:'font-bold '+(totTotal>=0?'text-[var(--green)]':'text-[var(--red)]')},'Total: '+(totTotal>=0?'+':'-')+'€'+fn(Math.abs(totTotal)))
        )
      );
    })()
  );
}

ReactDOM.render(h(AppErrorBoundary,null,h(App)),document.getElementById('root'));
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(e){console.warn('SW falhou',e)})})}
</script>
